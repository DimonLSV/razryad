<title>РАЗРЯД · Пособие термиста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./v99.css">
<style>
:root{
  --ink:#0B0B0D; --panel:#141417; --panel2:#1B1B20; --panel3:#232329;
  --line:#2C2C34; --orange:#FF6B00; --ember:#FFA23A; --hot:#FFD166;
  --steel:#93939D; --paper:#F2EFEA; --red:#D93A2B; --ok:#5BC46B;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation;background:#050506;color:var(--paper);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

/* ---------- device frame (mockup) ---------- */
.stage{width:100%;display:flex;justify-content:center;align-items:center;padding:24px 12px}
.device{
  width:412px;height:900px;max-height:calc(100vh - 48px);
  background:var(--ink);border-radius:38px;position:relative;overflow:hidden;
  border:9px solid #17171b;box-shadow:0 0 0 2px #35353d,0 40px 90px rgba(0,0,0,.75),0 0 120px rgba(255,107,0,.07);
}
@media (max-width:760px){
  .stage{padding:0}
  .device{width:100vw;height:100vh;height:100svh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
}
.statusbar{height:26px;margin-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--steel);letter-spacing:.02em}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar i{width:5px;height:5px;border-radius:50%;background:var(--steel);display:block}

/* ---------- app shell ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:0 0 calc(104px + env(safe-area-inset-bottom,0px))}
.screen::-webkit-scrollbar{width:0}

/* ---------- header ---------- */
header{
  padding:8px 16px 12px;background:linear-gradient(180deg,#141418 0%,#0B0B0D 100%);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;flex:none}
.brandtxt{line-height:1}
.brandtxt b{font-family:"Oswald",sans-serif;font-weight:600;font-size:17px;letter-spacing:.16em;
  text-transform:uppercase;display:block;color:var(--paper)}
.brandtxt span{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);
  font-family:"Oswald",sans-serif;font-weight:400}
.htitle{font-family:"Oswald",sans-serif;font-weight:600;font-size:26px;letter-spacing:.01em;
  margin:14px 0 2px;text-transform:uppercase}
.hsub{font-size:12.5px;color:var(--steel);margin:0}

/* search */
.search{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--panel2);
  border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.search input{background:none;border:0;outline:0;color:var(--paper);font-size:14.5px;width:100%;
  font-family:"IBM Plex Sans",sans-serif}
.search input::placeholder{color:#6A6A74}
.search svg{flex:none;opacity:.6}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);
  color:var(--steel);font-size:12px;white-space:nowrap;cursor:pointer;transition:.15s;font-weight:500}
.chip.on{background:var(--orange);border-color:var(--orange);color:#120800;font-weight:600}

/* ---------- cards ---------- */
.wrap{padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px;
  position:relative;overflow:hidden}
.card:active{border-color:#3b3b45}
.card .glow{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);opacity:.9}
.grade{font-family:"Oswald",sans-serif;font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);
  font-family:"Oswald",sans-serif;font-weight:500}
.analog{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--steel);margin-top:6px;line-height:1.5}
.hrcbox{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--hot);font-weight:600;white-space:nowrap}

/* ---------- signature: heat ribbon ---------- */
.ribbon{position:relative;height:8px;border-radius:4px;margin:12px 0 16px;
  background:linear-gradient(90deg,#26262c 0%,#3a1c14 18%,#8B1A0E 36%,#D93A2B 50%,#FF6B00 66%,#FFB03A 80%,#FFE7B0 92%,#FFFDF6 100%)}
.ribbon .pin{position:absolute;top:-5px;width:2px;height:18px;background:var(--paper);border-radius:1px;
  box-shadow:0 0 8px rgba(255,255,255,.75)}
.ribbon .pin::after{content:attr(data-l);position:absolute;top:20px;left:50%;transform:translateX(-50%);
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--steel);white-space:nowrap}
.ribbon.mini{height:5px;margin:10px 0 6px;border-radius:3px}
.ribbon.mini .pin{top:-3px;height:11px;width:2px}
.ribbon.mini .pin::after{display:none}
.scalelab{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;color:#5E5E68;margin-top:-8px}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:"Oswald",sans-serif;font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--steel);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:9px 8px;border-bottom:1px solid #202027;vertical-align:top}
td.num{font-family:"IBM Plex Mono",monospace;color:var(--hot);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tscroll::-webkit-scrollbar{height:0}
.tscroll table{min-width:520px}

/* ---------- detail sheet ---------- */
.sheet{position:absolute;inset:0;background:var(--ink);z-index:60;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateY(0)}
.sheethead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  background:var(--panel)}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;flex:none;color:var(--paper)}
.iconbtn:active{background:var(--panel3)}
.sheetbody{flex:1;overflow-y:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.sec{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);
  margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:4px}

.op{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:10px;padding:11px 12px;margin-bottom:9px}
.opname{font-family:"Oswald",sans-serif;font-size:14px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.opgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;margin-top:9px}
.f{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#6E6E78;font-family:"Oswald",sans-serif}
.v{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--paper);margin-top:2px}
.v.hot{color:var(--ember)}
.note{background:var(--panel2);border:1px dashed #3a3a44;border-radius:10px;padding:11px 12px;
  font-size:13px;line-height:1.55;color:#CFCCC6}
.note b{color:var(--ember);font-weight:600}
.warn{border-color:#5a2a1c;background:#1d1210}
.warn b{color:var(--red)}

/* ---------- forms ---------- */
label.fld{display:block;margin-bottom:11px}
label.fld span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--steel);
  font-family:"Oswald",sans-serif;margin-bottom:5px}
input[type=text],textarea,select{-webkit-appearance:none;appearance:none;font-size:16px;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--paper);
  border-radius:10px;padding:10px 11px;font-size:14px;outline:0;font-family:"IBM Plex Sans",sans-serif}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
textarea{min-height:82px;resize:vertical;line-height:1.5}
.opedit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;
  border:0;background:var(--orange);color:#150900;font-family:"Oswald",sans-serif;font-size:14px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn:active{background:#e05f00}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
.btn.danger{background:transparent;border:1px solid #5a2a24;color:var(--red)}
.btnrow{display:flex;gap:9px;margin-top:14px}

/* ---------- calculator ---------- */
.calc{background:linear-gradient(160deg,#1d1410,#141417);border:1px solid #38251a;border-radius:var(--r);padding:14px;margin-bottom:12px}
.out{font-family:"Oswald",sans-serif;font-size:34px;color:var(--ember);letter-spacing:.02em;line-height:1;margin-top:12px}
.out small{font-size:14px;color:var(--steel);letter-spacing:.06em;margin-left:6px}
input[type=range]{width:100%;accent-color:var(--orange);margin:6px 0 0}

/* ---------- FAB + nav ---------- */
.fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;background:var(--orange);
  display:grid;place-items:center;box-shadow:0 10px 26px rgba(255,107,0,.32);cursor:pointer;z-index:30;color:#150900}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(58px + env(safe-area-inset-bottom,0px));background:rgba(15,15,18,.94);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 0.66fr;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7C7C87;
  font-size:8.5px;font-family:"Oswald",sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.nb.on{color:var(--orange)}
.nb span{display:block;margin-top:1px}
.nb svg{width:20px;height:20px;flex:none}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--steel);padding:46px 24px;font-size:13.5px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel3);
  border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.splash{position:absolute;inset:0;background:var(--ink);z-index:99;display:grid;place-items:center;
  animation:fade .5s ease 1.5s forwards}
.splash .in{text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1)}
.splash .cap{margin-top:14px;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.34em;color:var(--orange);text-transform:uppercase}
@keyframes fade{to{opacity:0;visibility:hidden}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.credit{text-align:center;font-size:9.5px;letter-spacing:.13em;color:#4E4E58;font-family:"Oswald",sans-serif;
  text-transform:uppercase;padding:18px 16px 6px}
.tbox{border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#141417}
.tbox.exp{border-color:#4a331a;background:#1c1409}
.tbox .out{font-size:26px;margin-top:2px}
.logline{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.75;color:#CFCCC6;margin-top:7px}
.logline b{color:var(--ember);font-weight:500}
.delrec{color:var(--red);font-family:"Oswald",sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.chipsrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.dia{width:100%;height:auto;background:#0F0F12;border:1px solid var(--line);border-radius:11px;margin:8px 0 4px;display:block}
.dia text{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:#93939D}
.dia text.lb{fill:#FFA23A;font-size:10px}
.dia .ax{stroke:#5A5A66;stroke-width:1}
pre.blk{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.7;background:#0F0F12;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;overflow-x:auto;margin:9px 0 0;color:#DCD9D3;white-space:pre-wrap}
.hint{font-size:11.5px;color:#6E6E78;line-height:1.5;margin-top:10px}
.usernote{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ember);
  border-radius:10px;padding:10px 12px;margin-bottom:9px;font-size:13.5px;line-height:1.5;color:#DDDAD4;white-space:pre-wrap}
.nmeta{display:flex;justify-content:space-between;align-items:center;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;color:#6E6E78;margin-bottom:6px}
.nmeta span{color:var(--red);cursor:pointer;font-family:"Oswald",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.nbadge{display:inline-flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--ember);background:#2a1c0d;border:1px solid #4a331a;border-radius:6px;padding:1px 6px}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:6px;
  background:var(--panel3);color:var(--steel);margin:0 4px 4px 0}

/* на телефоне меню прибито к низу видимой области силами браузера */
@media (max-width:760px){
  .statusbar{display:none}
  nav{position:fixed !important;left:0;right:0;bottom:0;
    height:auto !important;min-height:56px;
    padding:7px 0 calc(7px + env(safe-area-inset-bottom,0px)) !important}
  .nb{padding:0 2px !important;gap:4px !important}
  .nb span{display:block;font-size:10.5px;line-height:1.1;white-space:nowrap}
  .screen{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px)) !important}
  .sheetbody{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px)) !important}
  .fab{position:fixed !important;bottom:calc(88px + env(safe-area-inset-bottom,0px)) !important}
  .toast{position:fixed !important;bottom:calc(96px + env(safe-area-inset-bottom,0px)) !important}
}
</style>
</head>
<body>
<div class="stage">
<div class="device">

  <!-- splash -->
  <div class="splash" id="splash"><div class="in">
    <svg width="96" height="96" viewBox="0 0 120 120"><use href="#logo"/></svg>
    <div class="cap">Пособие термиста</div>
    <div style="margin-top:26px;font-size:9.5px;letter-spacing:.14em;color:#4E4E58;font-family:Oswald;text-transform:uppercase">Разработал Онянов Дмитрий Сергеевич</div>
  </div></div>

  <div class="statusbar">
    <span id="clock">08:20</span>
    <span class="dots"><i></i><i></i><i></i><span style="font-size:10px">РАЗРЯД</span></span>
  </div>

  <div class="app">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 120 120"><use href="#logo"/></svg>
        <div class="brandtxt"><b>РАЗРЯД</b><span id="vhead">Термист</span></div>
      </div>
      <h1 class="htitle" id="ttl">Марочник</h1>
      <p class="hsub" id="sub">Режимы закалки и отпуска</p>
      <div class="search" id="searchbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Марка, аналог, группа…" autocomplete="off">
      </div>
    </header>
    <div class="chips" id="chips"></div>
    <div class="screen" id="screen"></div>
  </div>

  <div class="fab" id="fab" title="Добавить">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </div>

  <nav id="nav"></nav>

  <!-- detail / editor sheet -->
  <div class="sheet" id="sheet">
    <div class="sheethead">
      <div class="iconbtn" id="close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div id="sheetTitle" style="font-family:Oswald;font-size:19px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        <div id="sheetSub" style="font-size:11px;color:var(--steel)"></div>
      </div>
      <div class="iconbtn" id="editBtn" title="Изменить">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>
      </div>
    </div>
    <div class="sheetbody" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>
</div>

<svg style="display:none">
  <g id="logo">
    <rect x="0" y="0" width="120" height="120" rx="9" fill="#14161B"/>
    <g stroke="#D64822" stroke-width="7.5" stroke-linecap="round"><line x1="28.5" y1="78.7" x2="15.5" y2="84.0"/><line x1="26.0" y1="66.0" x2="12.0" y2="66.0"/><line x1="28.5" y1="53.3" x2="15.5" y2="48.0"/><line x1="91.5" y1="78.7" x2="104.5" y2="84.0"/><line x1="94.0" y1="66.0" x2="108.0" y2="66.0"/><line x1="91.5" y1="53.3" x2="104.5" y2="48.0"/></g>
    <g fill="none" stroke="#FF8C28" stroke-width="5" stroke-linecap="round"><path d="M51 33 q5 -6 0 -11"/><path d="M60 33 q5 -6 0 -11"/><path d="M69 33 q5 -6 0 -11"/></g>
    <path d="M45 45 A15 7.2 0 0 1 75 45 L75 58 L45 58 Z" fill="#FF9226"/>
    <rect x="45" y="57" width="30" height="14" fill="#F4681F"/>
    <rect x="45" y="70" width="30" height="14" fill="#E5451D"/>
    <path d="M45 83 L75 83 L75 97 A15 7.2 0 0 1 45 97 Z" fill="#CE1E1C"/>
    <ellipse cx="60" cy="45" rx="15" ry="7.2" fill="none" stroke="#14161B" stroke-width="3.4"/>
  </g>
</svg>

<script>
/* хранение на устройстве: Safari, Chrome, любой браузер */
if(typeof window.storage==='undefined'){window.storage={
  get:async k=>{const v=localStorage.getItem(k); if(v===null) throw new Error('no key'); return {key:k,value:v};},
  set:async(k,v)=>{localStorage.setItem(k,v); return {key:k,value:v};},
  delete:async k=>{localStorage.removeItem(k); return {key:k,deleted:true};},
  list:async()=>({keys:Object.keys(localStorage)})};}
</script>
<script>
/* ============ storage ============ */
const KEY='repn-thermist-v2';
let volatile=false, DB=null;

async function load(){
  try{ const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); }
  catch(e){ /* нет ключа или хранилище недоступно */ }
  return null;
}
async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(DB)); }
  catch(e){ volatile=true; }
}

function ribbon(temps,mini){
  const pins=temps.filter(Boolean).map(t=>{
    const p=Math.max(0,Math.min(100,(t/1300)*100));
    return `<span class="pin" style="left:${p}%" data-l="${t}°"></span>`;}).join('');
  return `<div class="ribbon${mini?' mini':''}">${pins}</div>`+(mini?'':`<div class="scalelab"><span>0</span><span>650</span><span>1300 °C</span></div>`);
}

  if(tab!=='steels'){c.style.display='none';return;}
  c.style.display='flex';
  c.innerHTML=groups().map(g=>`<div class="chip ${g===filter?'on':''}" data-g="${esc(g)}">${esc(g)}</div>`).join('');
  c.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filter=ch.dataset.g;render();});
}

function viewSteels(){
  const q=$('#q').value.trim().toLowerCase();
  const list=DB.steels.filter(s=>{
    const okG=filter==='Все'||s.group.startsWith(filter);
    const okQ=!q||(s.grade+' '+s.analogs+' '+s.group).toLowerCase().includes(q);
    return okG&&okQ;});
  if(!list.length) return `<div class="empty">Ничего не нашлось.<br>Измените запрос или добавьте марку кнопкой «+».</div>`;
  return `<div class="wrap">`+list.map(s=>{
    const temps=s.ops.map(o=>firstNum(o.t)).filter(Boolean);
    const hard=(s.ops.find(o=>/HRC|HB|HV/.test(o.r))||{}).r||'';
    return `<div class="card" data-open="${s.id}">
      <div class="glow"></div>
      <div class="row"><div class="grade">${esc(s.grade)}</div><div class="hrcbox">${esc(hard)}</div></div>
      <div class="tag" style="margin-top:6px">${esc(s.group)}${(s.notes&&s.notes.length)?` <span class="nbadge">${s.notes.length} зам.</span>`:''}</div>
      ${ribbon(temps,true)}
      <div class="analog">${esc(s.analogs)}</div>
    </div>`;}).join('')+`</div>`;
}

/* ============ сохранение и восстановление записей ============ */
function bkFile(name,text){
  try{
    if(window.Razryad&&window.Razryad.saveText){ const where=window.Razryad.saveText(name,text);
      toast(where&&where.length>3?('Сохранено: '+where):'Не удалось сохранить файл'); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    toast('Файл сохранён');
  }catch(e){ toast('Не удалось сохранить файл'); }
}
async function bkCopy(text){
  try{ await navigator.clipboard.writeText(text); toast('Скопировано в буфер'); return; }catch(e){}
  try{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Скопировано в буфер');
  }catch(e){ toast('Буфер недоступен'); }
}
function bkStamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes()); }

    <line class="ax" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/>
    <line class="ax" x1="${L}" y1="${B}" x2="${L}" y2="${T}"/>
    <path d="M ${x(0)} ${y(911)} Q ${x(0.4)} ${y(830)} ${x(0.8)} ${y(727)}" fill="none" stroke="#FF6B00" stroke-width="2"/>
    <path d="M ${x(0.8)} ${y(727)} Q ${x(1.5)} ${y(870)} ${x(2.14)} ${y(1147)}" fill="none" stroke="#FFA23A" stroke-width="2"/>
    <line x1="${x(0)}" y1="${y(727)}" x2="${x(2.14)}" y2="${y(727)}" stroke="#D93A2B" stroke-width="2"/>
    <circle cx="${x(0.8)}" cy="${y(727)}" r="3.5" fill="#F2EFEA"/>
    <text x="${x(0.55)}" y="${y(727)-8}">0,8 % · 727 °C</text>
    <text class="lb" x="${x(0.3)}" y="${y(950)}">аустенит</text>
    <text x="${x(0.02)}" y="${y(670)}">феррит</text>
    <text x="${x(1.15)}" y="${y(660)}">перлит + цементит</text>
    <text x="${x(0.02)}" y="${y(900)-6}">A3</text>
    <text x="${x(1.9)}" y="${y(1030)}">Acm</text>
    <text x="${x(1.95)}" y="${y(727)-6}">A1</text>
    <text x="${L-40}" y="${T+4}">1150 °C</text>
    <text x="${L-30}" y="${B+3}">600</text>

  </svg>`;
}

             C ${L+140} ${yA+86}, ${L+180} ${yA+92}, ${R-6} ${yA+96}" fill="none" stroke="#FFA23A" stroke-width="2"/>

function tpHRC(f,T){
  const p=f.pts;
  if(T<=p[0][0]) return p[0][1];
  if(T>=p[p.length-1][0]) return p[p.length-1][1];
  for(let i=0;i<p.length-1;i++){ if(T>=p[i][0]&&T<=p[i+1][0])
    return p[i][1]+(T-p[i][0])*(p[i+1][1]-p[i][1])/(p[i+1][0]-p[i][0]); }
  return p[p.length-1][1];
}
/* прогноз твёрдости по справочной кривой с поправкой на фактическую закалку */
function tpPred(f,T,asq){ return tpHRC(f,T)-(f.asq-(+asq||f.asq)); }

/* поправка, выученная по журналу: насколько факт отличается от расчёта */
function tpCorr(famId){
  const f=TC.find(x=>x.id===famId);
  const recs=(DB.temperLog||[]).filter(r=>r.fam===famId&&r.tUsed&&r.hrcGot).slice(0,8);
  if(!f||!recs.length) return {n:0,dT:0,err:0};
  let sum=0; recs.forEach(r=>{ sum+=r.hrcGot-tpPred(f,r.tUsed,r.asq); });
  const err=sum/recs.length;
  return {n:recs.length,err,dT:Math.max(-60,Math.min(60,err*10))};
}

/* справочная температура без поправки */
function tpRoots(f,eff){
  const p=f.pts, out=[];
  for(let i=0;i<p.length-1;i++){
    const [t1,h1]=p[i],[t2,h2]=p[i+1];
    if((h1>=eff&&h2<=eff)||(h1<=eff&&h2>=eff))
      out.push(t1+(h1===h2?0:(eff-h1)*(t2-t1)/(h2-h1)));
  }
  return out;
}
function tpBase(f,asq,lo,hi){
  const mid=(lo+hi)/2, shift=f.asq-asq, eff=mid+shift, p=f.pts;
  let roots=tpRoots(f,eff);
  if(f.forb){ const ok=roots.filter(T=>T<f.forb[0]||T>f.forb[1]); if(ok.length) roots=ok; }
  let alt=[];
  if(f.secondary && roots.length>1){ const top=Math.max.apply(null,roots); alt=roots.filter(x=>x!==top); roots=[top]; }
  else if(roots.length>1) alt=roots.slice(1);
  let T=roots.length?roots[0]:null, edge='';
  if(T===null){ if(eff>p[0][1]){T=p[0][0];edge='low';} else {T=p[p.length-1][0];edge='high';} }
  const Tr=Math.round(T/10)*10;
  return {T:Tr, shift, edge, alt:alt.map(x=>Math.round(x/10)*10).filter(x=>x!==Tr)};
}

function tpCalc(){
  let info0='';
  const f=TC.find(x=>x.id===$('#tpG').value); if(!f) return;
  const asq=+$('#tpA').value||0, sec=+$('#tpS').value||0;
  let lo=+$('#tpLo').value||0, hi=+$('#tpHi').value||0;
  if(hi<lo){const t=lo;lo=hi;hi=t;}
  const wrap=$('#tpOutWrap'), info=$('#tpInfo');
  const box=(cls,txt)=>`<div class="card"><div class="note ${cls}">${txt}</div></div>`;
  tpLog();
  if(f.secondary && asq<=hi) info0='sec';
  if(!asq||!lo||!hi){ wrap.innerHTML='<div class="out">—</div>'; info.innerHTML=''; return; }
  if(asq<=hi && !f.secondary){
    wrap.innerHTML='<div class="out">—<small style="font-size:13px">отпуском не поднять</small></div>';
    info.innerHTML=box('warn',`<b>Твёрдость до отпуска ${asq} HRC не выше требуемого предела ${hi} HRC.</b> Отпуск твёрдость только снижает. Причина обычно в недогреве под закалку, обезуглероженном слое или слабой закалочной среде — деталь идёт на повторную закалку с проверкой печи по термопаре.`);
    return;
  }
  const b=tpBase(f,asq,lo,hi), T=b.T, cor=tpCorr(f.id);
  let T2=cor.n?Math.round((T+cor.dT)/10)*10:null;
  if(T2===T) T2=null;
  $('#tpUsed').value=T2||T;

  if(T2===null){
    wrap.innerHTML=`<div class="f">Рекомендуемая температура отпуска</div>
      <div class="out">${T}<small>°C ± 15</small></div>
      <div class="hint">${cor.n?`Справочник и ваш опыт (${cor.n} зап.) дают одну и ту же температуру.`:'Пока считает только справочник — в журнале нет записей по этой группе.'}</div>`;
  } else {
    wrap.innerHTML=`<div class="f" style="margin-bottom:7px">Рекомендуемая температура отпуска</div>
      <div class="two">
        <div class="tbox"><div class="f">По справочнику</div><div class="out">${T}<small>°C</small></div></div>
        <div class="tbox exp"><div class="f">По вашему опыту · ${cor.n} зап.</div><div class="out">${T2}<small>°C</small></div></div>
      </div>
      <div class="hint">Расхождение ${(T2>T?'+':'')+(T2-T)} °C. Решение за вами: справочник — усреднённая кривая, опыт — ваши печь, садка и плавка.</div>`;
  }

  const hold=Math.max(90,Math.round(sec*2/10)*10);
  let msgs=[`<div class="card"><div class="glow"></div><div class="tag">Режим отпуска</div>
    <div class="opgrid" style="margin-top:10px">
      <div><div class="f">Температура</div><div class="v hot">${T2||T} ± 15 °C</div></div>
      <div><div class="f">Выдержка</div><div class="v">${hold} мин</div></div>
      <div><div class="f">Охлаждение</div><div class="v">${esc(f.cool)}</div></div>
      <div><div class="f">Число отпусков</div><div class="v">${f.rep}</div></div>
    </div>
    <div class="hint">Выдержка считана как 2 мин на 1 мм сечения, но не менее 90 мин, и отсчитывается от выхода печи на температуру.</div></div>`];

  if(cor.n){
    const zn=cor.err>0?'выше':'ниже';
    msgs.push(box('',`<b>Поправка по журналу.</b> По ${cor.n} ${cor.n===1?'записи':'записям'} для этой группы фактическая твёрдость выходит в среднем на ${Math.abs(cor.err).toFixed(1)} HRC ${zn} расчёта, поэтому температура сдвинута на ${(cor.dT>0?'+':'')+Math.round(cor.dT)} °C.`
      +(cor.n<3?' Записей пока мало — поправка ориентировочная, проверяйте на образце.':'')));
  }
  if(info0==='sec') msgs.push(box('','У этой стали отпуск твёрдость <b>повышает</b>: при 500–560 °C выделяются карбиды и превращается остаточный аустенит — это вторичная твёрдость. Поэтому требуемый предел выше закалочной твёрдости здесь нормален.'));
  if(b.alt&&b.alt.length) msgs.push(box('','Ту же твёрдость даёт и '+b.alt.join(', ')+' °C — низкотемпературная ветка. Для этой стали её не применяют: рабочий режим на вторичную твёрдость выше.'));
  if(b.edge==='low') msgs.push(box('','Требуемая твёрдость выше того, что даёт эта группа даже при минимальном отпуске. Взят низший режим — твёрдость получится выше заказанной.'));
  if(b.edge==='high') msgs.push(box('warn','Требуемая твёрдость ниже, чем даёт отпуск в рабочем диапазоне. Нужен высокий отпуск на верхнем пределе, а при недоборе — отжиг или нормализация.'));
  if(b.shift>2) msgs.push(box('',`Закалка дала ${asq} HRC при типовых для группы ${f.asq} HRC. Температура снижена примерно на ${Math.round(b.shift*10)} °C относительно справочной, иначе деталь уйдёт ниже нижнего предела.`));
  if(b.shift<-2) msgs.push(box('',`Закалка дала ${asq} HRC — выше типовых ${f.asq} HRC для группы. Температура поднята примерно на ${Math.round(-b.shift*10)} °C.`));
  const Tf=T2||T;
  if(f.forb&&Tf>=f.forb[0]&&Tf<=f.forb[1]){
    const a=Math.round(tpPred(f,f.forb[0],asq)), c=Math.round(tpPred(f,f.forb[1],asq));
    msgs.push(box('warn',`<b>Расчёт попал в запрещённый интервал ${f.forb[0]}–${f.forb[1]} °C.</b> Выбирайте край: ${f.forb[0]} °C даёт примерно ${a} HRC, ${f.forb[1]} °C — примерно ${c} HRC. Требуемый диапазон придётся согласовать с конструктором.`));
  }
  (f.w||[]).forEach(w=>msgs.push(box('',w)));
  msgs.push(box('warn','Расчёт справочный. Перед садкой прогоняйте образец-свидетель из той же плавки и того же сечения, замеряйте твёрдость в трёх точках и записывайте результат в журнал — со следующей садки программа будет считать по вашим данным.'));
  info.innerHTML=msgs.join('');
}

/* журнал: сопоставление «до отпуска → рекомендовано → применено → получилось» */
function tpLog(){
  const el=$('#tpLog'); if(!el) return;
  const cur=$('#tpG')?$('#tpG').value:null;
  const L=DB.temperLog||[];
  if(!L.length){ el.innerHTML=`<div class="card"><div class="tag">Журнал отпусков</div>
    <div class="hint" style="margin-top:7px">Пока пусто. Первая же запись начнёт корректировать расчёт под вашу печь.</div></div>`; return; }
  el.innerHTML=`<div class="card"><div class="tag">Журнал отпусков · ${L.length}</div>
    <div class="hint" style="margin-top:6px">Записи по выбранной группе отмечены оранжевой полосой — именно они формируют поправку.</div></div>`
   +L.map(r=>{
      const f=TC.find(x=>x.id===r.fam);
      const dev=f&&r.tUsed&&r.hrcGot?(r.hrcGot-tpPred(f,r.tUsed,r.asq)):null;
      const devTxt=dev===null?'':`${dev>0?'+':''}${dev.toFixed(1)} HRC к расчёту`;
      const hit=r.lo&&r.hi?(r.hrcGot>=r.lo&&r.hrcGot<=r.hi):null;
      return `<div class="card">${r.fam===cur?'<div class="glow"></div>':''}
        <div class="row"><div style="font-family:Oswald;font-size:15px;letter-spacing:.02em">${esc(f?f.n.split(' (')[0]:'—')}</div>
          <div class="hrcbox" style="font-size:11px;color:${hit===null?'var(--steel)':hit?'#7BC46B':'var(--red)'}">${hit===null?'':hit?'в допуске':'вне допуска'}</div></div>
        <div class="logline">До отпуска <b>${esc(r.asq)} HRC</b> · требовалось <b>${esc(r.lo)}–${esc(r.hi)} HRC</b>
Программа: <b>${esc(r.tRec)} °C</b> · отпускали при <b>${esc(r.tUsed)} °C</b> · получили <b>${esc(r.hrcGot)} HRC</b>${devTxt?`
Отклонение от расчёта: <b>${esc(devTxt)}</b>`:''}</div>
        ${r.txt?`<div class="usernote" style="margin-top:9px">${esc(r.txt)}</div>`:''}
        <div class="nmeta" style="margin-top:9px">${esc(r.ts)}<span class="delrec" data-del="${r.id}">Удалить</span></div>
      </div>`;}).join('');
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    DB.temperLog=DB.temperLog.filter(x=>x.id!==b.dataset.del); save(); tpCalc(); toast('Запись удалена');});
}

function tpSaveRec(){
  const f=TC.find(x=>x.id===$('#tpG').value);
  const asq=+$('#tpA').value||0, tUsed=+$('#tpUsed').value||0, hrcGot=+$('#tpGot').value||0;
  let lo=+$('#tpLo').value||0, hi=+$('#tpHi').value||0; if(hi<lo){const t=lo;lo=hi;hi=t;}
  if(!f||!asq||!tUsed||!hrcGot){ toast('Заполните температуру и полученную твёрдость'); return; }
  const rec=tpBase(f,asq,lo,hi);
  DB.temperLog=DB.temperLog||[];
  DB.temperLog.unshift({id:uid(),fam:f.id,asq,lo,hi,tRec:rec.T,tUsed,hrcGot,
    txt:$('#tpTxt').value.trim(),
    ts:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})});
  save(); $('#tpGot').value=''; $('#tpTxt').value='';
  tpCalc(); toast('Записано в журнал');
}

function commit(){
  const {kind,obj}=editing;
  $('#sheetBody').querySelectorAll('[data-k]').forEach(el=>{obj[el.dataset.k]=el.value.trim();});
  if(kind==='steels'){
    obj.ops=[...$('#ops').children].map(d=>{const g=k=>d.querySelector(`[data-o="${k}"]`).value.trim();
      return {n:g('n'),t:g('t'),e:g('e'),h:g('h'),r:g('r')};}).filter(o=>o.n);
  }
  if(kind==='steels'&&!obj.grade){toast('Укажите марку');return;}
  if(!DB[kind].some(x=>x.id===obj.id)) DB[kind].push(obj);
  save(); editing.mode='view'; renderSheet(); render(); toast('Сохранено');

  const tg=$('#tpG');
  if(tg){ ['tpG','tpA','tpS','tpLo','tpHi'].forEach(i=>{const el=$('#'+i); if(el){el.oninput=tpCalc; el.onchange=tpCalc;}});
    document.querySelectorAll('#tpP .chip').forEach(c=>c.onclick=()=>{
      document.querySelectorAll('#tpP .chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); $('#tpLo').value=c.dataset.lo; $('#tpHi').value=c.dataset.hi; tpCalc();});
    document.querySelector('#tpP .chip').classList.add('on');
    $('#tpSave').onclick=tpSaveRec; tpCalc(); }
  const e=$('#exp'); if(e) e.onclick=async()=>{
    try{ await navigator.clipboard.writeText(JSON.stringify(DB)); toast('База скопирована в буфер'); }

/* --- числовые поля: очищаются при нажатии, цифровая клавиатура --- */
function numFix(){
  document.querySelectorAll('input[type=number]').forEach(el=>{
    if(el.dataset.nf) return; el.dataset.nf='1';
    el.setAttribute('inputmode','decimal');
    el.addEventListener('focus',()=>{ el.dataset.prev=el.value; el.value='';
      setTimeout(()=>{ try{ el.select(); }catch(e){} },0); });
    el.addEventListener('blur',()=>{ if(el.value.trim()===''){
      el.value=el.dataset.prev||''; el.dispatchEvent(new Event('input',{bubbles:true})); } });
  });
}

/* высота экрана: берём реально видимую область, а не «теоретическую» */
var _baseH=0, _fitT=null;
function fitH(){
  try{
    var d=document.querySelector('.device');
    if(!d) return;
    if(window.innerWidth>760){ d.style.height=''; return; }
    var vv=window.visualViewport;
    var h=vv?vv.height:window.innerHeight;
    if(!h) return;
    if(h>_baseH) _baseH=h;
    if(_baseH && h < _baseH*0.72) return;   /* вылезла клавиатура — не трогаем */
    d.style.height=Math.round(h)+'px';
  }catch(e){}
}
