<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<link rel="manifest" href="./manifest-chpu.webmanifest">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});}</script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Разряд · ЧПУ">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="./icon-chpu-192.png">
<link rel="icon" href="./icon-chpu-192.png">

<title>РАЗРЯД · Пособие оператора ЧПУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0B0D; --panel:#141417; --panel2:#1B1B20; --panel3:#232329;
  --line:#2C2C34; --orange:#FF6B00; --ember:#FFA23A; --hot:#FFD166;
  --steel:#93939D; --paper:#F2EFEA; --red:#D93A2B; --haas:#FFA23A; --fanuc:#5FA8FF;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation;background:#050506;color:var(--paper);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.stage{width:100%;display:flex;justify-content:center;align-items:center;padding:24px 12px}
.device{width:412px;height:900px;max-height:calc(100vh - 48px);background:var(--ink);border-radius:38px;
  position:relative;overflow:hidden;border:9px solid #17171b;
  box-shadow:0 0 0 2px #35353d,0 40px 90px rgba(0,0,0,.75),0 0 120px rgba(255,107,0,.07)}
@media (max-width:760px){.stage{padding:0}.device{width:100vw;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
.statusbar{height:26px;margin-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--steel)}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar i{width:5px;height:5px;border-radius:50%;background:var(--steel);display:block}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:0 0 calc(104px + env(safe-area-inset-bottom,0px))}
.screen::-webkit-scrollbar{width:0}
header{padding:8px 16px 12px;background:linear-gradient(180deg,#141418,#0B0B0D);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;flex:none}
.brandtxt b{font-family:"Oswald",sans-serif;font-weight:600;font-size:17px;letter-spacing:.16em;text-transform:uppercase;display:block}
.brandtxt span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-family:"Oswald",sans-serif}
.htitle{font-family:"Oswald",sans-serif;font-weight:600;font-size:26px;margin:14px 0 2px;text-transform:uppercase}
.hsub{font-size:12.5px;color:var(--steel);margin:0}
.search{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px}
.search input{background:none;border:0;outline:0;color:var(--paper);font-size:14.5px;width:100%}
.search input::placeholder{color:#6A6A74}
.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);
  color:var(--steel);font-size:12px;white-space:nowrap;cursor:pointer;font-weight:500}
.chip.on{background:var(--orange);border-color:var(--orange);color:#120800;font-weight:600}
.wrap{padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px;
  position:relative;overflow:hidden}
.card .glow{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
.card .glow.d{background:var(--red)}
.code{font-family:"Oswald",sans-serif;font-size:22px;font-weight:600;line-height:1;letter-spacing:.03em}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);font-family:"Oswald",sans-serif;font-weight:500}
.ct{font-size:13.5px;color:#DDDAD4;margin-top:7px;line-height:1.45}
.badge{font-family:"Oswald",sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;white-space:nowrap}
.b-diff{background:#2b1210;color:#FF7A6A;border:1px solid #52251f}
.b-same{background:#12210f;color:#8FD07F;border:1px solid #2b4423}
.b-haas{background:#2a1c0d;color:var(--haas);border:1px solid #4a331a}
.b-fanuc{background:#0f1c2b;color:var(--fanuc);border:1px solid #1e3a56}
.sheet{position:absolute;inset:0;background:var(--ink);z-index:60;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateY(0)}
.sheethead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;flex:none;color:var(--paper)}
.sheetbody{flex:1;overflow-y:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.sec{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);
  margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:2px}
.stack{display:grid;gap:9px}
.ctrl{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--panel)}
.ctrl.h{border-left:3px solid var(--haas)}
.ctrl.f{border-left:3px solid var(--fanuc)}
.ctrlname{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ctrl.h .ctrlname{color:var(--haas)} .ctrl.f .ctrlname{color:var(--fanuc)}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.65;color:#E6E3DD;white-space:pre-wrap;word-break:break-word}
pre.blk{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.7;background:#0F0F12;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;overflow-x:auto;margin:0;color:#DCD9D3}
pre.blk b{color:var(--ember);font-weight:500}
.note{background:var(--panel2);border:1px dashed #3a3a44;border-radius:10px;padding:11px 12px;font-size:13px;
  line-height:1.55;color:#CFCCC6}
.note b{color:var(--ember);font-weight:600}
.warn{border-color:#5a2a1c;background:#1d1210}
.warn b{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:"Oswald",sans-serif;font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--steel);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #202027;vertical-align:top}
td.num{font-family:"IBM Plex Mono",monospace;color:var(--hot);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tscroll::-webkit-scrollbar{height:0}
.tscroll table{min-width:460px}
.calc{background:linear-gradient(160deg,#1d1410,#141417);border:1px solid #38251a;border-radius:var(--r);padding:14px;margin-bottom:12px}
label.fld{display:block;margin-bottom:11px}
label.fld span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--steel);
  font-family:"Oswald",sans-serif;margin-bottom:5px}
input[type=text],input[type=number],textarea,select{-webkit-appearance:none;appearance:none;font-size:16px;width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--paper);border-radius:10px;padding:10px 11px;font-size:14px;outline:0;font-family:"IBM Plex Mono",monospace}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
textarea{min-height:76px;resize:vertical;font-family:"IBM Plex Sans",sans-serif;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.out{font-family:"Oswald",sans-serif;font-size:30px;color:var(--ember);line-height:1.1;margin-top:6px}
.out small{font-size:13px;color:var(--steel);letter-spacing:.06em;margin-left:6px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:12px;border:0;
  background:var(--orange);color:#150900;font-family:"Oswald",sans-serif;font-size:13.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
.usernote{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:10px;
  padding:10px 12px;margin-bottom:9px;font-size:13.5px;line-height:1.5;color:#DDDAD4;white-space:pre-wrap}
.nmeta{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#6E6E78;margin-bottom:6px}
.nmeta span{color:var(--red);cursor:pointer;font-family:"Oswald",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.nbadge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ember);
  background:#2a1c0d;border:1px solid #4a331a;border-radius:6px;padding:1px 6px}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));background:rgba(15,15,18,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 0.66fr;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#63636D;font-size:10px;
  font-family:"Oswald",sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.nb.on{color:var(--orange)}
.nb svg{width:22px;height:22px}
.credit{text-align:center;font-size:9.5px;letter-spacing:.14em;color:#4E4E58;font-family:"Oswald",sans-serif;
  text-transform:uppercase;padding:16px 16px 6px}
.empty{text-align:center;color:var(--steel);padding:46px 24px;font-size:13.5px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel3);border:1px solid var(--line);
  border-radius:11px;padding:10px 16px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dia{width:100%;height:auto;background:#0F0F12;border:1px solid var(--line);border-radius:11px;margin:4px 0 12px;display:block}
.dia text{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:#FFA23A}
.dia text.d{fill:#93939D;font-size:10px}
.dia text.dm{fill:#9FD0FF;font-size:10.5px}
.dia .part{fill:#1B1B20;stroke:#FF6B00;stroke-width:2;stroke-linejoin:round}
.dia .dim{stroke:#6E6E78;stroke-width:1}
.dia .ax{stroke:#5A5A66;stroke-width:1;stroke-dasharray:10 4 2 4}
.dia .tool{fill:none;stroke:#5FA8FF;stroke-width:2}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:2px 0 10px}
.res .f{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#6E6E78;font-family:"Oswald",sans-serif}
.res .v{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ember);margin-top:2px}
.res .v.hot,.v.hot{color:var(--hot)}
.hint{font-size:11.5px;color:#6E6E78;line-height:1.5;margin-top:9px}
.splash{position:absolute;inset:0;background:var(--ink);z-index:99;display:grid;place-items:center;animation:fade .5s ease 1.5s forwards}
.splash .in{text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1)}
.splash .cap{margin-top:14px;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.3em;color:var(--orange);text-transform:uppercase}
.splash .cr{margin-top:26px;font-size:9.5px;letter-spacing:.16em;color:#4E4E58;font-family:"Oswald",sans-serif;text-transform:uppercase}
@keyframes fade{to{opacity:0;visibility:hidden}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* --- тумблер коррекции --- */
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:6px 0 14px}
.swlab{font-size:13.5px;line-height:1.35;color:#E6E3DD;flex:1 1 auto;min-width:0}
.swlab small{display:block;font-size:11px;color:#8A8A94;margin-top:3px}
.sw{width:58px;height:32px;border-radius:16px;background:#2A2A31;border:1px solid var(--line);
  position:relative;flex:0 0 58px;cursor:pointer;transition:background .18s,border-color .18s}
.sw.on{background:var(--orange);border-color:var(--orange)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8A8A94;
  transition:left .18s,background .18s;display:block}
.sw.on i{left:29px;background:#150900}
/* --- ссылки обратной связи --- */
.mseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-top:12px}
.mseg div{text-align:center;padding:9px 6px;border-radius:9px;font-family:"Oswald",sans-serif;font-size:12.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--steel);cursor:pointer;transition:.15s}
.mseg div.on{background:var(--orange);color:#150900;font-weight:600}
.lnk{display:flex;align-items:center;gap:11px;margin-top:10px;padding:12px;border-radius:11px;
  background:var(--panel2);border:1px solid var(--line);color:var(--paper);text-decoration:none;font-size:13.5px}
.lnk svg{color:var(--orange);flex:none}
.lnk:active{background:var(--panel3)}
.dia text.dm{fill:#9FD0FF;font-size:10.5px}
</style>
</head>
<body>
<div class="stage"><div class="device">

  <div class="splash" id="splash"><div class="in">
    <svg width="96" height="96" viewBox="0 0 120 120"><use href="#logo"/></svg>
    <div class="cap">Пособие оператора ЧПУ</div>
    <div class="cr">Разработал Онянов Дмитрий Сергеевич</div>
  </div></div>

  <div class="statusbar"><span id="clock">08:20</span>
    <span class="dots"><i></i><i></i><i></i><span style="font-size:10px">РАЗРЯД</span></span></div>

  <div class="app">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 120 120"><use href="#logo"/></svg>
        <div class="brandtxt"><b>РАЗРЯД</b><span>Оператор ЧПУ · v0.930</span></div>
      </div>
      <h1 class="htitle" id="ttl">G-коды</h1>
      <p class="hsub" id="sub">Haas и Fanuc: что совпадает, а что нет</p>
      <div class="mseg" id="mseg"></div>
      <div class="search" id="searchbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" opacity=".6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Код или назначение…" autocomplete="off" aria-label="Поиск по кодам">
      </div>
    </header>
    <div class="chips" id="chips"></div>
    <div class="screen" id="screen"></div>
  </div>

  <nav id="nav"></nav>

  <div class="sheet" id="sheet">
    <div class="sheethead">
      <div class="iconbtn" id="close" role="button" aria-label="Закрыть карточку" tabindex="0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div style="flex:1;min-width:0">
        <div id="sheetTitle" style="font-family:Oswald;font-size:19px;font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        <div id="sheetSub" style="font-size:11px;color:var(--steel)"></div>
      </div>
    </div>
    <div class="sheetbody" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div></div>

<svg style="display:none">
  
  <g id="logo">
    <rect x="0" y="0" width="120" height="120" rx="9" fill="#14161B"/>
    <!-- ромбическая пластина: острый угол сверху и снизу -->
    <path d="M60 12 L104 60 L60 108 L16 60 Z" fill="none" stroke="#FF6B00" stroke-width="9" stroke-linejoin="miter"/>
    <circle cx="60" cy="60" r="19" fill="none" stroke="#FF6B00" stroke-width="9"/>
  </g>
</svg>

<script>
/* хранение на устройстве: Safari, Chrome, любой браузер */
if(typeof window.storage==='undefined'){window.storage={
  get:async k=>{const v=localStorage.getItem(k); if(v===null) throw new Error('no key'); return {key:k,value:v};},
  set:async(k,v)=>{localStorage.setItem(k,v); return {key:k,value:v};},
  delete:async k=>{localStorage.removeItem(k); return {key:k,deleted:true};},
  list:async()=>({keys:Object.keys(localStorage)})};}
</script>
<script>
/* ============ хранилище ============ */
const KEY='repn-cnc-v1';
let volatile=false, NOTES={};
async function loadNotes(){try{const r=await window.storage.get(KEY);if(r&&r.value)return JSON.parse(r.value);}catch(e){}return{};}
async function saveNotes(){try{await window.storage.set(KEY,JSON.stringify(NOTES));}catch(e){volatile=true;}}

/* ============ данные ============ */
const G=[
 {c:'G00',g:'Движение',mc:'b',t:'Ускоренное позиционирование',d:0,
  h:'Скорость задана параметрами станка, регулируется рукояткой RAPID (5/25/50/100 %). Setting 10 ограничивает быстрый ход 50 %.',
  f:'Скорость задана параметрами. Регулируется рукояткой G00 (F0/25/50/100 %).',
  ex:'G00 G90 G54 X0. Y0.\nG43 H01 Z50. M03 S1200',
  n:'На обеих стойках траектория при перемещении по двум осям — не обязательно прямая линия. Над оснасткой поднимайтесь отдельным кадром по Z.'},
 {c:'G01',g:'Движение',mc:'b',t:'Линейная интерполяция с подачей',d:0,h:'F — мм/мин (G94) или мм/об (G95).',f:'То же. На токарном по умолчанию мм/об (G99).',
  ex:'G01 Z-5. F150.\nX50. Y30. F400.',n:'Подача F модальна: задали один раз — действует до смены.'},
 {c:'G02 / G03',g:'Движение',mc:'b',t:'Круговая интерполяция по / против часовой',d:0,
  h:'Формат I J K (от начала дуги к центру) либо R. Полная окружность — только через I J K.',
  f:'Идентично. R со знаком «минус» — дуга больше 180°.',
  ex:'G02 X40. Y20. R10. F300\nG03 X0. Y0. I-20. J0. F300',
  n:'Направление смотрят со стороны плюса третьей оси. В плоскости G17 (XY) — сверху.'},
 {c:'G04',g:'Режимы',mc:'b',t:'Пауза (выдержка)',d:1,
  h:'G04 P__ — секунды при записи с точкой (P1.0 = 1 с), миллисекунды без точки (P1000 = 1 с).',
  f:'G04 X__ — секунды (X1.0), G04 P__ — миллисекунды целым числом (P1000). Буква X на токарном может конфликтовать с осью — надёжнее P.',
  ex:'Haas:  G04 P1.0\nFanuc: G04 X1.0   или   G04 P1000',
  n:'Десятичная точка решает всё: на Haas G04 P10 — это 10 миллисекунд, а не 10 секунд. Хотели секунду — пишите P1.0 или P1000. Самая частая причина, почему станок «не делает паузу».'},
 {c:'G09',g:'Режимы',mc:'b',t:'Точный останов в кадре',d:0,h:'Однократный, действует только в своём кадре.',f:'То же.',ex:'G09 G01 X50. F400',n:'Убирает скругление угла на быстрых подачах ценой времени цикла.'},

  f:'G10 L2 P1 X__ Y__ Z__ — то же. L10 — геометрия H, L11 — износ H, L12 — геометрия D, L13 — износ D. L20 для G54.1 P.',

  ex:'Haas: G12 I5. K20. Q2. D01 F400',
  n:'Одно из главных удобств Haas. При переносе программы на Fanuc такой кадр придётся расписать дугами.'},
 {c:'G17 / G18 / G19',g:'Плоскости',mc:'b',t:'Выбор плоскости XY / XZ / YZ',d:0,h:'G17 по умолчанию на фрезерном.',f:'То же. На токарном по умолчанию G18.',ex:'G17 G90 G94 G40 G49 G80',n:'Плоскость определяет работу дуг, коррекции радиуса и осей цикла сверления.'},

  ex:'G21 G17 G40 G49 G80 G90',
  n:'Первое, что проверяют в чужой программе. Ошибка здесь даёт масштаб 25,4 — гарантированная поломка.'},
 {c:'G28',g:'Системы координат',mc:'b',t:'Возврат в исходную точку станка',d:0,

  n:'Без G91 промежуточной точкой станет X0 Y0 текущей нулевой — инструмент поедет через деталь. Не забывайте вернуть G90.'},
 {c:'G31',g:'Циклы',mc:'b',t:'Пропуск кадра по сигналу (щуп)',d:1,

  ex:'G51 X0. Y0. P2000  (масштаб 2,0)\n…\nG50',
  n:'Не путайте фрезерный и токарный смысл G50. На токарном G50 S3000 — предохранитель от разрыва кулачков.'},

  ex:'G52 X50. Y0.\n…\nG52 X0. Y0.',
  n:'Самое коварное отличие стоек. Оставленный G52 живёт после M30, если так настроен станок — обнуляйте его явно.'},
 {c:'G53',g:'Системы координат',mc:'b',t:'Перемещение в машинных координатах',d:0,h:'Некодовое, действует один кадр: G53 G00 Z0.',f:'То же.',

 {c:'G54–G59',g:'Системы координат',mc:'b',t:'Нулевые точки детали 1–6',d:0,h:'Плюс дополнительные G154 P1–P99.',f:'Плюс дополнительные G54.1 P1–P48 (опция).',

  f:'Аналог — G54.1 P1 … P48, опция «дополнительные системы координат». На современных стойках диапазон бывает шире — уточняйте по руководству на свою модель.',

  ex:'G61 G01 X50. F300\n…\nG64',n:'G61 сильно увеличивает время цикла. Применяйте только на участках, где важна геометрия угла.'},
 {c:'G65',g:'Режимы',mc:'b',t:'Вызов макропрограммы',d:1,h:'G65 P__ A__ B__ … Требует опции макросов (на большинстве машин включена).',

function viewCodes(SRC,kind){

    if(!okM) return false;
    const okF=filter==='Все'||(filter==='Только отличия'?x.d>0:x.g===filter);
    const okQ=!q||(x.c+' '+x.t+' '+(x.h||'')+' '+(x.f||'')).toLowerCase().includes(q);
    return okF&&okQ;});
  if(!list.length) return `<div class="empty">Ничего не нашлось.<br>Попробуйте другой запрос или снимите фильтр.</div>`+CREDIT;
  return `<div class="wrap">`+list.map(x=>{
    const id=kind+':'+x.c, n=(NOTES[id]||[]).length;

      <div class="glow ${x.d>0?'d':''}"></div>

}

/* ============ сохранение и восстановление записей ============ */
function bkFile(name,text){
  try{
    if(window.Razryad&&window.Razryad.saveText){ window.Razryad.saveText(name,text); toast('Файл сохранён в «Загрузки»'); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    toast('Файл сохранён');
  }catch(e){ toast('Не удалось сохранить файл'); }
}
async function bkCopy(text){
  try{ await navigator.clipboard.writeText(text); toast('Скопировано в буфер'); return; }catch(e){}
  try{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Скопировано в буфер');
  }catch(e){ toast('Буфер недоступен'); }
}

function calcContent(calcF){
  if(calcF==='rez') return `<div class="wrap">
    <div class="calc">
      <div class="tag">Обороты и минутная подача</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>Диаметр D, мм</span><input type="number" id="kD" value="12" step="0.1"></label>
        <label class="fld"><span>Скорость Vc, м/мин</span><input type="number" id="kV" value="150" step="1"></label>
      </div>
      <div class="two">
        <label class="fld"><span>Число зубьев z</span><input type="number" id="kZ" value="4" step="1"></label>
        <label class="fld"><span>Подача на зуб fz, мм</span><input type="number" id="kF" value="0.08" step="0.01"></label>
      </div>
      <div class="out" id="kOutN">—</div>
      <div class="out" id="kOutF" style="font-size:24px">—</div>
      <div class="hint">n = 1000·Vc / (π·D) · F = n · z · fz. Обороты округляйте вниз до целых сотен и сверяйте с максимумом шпинделя.</div>
    </div>
    <div class="calc">
      <div class="tag">Проверка: скорость по оборотам</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>Диаметр D, мм</span><input type="number" id="vD" value="50" step="0.1"></label>
        <label class="fld"><span>Обороты n, об/мин</span><input type="number" id="vN" value="800" step="10"></label>
      </div>
      <div class="out" id="vOut">—</div>
      <div class="hint">На токарном D — текущий диаметр обработки, поэтому в G96 обороты меняются непрерывно.</div>
    </div>
    <div class="calc">
      <div class="tag">Шероховатость при точении</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>Подача f, мм/об</span><input type="number" id="rF" value="0.15" step="0.01"></label>
        <label class="fld"><span>Радиус пластины rε, мм</span><input type="number" id="rR" value="0.4" step="0.1"></label>
      </div>
      <div class="out" id="rOut">—</div>
      <div class="hint">Высота гребешка Rz = f² / (8·rε). Шероховатость Ra примерно вчетверо меньше гребешка. Реальная выше расчёта на 20–50 % из-за износа пластины и вибраций, поэтому под чистовой размер берут запас.</div>
    </div>
    <div class="card"><div class="tag">Ориентировочные режимы</div>
      <div class="tscroll" style="margin-top:9px"><table><thead><tr>
        <th>Материал</th><th>Инструмент</th><th>Vc, м/мин</th><th>fz, мм/зуб</th></tr></thead><tbody>
        ${VC.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="num">${esc(r[2])}</td><td class="num">${esc(r[3])}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="hint">Для ориентира. Рабочие режимы — из каталога производителя пластины, с поправкой на жёсткость станка и вылет.</div>
    </div>`+CREDIT+`</div>`;


  if(calcF==='mill') return `<div class="wrap">
    <div class="calc">
      <div class="tag">Гребешок и шаг строчки (сферическая фреза)</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>⌀ фрезы, мм</span><input type="number" id="mD" value="10" step="0.1"></label>
        <label class="fld"><span>Допустимый гребешок Rz, мм</span><input type="number" id="mRz" value="0.01" step="0.005"></label>
      </div>
      <div class="out" id="mOut1">—</div>
      <div class="hint">ae = 2·√(2·R·Rz − Rz²). Уменьшили гребешок вдвое — шаг строчки упал примерно в 1,4 раза, а время выросло во столько же.</div>
    </div>
    <div class="calc">
      <div class="tag">Эффективный ⌀ сферической фрезы</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>⌀ фрезы, мм</span><input type="number" id="eD" value="10" step="0.1"></label>
        <label class="fld"><span>Глубина ap, мм</span><input type="number" id="eA" value="0.5" step="0.1"></label>
      </div>
      <div class="out" id="mOut2">—</div>
      <div class="hint">При малой глубине в работе только кончик фрезы: реальная скорость резания намного ниже расчётной. Обороты считайте по эффективному диаметру, иначе фреза «мылит» и горит.</div>
    </div>
    <div class="calc">
      <div class="tag">Подача на дуге: поправка по контуру</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>⌀ фрезы, мм</span><input type="number" id="aD" value="12" step="0.1"></label>
        <label class="fld"><span>Радиус контура, мм</span><input type="number" id="aR" value="20" step="0.1"></label>
      </div>
      <div class="two">
        <label class="fld"><span>Нужная подача на кромке</span><input type="number" id="aF" value="800" step="10"></label>
        <label class="fld"><span>Угол</span><select id="aT">
          <option value="out">Наружный (выпуклый)</option>
          <option value="in">Внутренний (вогнутый)</option></select></label>
      </div>
      <div class="out" id="mOut3">—</div>
      <div class="hint">Стойка ведёт с заданной подачей <b>центр</b> фрезы, а режет <b>кромка</b>. На наружном радиусе центр описывает дугу длиннее кромки — чтобы кромка резала с нужной подачей, в кадре задают больше. На внутреннем наоборот: центр идёт по короткой дуге, и подачу в кадре снижают, иначе стружка на зуб вырастет и фреза сядет.</div>
    </div>
    <div class="calc">
      <div class="tag">Врезание по спирали</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>⌀ спирали, мм</span><input type="number" id="sD" value="20" step="0.1"></label>
        <label class="fld"><span>Глубина за оборот, мм</span><input type="number" id="sH" value="0.5" step="0.1"></label>
      </div>
      <div class="two">
        <label class="fld"><span>Общая глубина, мм</span><input type="number" id="sT" value="5" step="0.1"></label>
        <label class="fld"><span>Подача, мм/мин</span><input type="number" id="sF" value="400" step="10"></label>
      </div>
      <div class="out" id="mOut4">—</div>
      <pre class="blk" id="mCode" style="margin-top:10px"></pre>
      <div class="hint">Угол врезания для твёрдого сплава по стали держат в пределах 2–5°, для алюминия допустимо до 10°. Прямое врезание по Z концевой фрезой без центрового зуба ломает инструмент.</div>
    </div>`+CREDIT+`</div>`;

  if(calcF==='thr') return `<div class="wrap">
    <div class="card"><div class="tag">Метрическая резьба с крупным шагом</div>
      <div class="tscroll" style="margin-top:9px"><table><thead><tr>
        <th>Резьба</th><th>Шаг</th><th>⌀ вала под резьбу</th><th>Сверло под гайку</th><th>h профиля</th></tr></thead><tbody>
        ${MTHR.map(r=>{const P=r[1];return `<tr><td style="font-family:Oswald;font-size:14px">М${r[0]}</td>
          <td class="num">${nf(P,2)}</td><td class="num">${nf(r[0]-0.1*P,2)}</td>
          <td class="num">${nf(r[0]-P,2)}</td><td class="num">${nf(0.6134*P,3)}</td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="hint">⌀ вала под наружную резьбу берут на 0,1–0,2 шага меньше номинала — витку нужно место для выдавливания. Сверло под метчик = номинал минус шаг.</div>
    </div>
    <div class="card"><div class="tag">Программа нарезания</div>
      <div class="ct" style="margin-top:7px">Проходы по √, готовые кадры G76 для Haas и Fanuc — в генераторе резьбовой программы.</div>
      <button class="btn" id="toThread" style="margin-top:11px">Открыть генератор G76</button>
    </div>
    <div class="card"><div class="tag">У станка</div>
      <div class="note" style="margin-top:8px">Обороты при резьбе ограничивайте так, чтобы сбег уместился в канавку: на выходе шпиндель не успевает затормозить. Первый прогон — с завышенным X на 2–3 мм.</div>
    </div>`+CREDIT+`</div>`;

  return `<div class="wrap">
    <div class="calc">
      <div class="tag">Посадка по номинальному ⌀</div>
      <div class="two" style="margin-top:11px">
        <label class="fld"><span>Номинальный ⌀, мм</span><input type="number" id="ftD" value="40" step="0.1"></label>
        <label class="fld"><span>Посадка</span><select id="ftF">
          ${FITLIST.map(([f,d])=>`<option value="${f}"${f==='H7/g6'?' selected':''}>${f} — ${d}</option>`).join('')}
        </select></label>
      </div>
      <div id="ftOut"></div>
    </div>
    <div class="card"><div class="tag">Допуск IT по диаметру, мкм</div>

        ${[5,6,7,8,9,11].map(q=>`<th>IT${q}</th>`).join('')}</tr></thead><tbody>

      <div class="note warn" style="margin-top:9px">Таблица до ⌀500 мм и для основных посадок в системе отверстия. Перед сдачей ответственной детали сверяйтесь с чертежом и ГОСТ 25347.</div>
    </div>`+CREDIT+`</div>`;
}

function itIdx(D){ if(D<=0) return -1; for(let i=0;i<ITR.length;i++) if(D<=ITR[i]) return i; return -1; }
function fieldOf(sym,D){
  const i=itIdx(D); if(i<0) return null;
  const m=sym.match(/^([A-Za-z]+)(\d+)$/); if(!m) return null;
  const L=m[1], q=+m[2], it=IT[q]?IT[q][i]:null; if(it==null) return null;
  if(L==='H') return {es:it,ei:0,it};
  if(L==='JS'||L==='Js') return {es:it/2,ei:-it/2,it};
  if(L==='js') return {es:it/2,ei:-it/2,it};
  if(DEV_M[L]) { const es=-DEV_M[L][i]; return {es,ei:es-it,it}; }
  if(DEV_P[L]) { const ei=DEV_P[L][i]; return {ei,es:ei+it,it}; }
  if(DEV_RS[L]) { let j=-1; for(let n=0;n<RSR.length;n++) if(D<=RSR[n]){j=n;break;}
    if(j<0) return null; const ei=DEV_RS[L][j]; return {ei,es:ei+it,it}; }
  return null;
}
const mm=u=>(u/1000>=0?'+':'')+nf(u/1000,3);
function fitCalc(){
  const D=+$('#ftD').value||0, f=$('#ftF').value;
  const out=$('#ftOut'); if(!out) return;
  const [hs,ss]=f.split('/');
  const H=fieldOf(hs,D), S=fieldOf(ss,D);
  if(!H||!S){ out.innerHTML='<div class="note warn">Диаметр вне диапазона таблицы (до 500 мм) или сочетание не поддерживается.</div>'; return; }
  const Hmax=D+H.es/1000, Hmin=D+H.ei/1000, Smax=D+S.es/1000, Smin=D+S.ei/1000;
  const zmax=(H.es-S.ei), zmin=(H.ei-S.es);
  const typ = zmin>=0?'с зазором' : (zmax<=0?'с натягом':'переходная');
  const tgtS=(Smax+Smin)/2, tgtH=(Hmax+Hmin)/2;
  out.innerHTML=`
   <div class="res" style="margin-top:4px">
     <div><div class="f">Отверстие ${esc(hs)}</div><div class="v">${mm(H.ei)} … ${mm(H.es)}</div></div>

     <div><div class="f">Тип посадки</div><div class="v">${typ}</div></div>
     <div><div class="f">${zmin>=0?'Зазор мин … макс':'Натяг макс … зазор макс'}</div>
       <div class="v">${nf(zmin/1000,3)} … ${nf(zmax/1000,3)}</div></div>
     <div><div class="f">Настройка станка</div><div class="v hot">вал ${nf(tgtS,3)}</div></div>
   </div>
   <div class="note" style="margin-top:4px"><b>Куда целиться:</b> ставьте размер вала на ${nf(tgtS,3)}, отверстия на ${nf(tgtH,3)} — середина поля. Тогда износ пластины съедает половину допуска, а не весь.</div>`;
}

function arcSamples(seg,A,B){
  const a0=Math.atan2(A.xr-seg.c.xr,A.z-seg.c.z), a1=Math.atan2(B.xr-seg.c.xr,B.z-seg.c.z);
  let d=a1-a0; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
  const out=[]; for(let i=1;i<=16;i++){const a=a0+d*i/16;
    out.push({z:seg.c.z+seg.r*Math.cos(a),xr:seg.c.xr+seg.r*Math.sin(a)});}
  return {pts:out,ccw:d>0};
}
function geoDraw(r,W,H,small,inner,c,v){
  const P=r.pts.map(p=>({z:p.z,xr:p.x/2,n:p.n}));
  let zs=[],xs=[];
  P.forEach(p=>{zs.push(p.z);xs.push(p.xr);});
  r.segs.forEach(s=>{if(s.c){zs.push(s.c.z-s.r,s.c.z+s.r);xs.push(Math.max(0,s.c.xr-s.r),s.c.xr+s.r);}});
  const zmin=Math.min(...zs), zmax=Math.max(...zs,0), xmax=Math.max(...xs,1)*(inner?1.25:1);
  const padL=small?10:46, padR=small?10:46, bot=H-(small?12:26), topM=small?10:24;
  const k=Math.min((W-padL-padR)/Math.max(zmax-zmin,0.001),(bot-topM)/xmax);
  const X=z=>padL+(z-zmin)*k, Y=x=>bot-x*k;
  let d=`M ${X(P[0].z)} ${Y(P[0].xr)}`, labels='', dims='';
  r.segs.forEach(s=>{const A=P[s.a],B=P[s.b];
    if(s.c) arcSamples(s,A,B).pts.forEach(q=>{d+=` L ${X(q.z)} ${Y(q.xr)}`;});
    else d+=` L ${X(B.z)} ${Y(B.xr)}`;});
  const last=P[P.length-1], ext=small?8:14, top=small?4:6;
  d+=inner
    ? ` L ${X(last.z)-ext} ${Y(last.xr)} L ${X(last.z)-ext} ${top} L ${X(P[0].z)} ${top} Z`
    : ` L ${X(last.z)-ext} ${Y(last.xr)} L ${X(last.z)-ext} ${bot} L ${X(P[0].z)} ${bot} Z`;

  if(!small){
    const fmt=x=>Number.isInteger(+nf(x,1))?String(Math.round(x)):nf(x,1);
    const has=n=>!!(c&&c.f&&c.f.some(f=>f[0]===n));
    const val=n=>(v&&v[n]!=null)?v[n]:null;
    const used=[];
    const put=(x,y,t,cls)=>{ let px=x,py=y;
      for(const [dx,dy] of [[0,0],[0,12],[0,-12],[-24,0],[24,0],[0,22],[-24,-12],[24,12]]){
        px=x+dx; py=y+dy;
        if(!used.some(u=>Math.abs(u.x-px)<26&&Math.abs(u.y-py)<10)) break; }
      used.push({x:px,y:py});
      return `<text ${cls||''} x="${px}" y="${py}">${t}</text>`; };
    P.forEach(p=>{ const cx=X(p.z), cy=Y(p.xr);
      labels+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#FF6B00"/>`+put(cx+6,cy-7,p.n); });

    const cap=(x,y,h)=>h?`<line class="dim" x1="${x}" y1="${y-4}" x2="${x}" y2="${y+4}"/>`
                        :`<line class="dim" x1="${x-4}" y1="${y}" x2="${x+4}" y2="${y}"/>`;
    // D — наибольший ⌀, вынесен слева от детали
    const iMax=P.reduce((a,p,i)=>p.xr>P[a].xr?i:a,0);
    if(has('D')){ const xD=X(zmin)-14;
      dims+=`<line class="dim" x1="${xD}" y1="${Y(0)}" x2="${xD}" y2="${Y(P[iMax].xr)}"/>${cap(xD,Y(0))}${cap(xD,Y(P[iMax].xr))}
        <line class="dim" x1="${xD}" y1="${Y(P[iMax].xr)}" x2="${X(P[iMax].z)}" y2="${Y(P[iMax].xr)}" stroke-dasharray="2 3"/>
        <text class="dm" x="4" y="${(Y(0)+Y(P[iMax].xr))/2+4}">D ${fmt(val('D'))}</text>`; }
    if(has('d')&&P[0].xr>0.01){ const xd=X(0)+13;
      dims+=`<line class="dim" x1="${xd}" y1="${Y(0)}" x2="${xd}" y2="${Y(P[0].xr)}"/>${cap(xd,Y(0))}${cap(xd,Y(P[0].xr))}
        <text class="dm" x="${xd+5}" y="${(Y(0)+Y(P[0].xr))/2+4}">d ${fmt(val('d'))}</text>`; }
    if(has('L')){ const yL=bot-8;
      dims+=`<line class="dim" x1="${X(zmin)}" y1="${yL}" x2="${X(0)}" y2="${yL}"/>${cap(X(zmin),yL,1)}${cap(X(0),yL,1)}
        <text class="dm" x="${(X(zmin)+X(0))/2-14}" y="${yL-4}">L ${fmt(val('L'))}</text>`; }
    // R и углы
    r.segs.forEach(s=>{const A=P[s.a],B=P[s.b];
      if(s.c){ const m=arcSamples(s,A,B).pts[7]||B;
        const ux=(m.z-s.c.z)/s.r, uy=(m.xr-s.c.xr)/s.r;
        dims+=`<line class="dim" x1="${X(s.c.z)}" y1="${Y(s.c.xr)}" x2="${X(m.z)}" y2="${Y(m.xr)}" stroke-dasharray="3 3"/>`
          +put(X(m.z)+ux*16-7, Y(m.xr)-uy*16+4, (s.lbl||'R')+' '+fmt(s.r), 'class="dm"');
      } else { const dz=B.z-A.z, dx=B.xr-A.xr;
        if(s.lbl==='C'){
          dims+=`<line class="dim" x1="${X(A.z)}" y1="${Y(A.xr)+13}" x2="${X(B.z)}" y2="${Y(A.xr)+13}"/>
            ${cap(X(A.z),Y(A.xr)+13,1)}${cap(X(B.z),Y(A.xr)+13,1)}`
            +put((X(A.z)+X(B.z))/2-8, Y(A.xr)+27, 'C '+fmt(Math.abs(B.z-A.z)), 'class="dm"'); }
        if(Math.abs(dz)>0.01&&Math.abs(dx)>0.01){
          const ang=Math.abs(dg(Math.atan2(dx,dz))), a2=ang>90?180-ang:ang;
          const nm=(s.lbl&&s.lbl!=='C')?s.lbl:'A';
          const arcR=17, mz=(A.z+B.z)/2, mx=(A.xr+B.xr)/2;
          dims+=`<path class="dim" d="M ${X(mz)+arcR} ${Y(mx)} A ${arcR} ${arcR} 0 0 0 ${X(mz)+arcR*Math.cos(rd(a2))} ${Y(mx)+arcR*Math.sin(rd(a2))}" fill="none"/>`
            +put(X(mz)+arcR+4,Y(mx)+9,nm+' '+fmt(a2)+'°','class="dm"'); }
      }});
  }
  return `<svg class="dia" viewBox="0 0 ${W} ${H}">
    <line class="ax" x1="6" y1="${bot}" x2="${W-6}" y2="${bot}"/>
    <path class="part" d="${d}"/>${dims}${labels}
    ${small?'':`<text class="d" x="${W-34}" y="${bot-4}">Z+</text>`}
    ${small||!inner?'':`<text class="d" x="10" y="14">металл</text>`}</svg>`;
}


/* --- компенсация радиуса при вершине: смещение контура для программирования без G41/G42 --- */
let geoNose={on:false,r:0.4,inner:false};
function segNorm(S,P,s,pt){
  if(!s.c){const A=P[s.a],B=P[s.b],uz=B.z-A.z,ux=B.xr-A.xr,L=Math.hypot(uz,ux);return [ux/L,-uz/L];}
  const dz=pt.z-s.c.z, dx=pt.xr-s.c.xr, L=Math.hypot(dz,dx)||1;
  return s.conv?[dz/L,dx/L]:[-dz/L,-dx/L];
}
function xLL(a,b,near){
  const det=a.uz*(-b.ux)-a.ux*(-b.uz);
  if(Math.abs(det)<1e-9) return near;
  const rz=b.pz-a.pz, rx=b.px-a.px;
  const t=(rz*(-b.ux)-rx*(-b.uz))/det;
  return {z:a.pz+t*a.uz, xr:a.px+t*a.ux};
}
function xLA(l,c,near){
  const fz=l.pz-c.cz, fx=l.px-c.cx;
  const B=2*(fz*l.uz+fx*l.ux), C=fz*fz+fx*fx-c.R*c.R, D=B*B-4*C;
  if(D<0) return near;
  const s1=(-B+Math.sqrt(D))/2, s2=(-B-Math.sqrt(D))/2;
  const p1={z:l.pz+s1*l.uz,xr:l.px+s1*l.ux}, p2={z:l.pz+s2*l.uz,xr:l.px+s2*l.ux};
  return Math.hypot(p1.z-near.z,p1.xr-near.xr)<Math.hypot(p2.z-near.z,p2.xr-near.xr)?p1:p2;
}
function geoComp(res,r){
  if(!(r>0)||!res.pts) return null;
  const sx=geoNose.inner?-1:1;
  const P=res.pts.map(p=>({z:p.z,xr:p.x/2})), S=res.segs;
  for(const s of S) if(s.c&&!s.conv&&s.r<=r) return {bad:`Радиус при вершине r${nf(r,2)} не меньше вогнутого радиуса R${nf(s.r,2)} — такой контур этим резцом не выйдет.`};
  const cur=S.map(s=>{ if(s.c) return {t:'arc',cz:s.c.z-r,cx:s.c.xr-r*sx,R:(s.conv?s.r+r:s.r-r)};
    const A=P[s.a],B=P[s.b],uz=B.z-A.z,ux=B.xr-A.xr,L=Math.hypot(uz,ux),nz=sx*ux/L,nx=-sx*uz/L;
    return {t:'line',pz:A.z+r*nz-r,px:A.xr+r*nx-r*sx,uz:uz/L,ux:ux/L};});
  const first={t:'line',pz:P[0].z,px:P[0].xr-r*sx,uz:0,ux:1};
  const lp=P[P.length-1], last={t:'line',pz:lp.z-r,px:lp.xr,uz:-1,ux:0};
  const out=[];
  for(let i=0;i<P.length;i++){
    const ip=S.findIndex(s=>s.b===i), inx=S.findIndex(s=>s.a===i);
    const cp=ip>=0?cur[ip]:first, cn=inx>=0?cur[inx]:last;
    let np=ip>=0?segNorm(S,P,S[ip],P[i]):[1,0], nn=inx>=0?segNorm(S,P,S[inx],P[i]):[0,1];
    if(sx<0){ np=[np[0],-np[1]]; nn=[nn[0],-nn[1]]; }
    const near={z:P[i].z+r*nn[0]-r, xr:P[i].xr+r*nn[1]-r*sx};
    let q=near;
    if(Math.hypot(np[0]-nn[0],np[1]-nn[1])>1e-6){
      if(cp.t==='line'&&cn.t==='line') q=xLL(cp,cn,near);
      else if(cp.t==='line') q=xLA(cp,cn,near);
      else if(cn.t==='line') q=xLA(cn,cp,near);
    }
    out.push({n:res.pts[i].n,x:2*q.xr,z:q.z});
  }
  return {pts:out,segR:S.map(s=>s.c?(s.conv?s.r+r:s.r-r):null)};
}

function geoCalc(){
  const c=GALL.find(x=>x.id===geoCase); if(!c) return;
  const v=gv(geoCase);
  document.querySelectorAll('#geoForm input,#geoForm select').forEach(e=>{v[e.dataset.k]=+e.value;});
  geoNose.inner=!!c.inner;
  let r; try{ r=c.c(v); }catch(e){ r={info:[],bad:'Проверьте размеры.'}; }
  $('#geoBad').innerHTML=r.bad?`<div class="note warn" style="margin-bottom:11px"><b>${esc(r.bad)}</b></div>`:'';
  $('#geoPic').innerHTML=r.pts?geoDraw(r,300,150,false,c.inner,c,v):'';
  let K=null;
  if(geoNose.on&&r.pts){ K=geoComp(r,geoNose.r);
    if(K&&K.bad){ $('#geoBad').innerHTML=`<div class="note warn" style="margin-bottom:11px"><b>${esc(K.bad)}</b></div>`; K=null; } }
  const tb=$('#geoTab');
  if(r.pts){ tb.innerHTML=`<thead><tr><th>Точка</th><th>X (⌀)</th><th>Z</th>${K?'<th>X с комп.</th><th>Z с комп.</th>':''}</tr></thead><tbody>`+
    r.pts.map((p,i)=>`<tr><td style="font-family:Oswald;font-size:14px;color:var(--ember)">${p.n}</td>
      <td class="num">${nf(p.x,3)}</td><td class="num">${nf(p.z,3)}</td>
      ${K?`<td class="num" style="color:#5FA8FF">${nf(K.pts[i].x,3)}</td><td class="num" style="color:#5FA8FF">${nf(K.pts[i].z,3)}</td>`:''}</tr>`).join('')+`</tbody>`; }
  else tb.innerHTML='';
  $('#gres').innerHTML=(r.info||[]).map(x=>`<div><div class="f">${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');
  let code=r.code;
  if(r.pts){
    const P=r.pts, Q=K?K.pts:P;
    code=`(${c.n.toUpperCase()}${K?' · С КОМПЕНСАЦИЕЙ r'+nf(geoNose.r,2):''})\n`
      +(K?`(координаты уже смещены — G41/G42 не включать)\n`:`(профиль детали — работать с G41/G42)\n`)
      +`G00 X${nf(Q[0].x,3)} Z2.\nG01 Z${nf(Q[0].z,3)} F0.15\n`;
    r.segs.forEach((s,i)=>{const A={z:P[s.a].z,xr:P[s.a].x/2}, B={z:P[s.b].z,xr:P[s.b].x/2};
      if(s.c){const sm=arcSamples(s,A,B), rr=K?K.segR[i]:s.r;
        code+=`${sm.ccw?'G03':'G02'} X${nf(Q[s.b].x,3)} Z${nf(Q[s.b].z,3)} R${nf(rr,3)}\n`;}
      else code+=`G01 X${nf(Q[s.b].x,3)} Z${nf(Q[s.b].z,3)}\n`;});
    code+=`(далее по контуру)`;
    if(K) code+=`\n\n(${geoNose.inner?'расточной резец':'правый наружный резец'}, точение к патрону)`;
  }
  $('#gcode').textContent=code||'';
  geoLast={t:c.n,v:c.f.map(([k,l])=>l.split(' —')[0]+' '+nf(v[k],2)).join(' · '),c:code||''};
  geoHist();
}

      if(!src||typeof src!=='object'){ toast('В файле нет записей'); return; }
      if(mode==='rep') NOTES=src;
      else Object.keys(src).forEach(k=>{
        const a=NOTES[k]||[], b=src[k]||[];
        const ids=new Set(a.map(x=>x.id));
        NOTES[k]=a.concat(b.filter(x=>!ids.has(x.id)));});
      saveNotes(); $('#bkIn').value=''; render();
      toast(mode==='rep'?'Записи заменены':'Записи добавлены');};
    $('#bkAdd').onclick=()=>load('add');
    $('#bkRep').onclick=()=>load('rep');
  }
  document.querySelectorAll('pre.blk').forEach(pre=>{
    if(pre.dataset.cp) return; pre.dataset.cp='1'; pre.title='Нажмите, чтобы скопировать';
    pre.style.cursor='pointer';
    pre.onclick=()=>bkCopy(pre.textContent);});
  const tt=$('#toThread'); if(tt) tt.onclick=()=>{folder='tools';geoCase='t3';deeper();render();};
  const ftD=$('#ftD');
  if(ftD){ ['ftD','ftF'].forEach(i=>{const e=$('#'+i); if(e){e.oninput=fitCalc;e.onchange=fitCalc;}}); fitCalc(); }

  const mD=$('#mD');
  if(mD){ const c=()=>{const D=+mD.value||1,R=D/2,rz=+$('#mRz').value||0.001;
    const ae=2*Math.sqrt(Math.max(2*R*rz-rz*rz,0));
    $('#mOut1').innerHTML=nf(ae,3)+'<small>мм шаг строчки</small>';};
    ['mD','mRz'].forEach(i=>$('#'+i).oninput=c); c(); }
  const eD=$('#eD');
  if(eD){ const c=()=>{const D=+eD.value||1,ap=+$('#eA').value||0;
    const de=2*Math.sqrt(Math.max(ap*(D-ap),0));
    $('#mOut2').innerHTML=nf(de,2)+'<small>мм эффективный ⌀ ('+nf(de/D*100,0)+' % от номинала)</small>';};
    ['eD','eA'].forEach(i=>$('#'+i).oninput=c); c(); }
  const aD=$('#aD');
  if(aD){ const c=()=>{const D=+aD.value||1,R=+$('#aR').value||1,F=+$('#aF').value||0,t=$('#aT').value;
    if(t==='in'&&R<=D/2){ $('#mOut3').innerHTML='—<small style="font-size:13px">радиус контура меньше радиуса фрезы: угол не выйдет</small>'; return; }
    const k=t==='out'?(R+D/2)/R:(R-D/2)/R;
    const Fk=F*k;
    $('#mOut3').innerHTML=nf(Fk,0)+'<small>мм/мин задать в кадре ('+(k>1?'+':'')+nf((k-1)*100,0)+' %)</small>';};
    ['aD','aR','aF','aT'].forEach(i=>{$('#'+i).oninput=c;$('#'+i).onchange=c;}); c(); }
  const sD=$('#sD');
  if(sD){ const c=()=>{const D=+sD.value||1,h=+$('#sH').value||0.1,T=+$('#sT').value||1,F=+$('#sF').value||1;
    const ang=Math.atan2(h,Math.PI*D)*180/Math.PI;
    const turns=T/h, len=turns*Math.sqrt(Math.pow(Math.PI*D,2)+h*h), tmin=len/F;
    $('#mOut4').innerHTML=nf(ang,2)+'<small>° угол врезания · '+nf(turns,1)+' витков · '+nf(tmin*60,0)+' с</small>';
    $('#mCode').textContent='(VREZANIE PO SPIRALI '+nf(D,1)+' MM)\nG00 X'+nf(D/2,3)+' Y0.\nG01 Z0. F'+nf(F,0)+
      '\nG91 G03 I-'+nf(D/2,3)+' Z-'+nf(h,3)+' F'+nf(F,0)+' L'+Math.ceil(turns)+'   (Fanuc: K'+Math.ceil(turns)+')\nG90 G01 Z-'+nf(T,3);};
    ['sD','sH','sT','sF'].forEach(i=>$('#'+i).oninput=c); c(); }
  const kD=$('#kD');
  if(kD){const c=()=>{const D=+kD.value||1,V=+$('#kV').value||0,Z=+$('#kZ').value||1,F=+$('#kF').value||0;
    const n=1000*V/(Math.PI*D); $('#kOutN').innerHTML=Math.round(n)+'<small>об/мин</small>';
    $('#kOutF').innerHTML=Math.round(n*Z*F)+'<small>мм/мин</small>';};
    ['kD','kV','kZ','kF'].forEach(i=>$('#'+i).oninput=c); c();}
  const vD=$('#vD');
  if(vD){const c=()=>{const D=+vD.value||0,n=+$('#vN').value||0;
    $('#vOut').innerHTML=(Math.PI*D*n/1000).toFixed(0)+'<small>м/мин</small>';};
    ['vD','vN'].forEach(i=>$('#'+i).oninput=c); c();}
  const rF=$('#rF');
  if(rF){const c=()=>{const f=+rF.value||0,r=+$('#rR').value||0.1;
    const rz=f*f/(8*r)*1000;
    $('#rOut').innerHTML=nf(rz,1)+'<small>мкм гребешок Rz · Ra ≈ '+nf(rz/4,2)+'</small>';};
    ['rF','rR'].forEach(i=>$('#'+i).oninput=c); c();}
}
$('#q').oninput=()=>{ if(folder==='g'||folder==='m'){ $('#screen').innerHTML=viewCodes(folder==='g'?G:M,folder); bind(); } };

(function clock(){const d=new Date();
  $('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(clock,20000);})();

(async()=>{ NOTES=await loadNotes(); render(); })();
</script>
</body>
</html>
