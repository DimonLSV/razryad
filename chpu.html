<title>РАЗРЯД · Пособие оператора ЧПУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0B0B0D; --panel:#141417; --panel2:#1B1B20; --panel3:#232329;
  --line:#2C2C34; --orange:#FF6B00; --ember:#FFA23A; --hot:#FFD166;
  --steel:#93939D; --paper:#F2EFEA; --red:#D93A2B; --haas:#FFA23A; --fanuc:#5FA8FF;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation;background:#050506;color:var(--paper);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.stage{width:100%;display:flex;justify-content:center;align-items:center;padding:24px 12px}
.device{width:412px;height:900px;max-height:calc(100vh - 48px);background:var(--ink);border-radius:38px;
  position:relative;overflow:hidden;border:9px solid #17171b;
  box-shadow:0 0 0 2px #35353d,0 40px 90px rgba(0,0,0,.75),0 0 120px rgba(255,107,0,.07)}
@media (max-width:760px){.stage{padding:0}.device{width:100vw;height:100vh;height:100svh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
.statusbar{height:26px;margin-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--steel)}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar i{width:5px;height:5px;border-radius:50%;background:var(--steel);display:block}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:0 0 calc(104px + env(safe-area-inset-bottom,0px))}
.screen::-webkit-scrollbar{width:0}
header{padding:8px 16px 12px;background:linear-gradient(180deg,#141418,#0B0B0D);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;flex:none}
.brandtxt b{font-family:"Oswald",sans-serif;font-weight:600;font-size:17px;letter-spacing:.16em;text-transform:uppercase;display:block}
.brandtxt span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-family:"Oswald",sans-serif}
.htitle{font-family:"Oswald",sans-serif;font-weight:600;font-size:26px;margin:14px 0 2px;text-transform:uppercase}
.hsub{font-size:12.5px;color:var(--steel);margin:0}
.search{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px}
.search input{background:none;border:0;outline:0;color:var(--paper);font-size:14.5px;width:100%}
.search input::placeholder{color:#6A6A74}
.chips{display:flex;gap:7px;overflow-x:auto;padding:11px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);
  color:var(--steel);font-size:12px;white-space:nowrap;cursor:pointer;font-weight:500}
.chip.on{background:var(--orange);border-color:var(--orange);color:#120800;font-weight:600}
.wrap{padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:11px;
  position:relative;overflow:hidden}
.card .glow{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
.card .glow.d{background:var(--red)}
.code{font-family:"Oswald",sans-serif;font-size:22px;font-weight:600;line-height:1;letter-spacing:.03em}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--orange);font-family:"Oswald",sans-serif;font-weight:500}
.ct{font-size:13.5px;color:#DDDAD4;margin-top:7px;line-height:1.45}
.badge{font-family:"Oswald",sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;white-space:nowrap}
.b-diff{background:#2b1210;color:#FF7A6A;border:1px solid #52251f}
.b-same{background:#12210f;color:#8FD07F;border:1px solid #2b4423}
.b-haas{background:#2a1c0d;color:var(--haas);border:1px solid #4a331a}
.b-fanuc{background:#0f1c2b;color:var(--fanuc);border:1px solid #1e3a56}
.sheet{position:absolute;inset:0;background:var(--ink);z-index:60;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateY(0)}
.sheethead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--panel)}
.iconbtn{width:34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;flex:none;color:var(--paper)}
.sheetbody{flex:1;overflow-y:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.sec{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);
  margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:2px}
.stack{display:grid;gap:9px}
.ctrl{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--panel)}
.ctrl.h{border-left:3px solid var(--haas)}
.ctrl.f{border-left:3px solid var(--fanuc)}
.ctrlname{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.ctrl.h .ctrlname{color:var(--haas)} .ctrl.f .ctrlname{color:var(--fanuc)}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.65;color:#E6E3DD;white-space:pre-wrap;word-break:break-word}
pre.blk{font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.7;background:#0F0F12;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;overflow-x:auto;margin:0;color:#DCD9D3}
pre.blk b{color:var(--ember);font-weight:500}
.note{background:var(--panel2);border:1px dashed #3a3a44;border-radius:10px;padding:11px 12px;font-size:13px;
  line-height:1.55;color:#CFCCC6}
.note b{color:var(--ember);font-weight:600}
.warn{border-color:#5a2a1c;background:#1d1210}
.warn b{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:"Oswald",sans-serif;font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--steel);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #202027;vertical-align:top}
td.num{font-family:"IBM Plex Mono",monospace;color:var(--hot);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto;margin:0 -14px;padding:0 14px}
.tscroll::-webkit-scrollbar{height:0}
.tscroll table{min-width:460px}
.calc{background:linear-gradient(160deg,#1d1410,#141417);border:1px solid #38251a;border-radius:var(--r);padding:14px;margin-bottom:12px}
label.fld{display:block;margin-bottom:11px}
label.fld span{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--steel);
  font-family:"Oswald",sans-serif;margin-bottom:5px}
input[type=text],input[type=number],textarea,select{-webkit-appearance:none;appearance:none;font-size:16px;width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--paper);border-radius:10px;padding:10px 11px;font-size:14px;outline:0;font-family:"IBM Plex Mono",monospace}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
textarea{min-height:76px;resize:vertical;font-family:"IBM Plex Sans",sans-serif;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.out{font-family:"Oswald",sans-serif;font-size:30px;color:var(--ember);line-height:1.1;margin-top:6px}
.out small{font-size:13px;color:var(--steel);letter-spacing:.06em;margin-left:6px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:12px;border-radius:12px;border:0;
  background:var(--orange);color:#150900;font-family:"Oswald",sans-serif;font-size:13.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
.usernote{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ember);border-radius:10px;
  padding:10px 12px;margin-bottom:9px;font-size:13.5px;line-height:1.5;color:#DDDAD4;white-space:pre-wrap}
.nmeta{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:#6E6E78;margin-bottom:6px}
.nmeta span{color:var(--red);cursor:pointer;font-family:"Oswald",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.nbadge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ember);
  background:#2a1c0d;border:1px solid #4a331a;border-radius:6px;padding:1px 6px}
nav{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));background:rgba(11,11,14,.97);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid #5B331B;display:grid;grid-template-columns:repeat(5,1fr);z-index:40;padding:5px 5px env(safe-area-inset-bottom,0px);box-shadow:0 -14px 34px rgba(0,0,0,.48),0 -1px 18px rgba(255,107,0,.08)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#898994;font-size:9.5px;
  font-family:"Oswald",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;position:relative;border-radius:11px;text-decoration:none;overflow:hidden;transition:color .2s,background .2s,transform .2s}
.nb.on{color:#160900;background:linear-gradient(145deg,var(--hot),var(--orange));font-weight:600;box-shadow:0 4px 16px rgba(255,107,0,.25);transform:translateY(-2px)}
.nb.on::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.32) 45%,transparent 70%);transform:translateX(-130%);animation:navSweep 2.8s ease-in-out infinite}
.nb.gen:not(.on){color:var(--ember);background:#24170E;border:1px solid #4D301A}
.nb.gen::before{content:"";position:absolute;right:7px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--green,#44D17A);box-shadow:0 0 9px var(--green,#44D17A);animation:navPulse 1.6s ease-in-out infinite}
.nb span{display:block;margin-top:1px}
.nb svg{width:20px;height:20px;flex:none}
@keyframes navSweep{0%,52%{transform:translateX(-130%)}82%,100%{transform:translateX(130%)}}
@keyframes navPulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.credit{text-align:center;font-size:9.5px;letter-spacing:.14em;color:#4E4E58;font-family:"Oswald",sans-serif;
  text-transform:uppercase;padding:16px 16px 6px}
.empty{text-align:center;color:var(--steel);padding:46px 24px;font-size:13.5px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel3);border:1px solid var(--line);
  border-radius:11px;padding:10px 16px;font-size:13px;opacity:0;transition:.25s;z-index:70;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dia{width:100%;height:auto;background:#0F0F12;border:1px solid var(--line);border-radius:11px;margin:4px 0 12px;display:block}
.dia text{font-family:"IBM Plex Mono",monospace;font-size:11px;fill:#FFA23A}
.dia text.d{fill:#93939D;font-size:10px}
.dia text.dm{fill:#9FD0FF;font-size:10.5px}
.dia .part{fill:#1B1B20;stroke:#FF6B00;stroke-width:2;stroke-linejoin:round}
.dia .dim{stroke:#6E6E78;stroke-width:1}
.dia .ax{stroke:#5A5A66;stroke-width:1;stroke-dasharray:10 4 2 4}
.dia .tool{fill:none;stroke:#5FA8FF;stroke-width:2}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:2px 0 10px}
.res .f{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#6E6E78;font-family:"Oswald",sans-serif}
.res .v{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--ember);margin-top:2px}
.res .v.hot,.v.hot{color:var(--hot)}
.hint{font-size:11.5px;color:#6E6E78;line-height:1.5;margin-top:9px}
.splash{position:absolute;inset:0;background:var(--ink);z-index:99;display:grid;place-items:center;animation:fade .5s ease 1.5s forwards}
.splash .in{text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1)}
.splash .cap{margin-top:14px;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.3em;color:var(--orange);text-transform:uppercase}
.splash .cr{margin-top:26px;font-size:9.5px;letter-spacing:.16em;color:#4E4E58;font-family:"Oswald",sans-serif;text-transform:uppercase}
@keyframes fade{to{opacity:0;visibility:hidden}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.nb.on::after,.nb.gen::before{animation:none}}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* --- учебник --- */
.grp{font-family:"Oswald",sans-serif;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);
  margin:24px 0 3px;display:flex;align-items:center;gap:9px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grpd{font-size:11.5px;color:#6E6E78;margin:0 0 10px;line-height:1.45}
.kbd{display:inline-block;font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--panel3);border:1px solid #3E3E48;border-bottom-width:2px;border-radius:6px;padding:1px 7px;
  color:var(--hot);white-space:nowrap;margin:1px 0}
.seq{counter-reset:q;padding:0;list-style:none;margin:9px 0 0}
.seq li{counter-increment:q;position:relative;padding-left:32px;margin-bottom:12px;font-size:13.5px;color:#DDDAD4;line-height:1.5}
.seq li::before{content:counter(q);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:7px;
  background:#2a1c0d;border:1px solid #4a331a;display:grid;place-items:center;
  font-family:"Oswald",sans-serif;font-size:11px;color:var(--ember)}
.seq li b{color:var(--paper)}
.qa{border-left:2px solid #2C2C34;padding-left:12px;margin:11px 0}
.qa b{color:var(--ember);font-weight:600;display:block;margin-bottom:3px;font-size:13px}
.qa span{font-size:12.5px;color:#B6B3AD;line-height:1.5;display:block}
.dl{display:grid;grid-template-columns:minmax(54px,33%) 1fr;gap:9px 12px;font-size:13px;margin-top:9px;align-items:baseline}
.dl b{font-family:"IBM Plex Mono",monospace;color:var(--ember);font-weight:500;font-size:12.5px;line-height:1.35;overflow-wrap:break-word}
.dl span{color:#CFCCC6;line-height:1.45}
/* --- тест --- */
.qnum{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--steel)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
  margin-top:7px;cursor:pointer;background:var(--panel2);font-size:13.5px;line-height:1.45;color:#DDDAD4;
  transition:border-color .15s,background .15s}
.opt i{flex:none;width:21px;height:21px;border-radius:6px;border:1px solid #3E3E48;display:grid;place-items:center;
  font-family:"Oswald",sans-serif;font-size:11px;color:var(--steel);font-style:normal;background:var(--panel);margin-top:1px}
.opt.sel{border-color:var(--orange);background:#241708;color:var(--paper)}
.opt.sel i{background:var(--orange);border-color:var(--orange);color:#150900;font-weight:600}
.opt.ok{border-color:#2b4423;background:#12210f;color:#DCEFD6}
.opt.ok i{background:#8FD07F;border-color:#8FD07F;color:#0c1a08;font-weight:600}
.opt.no{border-color:#52251f;background:#2b1210;color:#F2D9D5}
.opt.no i{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.dia .g{stroke:#3A3A44;stroke-width:1}
.dia .hl{fill:none;stroke:#FFD166;stroke-width:2}
.dia .ok{fill:none;stroke:#8FD07F;stroke-width:2}
.dia .bad{fill:none;stroke:#D93A2B;stroke-width:2}
.dia text.t{fill:#F2EFEA;font-size:11px;font-family:"IBM Plex Sans",sans-serif}
.dia text.g6{fill:#8FD07F;font-size:10px}

/* --- тумблер коррекции --- */
.swrow{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:6px 0 14px}
.swlab{font-size:13.5px;line-height:1.35;color:#E6E3DD;flex:1 1 auto;min-width:0}
.swlab small{display:block;font-size:11px;color:#8A8A94;margin-top:3px}
.sw{width:58px;height:32px;border-radius:16px;background:#2A2A31;border:1px solid var(--line);
  position:relative;flex:0 0 58px;cursor:pointer;transition:background .18s,border-color .18s}
.sw.on{background:var(--orange);border-color:var(--orange)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#8A8A94;
  transition:left .18s,background .18s;display:block}
.sw.on i{left:29px;background:#150900}
/* --- ссылки обратной связи --- */
.mseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-top:12px}

  get:async k=>{const v=localStorage.getItem(k); if(v===null) throw new Error('no key'); return {key:k,value:v};},
  set:async(k,v)=>{localStorage.setItem(k,v); return {key:k,value:v};},
  delete:async k=>{localStorage.removeItem(k); return {key:k,deleted:true};},
  list:async()=>({keys:Object.keys(localStorage)})};}
</script>

  ex:'G90 G54 G00 X0. Y0.',n:'Модальны. Если в программе нет G54, работает то, что осталось от прошлой детали.'},
 {c:'G154 P__',g:'Системы координат',mc:'b',t:'Дополнительные нулевые точки (Haas)',d:2,
  h:'G154 P1 … P99 — 99 дополнительных смещений вместо старых G110–G129.',
  f:'Аналог — G54.1 P1 … P48, опция «дополнительные системы координат». На современных стойках диапазон бывает шире — уточняйте по руководству на свою модель.',
  ex:'Haas:  G154 P12 G00 X0. Y0.\nFanuc: G54.1 P12 G00 X0. Y0.',
  n:'Прямой перенос кадра между стойками невозможен — меняется и код, и максимальный номер.'},
 {c:'G73',g:'Циклы',mc:'f',t:'Сверление с дроблением стружки',d:1,
  h:'G73 Z__ R__ Q__ F__, плюс переменный шаг через I J K.',
  f:'G73 Z__ R__ Q__ F__. Величина отскока задаётся параметром №5114.',
  ex:'G73 Z-40. R2. Q5. F120.',n:'Сверло отходит на доли миллиметра — только ломает стружку. Для глубоких отверстий берите G83.'},
 {c:'G74',g:'Циклы',mc:'f',t:'Нарезание левой резьбы метчиком',d:1,
  h:'Жёсткое нарезание встроено, дополнительных кодов не нужно.',
  f:'Перед циклом обязателен M29 S__ для жёсткого нарезания.',
  ex:'Haas:  G74 Z-20. R5. F1.5 (шаг при G95)\nFanuc: M29 S500\n       G74 Z-20. R5. F750.',
  n:'На токарном Fanuc G74 — это цикл сверления/канавок по торцу, совсем другая функция. Смотрите тип станка.'},
 {c:'G76',g:'Циклы',mc:'f',t:'Чистовое растачивание с отводом (фрезерный)',d:0,
  h:'G76 Z__ R__ Q__ P__ F__ — Q задаёт величину и сторону отвода перед подъёмом.',
  f:'То же. Направление отвода определяется ориентацией шпинделя.',
  ex:'G76 Z-30. R2. Q0.5 P500 F80.',
  n:'На токарном станке G76 — цикл нарезания резьбы. Один код, две совершенно разные функции.'},
 {c:'G80',g:'Циклы',mc:'f',t:'Отмена постоянного цикла',d:0,h:'Отменяет G73–G89, восстанавливает обычное движение.',f:'То же.',
  ex:'G80 G00 Z50.',n:'Забытый G80 — и следующее перемещение выполнит сверление там, где не надо. В стартовый кадр G80 ставят всегда.'},
 {c:'G81 / G82',g:'Циклы',mc:'f',t:'Сверление / сверление с выдержкой на дне',d:0,
  h:'G81 X__ Y__ Z__ R__ F__ ; G82 добавляет P (выдержка). Повтор по сетке — буква L.',
  f:'Формат тот же, но повтор — буква K.',
  ex:'Haas:  G81 Z-15. R2. F150. L3\nFanuc: G81 Z-15. R2. F150. K3',
  n:'Различие L/K касается всех циклов сверления. При переносе программы это правится в первую очередь.'},
 {c:'G83',g:'Циклы',mc:'f',t:'Глубокое сверление с полным выводом',d:1,
  h:'G83 Z__ R__ Q__ F__; переменный шаг I (первый), J (уменьшение), K (минимальный). Величина возврата — Setting 22 и 52.',
  f:'G83 Z__ R__ Q__ F__. Величина недохода при возврате — параметр №5115.',
  ex:'Haas:  G83 Z-60. I8. J1. K3. R2. F100.\nFanuc: G83 Z-60. Q6. R2. F100.',
  n:'Переменный шаг I J K есть только у Haas. На Fanuc глубину клевка Q делают постоянной и с запасом.'},
 {c:'G84',g:'Циклы',mc:'f',t:'Нарезание правой резьбы метчиком',d:2,
  h:'Жёсткое нарезание работает без дополнительных кодов. При G94 подача = шаг × обороты, при G95 — шаг напрямую.',
  f:'Обязательно M29 S__ в кадре перед G84, иначе цикл пойдёт в режиме плавающего патрона.',
  ex:'Haas:  G84 Z-20. R5. F1.25 (G95, шаг 1,25)\nFanuc: M29 S600\n       G84 Z-20. R5. F750. (600×1.25)',
  n:'Самое частое отличие в цеху. Забытый M29 на Fanuc — сорванная резьба или сломанный метчик.'},
 {c:'G85 / G86 / G89',g:'Циклы',mc:'f',t:'Развёртывание / расточка со стопом / расточка с выдержкой',d:0,
  h:'G85 — выход на подаче, G86 — стоп шпинделя и быстрый выход, G89 — как G85 с паузой.',f:'Идентично.',
  ex:'G85 Z-25. R2. F80.',n:'G86 оставляет след на стенке при выходе — для чистовых поверхностей берите G76.'},
 {c:'G87 / G88',g:'Циклы',mc:'f',t:'Обратное растачивание',d:0,h:'Инструмент вводится в отверстие со смещением, растачивает снизу вверх.',f:'Идентично.',
  ex:'G87 Z-40. R-50. Q0.5 F60.',n:'Требует специальной обратной оправки. Ошибка в знаке R — гарантированный удар.'},
 {c:'G90 / G91',g:'Режимы',mc:'b',t:'Абсолютные / относительные размеры',d:2,
  h:'Фрезерный — как обычно. Токарный Haas: G90 — цикл наружного точения, абсолют задаётся адресами X Z, приращения — U W.',
  f:'Фрезерный — как обычно. Токарный (система G-кодов A): G90 — цикл точения, абсолют X Z, приращения U W.',
  ex:'Фрезер: G90 G54 G00 X0. Y0.\nТокарный: G90 X50. Z-40. F0.25',
  n:'На токарных станках G91 в привычном смысле не используют. Приращение — это адреса U и W.'},
 {c:'G94 / G95',g:'Режимы',mc:'b',t:'Подача мм/мин / мм/об',d:0,h:'На фрезерном по умолчанию G94.',f:'На токарном соответствуют G98 / G99.',
  ex:'G94 F400.   (мм/мин)\nG95 F0.15   (мм/об)',n:'Перепутанный режим даёт подачу в сотни раз больше или меньше нужной. Проверяйте перед первой деталью.'},
 {c:'G96 / G97',g:'Токарные',mc:'t',t:'Постоянная скорость резания / постоянные обороты',d:0,
  h:'G96 S180 — 180 м/мин. Обязательно ограничение G50 S__.',f:'Идентично.',
  ex:'G50 S2500\nG96 S180 M03\n…\nG97 S1200',
  n:'При подходе к центру детали в режиме G96 обороты уходят в максимум — ограничение G50 обязательно, особенно с кулачками.'},
 {c:'G98 / G99',g:'Циклы',mc:'b',t:'Возврат в исходную плоскость / на плоскость R',d:2,
  h:'Фрезерный — как описано. Токарный Haas: G98 — подача мм/мин, G99 — мм/об.',
  f:'Фрезерный — как описано. Токарный: G98 — мм/мин, G99 — мм/об.',
  ex:'Фрезер: G99 G81 Z-10. R2. F150.\nТокарный: G99 G01 X50. F0.2',
  n:'Один код с двумя смыслами на разных типах станков. На фрезерном G99 экономит время между отверстиями, но не перепрыгнет прижим.'},
 {c:'G100 / G101',g:'Режимы',mc:'f',t:'Отмена / включение зеркала (Haas)',d:2,h:'G101 X__ — зеркало по оси. Отмена G100.',
  f:'Аналог — G51.1 X0. (включение) и G50.1 (отмена).',
  ex:'Haas:  G101 X0.\nFanuc: G51.1 X0.',n:'При зеркале меняется сторона коррекции радиуса — попутное фрезерование становится встречным.'},
 {c:'G103',g:'Режимы',mc:'b',t:'Ограничение просмотра кадров вперёд (Haas)',d:2,
  h:'G103 P1 — станок читает один кадр вперёд. Удобно при отладке и работе с макропеременными.',
  f:'Прямого аналога нет; глубина просмотра задаётся параметрами.',
  ex:'G103 P1   (отладка)\nG103 P0   (снять ограничение)',
  n:'При P1 экран показывает реально исполняемый кадр. Оставленный G103 P1 замедляет обработку сложных контуров.'},
 {c:'G70 / G71 / G72',g:'Токарные',mc:'t',t:'Чистовой / черновой продольный / черновой поперечный циклы',d:2,
  h:'Однокадровый формат: G71 P__ Q__ U__ W__ D__ F__ (D — глубина прохода в тысячных или с точкой).',
  f:'Двухкадровый формат: G71 U(глубина) R(отход); G71 P Q U W F.',
  ex:'Haas:  G71 P10 Q20 U0.4 W0.1 D2. F0.3\nFanuc: G71 U2. R0.5\n       G71 P10 Q20 U0.4 W0.1 F0.3',
  n:'U — припуск по диаметру, W — по торцу. Один и тот же адрес U в первом и втором кадре Fanuc означает разное: глубину прохода и припуск.'},
 {c:'G74 / G75',g:'Токарные',mc:'t',t:'Циклы сверления по торцу / прорезки канавок',d:1,
  h:'G74 — торцевое сверление с дроблением, G75 — канавки по диаметру: G75 X__ Z__ I__ K__ F__.',
  f:'То же назначение, формат с адресами X Z P Q R F.',
  ex:'Haas:  G75 X20. Z-30. I3. K5. F0.1\nFanuc: G75 R0.5\n       G75 X20. Z-30. P3000 Q5000 F0.1',
  n:'У Fanuc величины P и Q задаются в микронах без точки — источник ошибок на порядок.'},
 {c:'G76',g:'Токарные',mc:'t',t:'Цикл нарезания резьбы резцом',d:2,
  h:'G76 X__ Z__ K__ D__ F__ A__ P__ — K высота профиля на радиус, D первый проход, A угол, P тип врезания (P1 — одной стороной профиля резьбовой пластины, постоянный съём).',
  f:'Два кадра: G76 P(чистовых,сбег,угол) Q(мин. врезание, мкм) R(припуск); G76 X Z P(высота, мкм) Q(первый проход, мкм) F(шаг).',
  ex:'(М20x1.5: h=0.613x1.5=0.920, X=20-2x0.920=18.160)\nHaas:  G76 X18.16 Z-25. K0.92 D0.376 F1.5 A60 P1\nFanuc: G76 P011060 Q100 R0.05\n       G76 X18.16 Z-25. P920 Q376 F1.5',
  n:'У Fanuc P — слитное шестизначное число, а глубины в микронах. Проверяйте на воздухе с завышенным X перед первой резьбой.'},

 /* ===== дополнение до полного ряда G00–G200 ===== */
 {c:'G05 / G05.1',g:'Режимы',mc:'b',t:'Высокоскоростная контурная обработка',d:2,
  h:'Отдельного кода нет. За точность и сглаживание контура на Haas отвечает G187 P1…P3.',
  f:'G05 P10000 — режим HPCC (высокоточная контурная обработка). G05.1 Q1 — предпросмотр AI, отмена G05.1 Q0.',
  ex:'Fanuc: G05.1 Q1\n(тысячи мелких кадров из CAM)\nG05.1 Q0\n\nHaas:  G187 P1 E0.01',
  n:'Нужен только на 3D-выборке мелкими кадрами из CAM. На обычном контуре не даёт ничего, а на грубом сглаживании может увести размер.'},
 {c:'G07.1 / G107',g:'Токарные',mc:'b',t:'Цилиндрическая интерполяция (развёртка на цилиндр)',d:1,
  h:'G107 A0. — включить развёртку оси вращения на плоскость, отмена G107 A0 без радиуса. Нужен приводной инструмент.',
  f:'G07.1 C__ — включить (радиус цилиндра), G07.1 C0 — отмена. Обозначается также G107.',
  ex:'Haas:  G107 X0. Y0. Z0. Q10. R25.\nFanuc: G07.1 C25.  (радиус 25 мм)\n…\n       G07.1 C0',
  n:'Так фрезеруют паз или надпись на боковой поверхности вала: программа пишется как плоская, стойка сама пересчитывает Y в поворот шпинделя.'},
 {c:'G15 / G16',g:'Системы координат',mc:'f',t:'Отмена / включение полярных координат',d:0,
  h:'G16 включает полярный ввод в текущей плоскости: X — радиус, Y — угол. Полюс — активная нулевая точка или позиция после G16 в G91.',
  f:'То же. Полюс задаётся текущей нулевой точкой (G90) либо текущей позицией (G91).',
  ex:'G17 G16              (полярный режим, плоскость XY)\nG01 X50. Y30. F300   (R50 под 30°)\nY60.                 (тот же радиус, угол 60°)\nG15                  (отмена)',
  n:'Незаменимо для отверстий по окружности: радиус один, меняется только угол. Не забудьте G15 — иначе следующий кадр отработает X как радиус.'},
 {c:'G28 / G29',g:'Системы координат',mc:'b',t:'Возврат в исходную точку / возврат из неё',d:0,
  h:'G29 возвращает через ту же промежуточную точку, что была задана в G28.',
  f:'То же.',
  ex:'G91 G28 Z0.      (сначала подняться по Z)\nG91 G28 X0. Y0.  (потом развести X и Y)\nG90\n…\nG29 X50. Y40.    (обратно через ту же промежуточную)',
  n:'Без G91 промежуточной точкой станет X0 Y0 текущей нулевой — инструмент поедет через деталь. Не забывайте вернуть G90. G29 в цеху пишут редко: после смены инструмента проще выехать обычным G00, но в чужих программах он встречается.'},
 {c:'G30',g:'Системы координат',mc:'b',t:'Возврат во вторую (третью, четвёртую) исходную точку',d:1,
  h:'G30 — точка смены инструмента, заданная настройками. Часто удобнее G28.',
  f:'G30 P2 / P3 / P4 — номер исходной точки; без P действует вторая.',
  ex:'G91 G30 Z0.\nG90',
  n:'Вторую исходную точку ставят там, где удобно менять инструмент или снимать деталь, чтобы не гонять оси в дальний угол станка.'},
 {c:'G31',g:'Измерение',mc:'b',t:'Пропуск кадра по сигналу щупа',d:1,
  h:'G31 с щупом; координата касания пишется в макропеременные #5061…',
  f:'G31 аналогично, переменные #5061… Требует опции.',ex:'G31 Z-50. F300',
  n:'Работает только с исправным щупом и включённой опцией. Проверяйте M78/M79 (Haas) на срабатывание.'},
 {c:'G32',g:'Резьба',mc:'t',t:'Однопроходное нарезание резьбы резцом',d:1,
  h:'G32 X__ Z__ F__ — F равен шагу резьбы. Проход задаётся оператором вручную, глубина набирается кадр за кадром.',
  f:'G32 в системе кодов A; в системах B и C тот же код называется G33. Формат одинаков.',
  ex:'G97 S800 M03\nG00 X19.4 Z3.\nG32 Z-25. F1.5      (первый проход)\nG00 X22.\nZ3.\nX19.0\nG32 Z-25. F1.5      (второй проход)',
  n:'Обороты только постоянные (G97): при G96 шаг «поплывёт» и резьба выйдет рваной. Разгонный участок перед резьбой — не меньше двух шагов.'},
 {c:'G33',g:'Резьба',mc:'b',t:'Нарезание резьбы с постоянным шагом (общий код ISO)',d:1,
  h:'На токарном используется G32; на фрезерном резьбу фрезеруют по спирали G02/G03 с Z в кадре.',
  f:'G33 — тот же G32 в системах кодов B и C. На Sinumerik G33 — основной код резьбы: G33 Z__ K__ (шаг).',
  ex:'Sinumerik: G33 Z-30. K2.  SF=180\n           (двухзаходная М20, второй заход смещён на 180°)',
  n:'Именно этим кодом описывают резьбу учебники по ISO и Sinumerik. Встретив G33 в чужой программе на Fanuc — проверьте, какая система кодов включена параметром.'},
 {c:'G34 / G35',g:'Резьба',mc:'t',t:'Резьба с переменным шагом',d:1,
  h:'G34 X__ Z__ F__ K__ — K приращение шага на оборот. G35 отдельного смысла не имеет.',
  f:'G34 — увеличивающийся шаг, G35 — уменьшающийся (в базовых стойках чаще только G34).',
  ex:'G34 X18.16 Z-40. F2. K0.05\n(шаг растёт на 0,05 мм за оборот)',
  n:'Нужно для червяков и шнеков с переменным шагом. На обычной метрической резьбе не применяется.'},
 {c:'G36 / G37',g:'Измерение',mc:'f',t:'Автоматический замер нулевой точки / длины инструмента',d:1,
  h:'G35 — замер диаметра инструмента, G36 — автоматический замер нулевой точки детали, G37 — автоматический замер длины инструмента. Требуется щуп.',
  f:'G36 / G37 — автоматическая коррекция инструмента по сигналу измерителя. Формат задаёт изготовитель станка.',
  ex:'Haas: G36 Z-10. F100.   (замер и запись в G54)',
  n:'Кадр замера всегда идёт медленной подачей и с проверенным вылетом щупа. Ошибка в знаке — разбитый щуп, а это дороже партии деталей.'},
 {c:'G39',g:'Коррекции',mc:'f',t:'Скругление угла при коррекции радиуса',d:2,
  h:'Отсутствует. Обход угла на Haas выполняется автоматически.',
  f:'G39 I__ J__ — дуга обхода внешнего угла радиусом инструмента, без снятия коррекции.',
  n:'В учебниках по ISO этому соответствуют функции G450 (обход дугой) и G451 (обход по точке пересечения) — см. раздел «Коррекции» в Учебнике.'},
 {c:'G45 / G46 / G47 / G48',g:'Коррекции',mc:'f',t:'Сдвиг координаты на величину коррекции',d:2,
  h:'Отсутствуют. Припуск задают через колонку износа радиуса.',
  f:'G45 — увеличить перемещение на коррекцию, G46 — уменьшить, G47 — увеличить вдвое, G48 — уменьшить вдвое.',
  ex:'Fanuc: G45 G01 X50. D01',
  n:'Старый способ, доставшийся от станков без полноценной коррекции контура. В новых программах не применяется — используйте G41/G42.'},
 {c:'G60',g:'Режимы',mc:'f',t:'Одностороннее позиционирование',d:2,
  h:'Отсутствует.',
  f:'G60 X__ — подход к точке всегда с одной стороны, чтобы выбрать люфт винта. Направление и перебег задаются параметром.',
  n:'Помогает на изношенном станке при координатной обработке отверстий: точка берётся всегда с одной стороны, и люфт не входит в размер.'},
 {c:'G61 / G62 / G64',g:'Режимы',mc:'b',t:'Точный останов / коррекция угла / режим резания',d:1,
  h:'G61 — точный останов в каждом кадре, G64 — обычный режим. Тонкая настройка сглаживания — через G187.',
  f:'G61 — точный останов, G62 — автоматическое снижение подачи во внутреннем углу, G64 — режим резания.',
  ex:'G61            (углы острые, цикл дольше)\n…\nG64            (вернуть обычный режим)',
  n:'G61 ставят на чистовую обработку прямоугольных карманов, где угол должен быть острым. На черновой он только теряет время.'},
 {c:'G63',g:'Резьба',mc:'f',t:'Режим нарезания резьбы метчиком',d:1,

function viewCodes(SRC,kind){

  const list=SRC.filter(x=>{
    const okM=!x.mc||x.mc==='b'||x.mc===(mach==='turn'?'t':'f');
    if(!okM) return false;
    const okF=filter==='Все'||(filter==='Только отличия'?x.d>0:x.g===filter);
    const okQ=!q||(x.c+' '+x.t+' '+(x.h||'')+' '+(x.f||'')).toLowerCase().includes(q);
    return okF&&okQ;});
  if(!list.length) return `<div class="empty">Ничего не нашлось.<br>Попробуйте другой запрос или снимите фильтр.</div>`+CREDIT;
  return `<div class="wrap">`+list.map(x=>{
    const id=kind+':'+x.c, n=(NOTES[id]||[]).length;
    return `<div class="card" data-open="${esc(id)}">
      <div class="glow ${x.d>0?'d':''}"></div>
      <div class="row"><div class="code">${esc(x.c)}</div>${dbadge(x.d)}</div>

      ${n?`<div style="margin-top:8px"><span class="nbadge">${n} зам.</span></div>`:''}
    </div>`;}).join('')+`</div>`+CREDIT;
}

/* ============ сохранение и восстановление записей ============ */
function bkFile(name,text){
  try{
    if(window.Razryad&&window.Razryad.saveText){ const where=window.Razryad.saveText(name,text);
      toast(where&&where.length>3?('Сохранено: '+where):'Не удалось сохранить файл'); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    toast('Файл сохранён');
  }catch(e){ toast('Не удалось сохранить файл'); }
}
async function bkCopy(text){
  try{ await navigator.clipboard.writeText(text); toast('Скопировано в буфер'); return; }catch(e){}
  try{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('Скопировано в буфер');
  }catch(e){ toast('Буфер недоступен'); }
}
function bkStamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0');

 const CHANGES=[
 ['0.999','Программа сама открывается в своём эмуляторе','Кнопка «Проверить в эмуляторе» раньше вела только в токарный, а на фрезерной программе <b>не появлялась вовсе</b>: признак требовал одновременно X и Z. Теперь мост смотрит на рабочую плоскость и разводит код сам — G18 и токарные циклы уходят в токарный эмулятор, G17 с осью Y и циклы сверления во фрезерный. Работает и из генератора, и из примеров, и из «Фото → G-код». Когда плоскость не задана, а ось Y есть, признак слабый: ведём в токарный и говорим об этом вслух, а не угадываем молча. <b>Дуги теперь строятся во всех трёх плоскостях.</b> Раньше G02 и G03 вне G17 рисовались в XY — то есть показывалась не та траектория. Сейчас G18 считает по K/I в ZX, G19 по J/K в YZ, а третья ось идёт по прямой, поэтому винтовое врезание видно как есть. Подсветка G-кода и общие помощники вынесены в отдельный файл cnc-sim-core.js, который грузится первым. Фрезерный эмулятор больше не зависит от того, загрузился ли токарный: раньше при смене порядка тегов он молча оставался без подсветки. Из токарного убрана эвристика подрезки торца: слой от плоскости реза до торца снимает сама огибающая кромки, и проверка это подтвердила — цикл G94 с шагом 3 мм колец не оставляет. Две механики на одну задачу больше не спорят. Проверок стало 15 222 токарных и 1 247 фрезерных.'],
 ['0.998','Реальная геометрия инструмента и фрезерный эмулятор X/Y/Z','Токарный эмулятор перестал резать программной точкой. У каждого инструмента появился <b>силуэт режущей части в миллиметрах</b>, и он же рисуется на сцене, и он же вычитается из заготовки — разойтись они теперь не могут. Из этого само собой получилось то, что видно на станке: <b>радиус при вершине оставляет галтель во внутреннем углу</b> — уступ больше не выходит идеально острым; канавочный резец режет канавку ровно своей ширины с радиусами по углам и с привязкой к левому углу пластины, как задаёт корректор MGEHR; отрезной оставляет свою ширину; резьбовой оставляет профиль витками через шаг, а не гладкую проточку до внутреннего Ø; у сверла дно коническое — на 118° заборная часть равна 0,3 диаметра. <b>G41/G42 заработали по-настоящему.</b> Раньше компенсация просто сдвигала траекторию наружу и делала только хуже. Теперь она ставит центр дуги при вершине на нормаль к контуру: с G42 конус и дуга выходят на чертёж с точностью до шага сетки, а без компенсации остаётся тот самый припуск, который растёт вместе с радиусом вершины. На конусе 1:1 резцом rε 0,8 это 0,54 мм на диаметр — ровно та ошибка, из-за которой деталь уходит в брак. Инструмент рисуется <b>в натуральную величину</b>: державка 25×25 занимает на детали Ø60 столько же, сколько на станке. Над деталью появился запас, чтобы пластина не срезалась кромкой кадра, а кнопкой 1:1 силуэт можно уменьшить до схематичного. <b>Каталог вырос с 25 до 77 позиций</b>: формы C, D, S, T, V, W и круглая в правом и левом исполнении, позитив и негатив, углы в плане 45–107,5°, радиусы вершины 0,2–1,6; канавочные от 1 до 6 мм и отрезные лезвия; внутренние канавочные; резьбовые под метрику, дюйм, трапецию и NPT; расточные оправки от ⌀8 до ⌀32; свёрла, центровочные, зенковки, развёртки и метчики. В карточке станции появился поиск по обозначению — CNMG, MGEHR, 16ER. Добавлен <b>фрезерный эмулятор X/Y/Z</b> отдельным разделом. Деталь в нём — карта высот по X и Y: сверху видно форму, снизу разрез по линии, на которой стоит инструмент. Раскрываются циклы G81, G82, G83, G73, G84 и G85, работают G41/G42, G43, G90/G91 и дуги по I/J и R — включая полную окружность одним кадром, в том числе в записи без конечной точки. Съём считается по всей длине контакта фрезы с ячейкой, а не по одной точке сближения, поэтому <b>рампа и спиральное врезание срезают металл начисто</b>: у входа под 45° фрезой ⌀10 иначе оставался бы гребень в 5 мм, а пологая рампа даёт пол ровно на «радиус × уклон» ниже осевой линии — как и режет настоящая фреза. Каталог фрез — концевые, с радиусом при вершине, сферические, торцевые, фасочные, свёрла, метчики, развёртки; съём считается по настоящей форме дна, поэтому сферическая оставляет гребешок между строчками, фреза с радиусом — галтель в углу дна, а сверло — конус. Проверяются быстрый ход сквозь металл, глубина больше режущей части, уход ниже дна заготовки, вертикальное врезание на рабочей подаче, незакрытая G40 и работа без G43. Съём металла считается инкрементально с опорными снимками, поэтому обе сцены остаются плавными на программах в тысячу кадров. Появились два набора автопроверок: 15209 проверок токарной обработки и 602 фрезерной — каждая по фактической поверхности детали, а не по числу кадров.'],
 ['0.997','Эмулятор: плавный прогон, верное сверление и цвета кода как в CIMCO','Съём металла больше не пересчитывается с начала программы на каждом кадре: эмулятор держит снимок заготовки на границе кадра и опорные снимки через равные промежутки, поэтому вперёд идёт доливая по одному кадру, а назад — от ближайшей опоры. На программе в тысячу ходов кадр стал считаться за <b>0,14 мс вместо 51 мс</b> — плоский разрез 2D перестал зависать, и переключаться на 2.5D больше не нужно. ИСПРАВЛЕНО: сверло больше не упиралось в проверку стенки — если диаметр близок к наружному, отверстие теперь строится до допустимой глубины, а не пропадает целиком. Дно отверстия рисуется конусом при вершине: на 118° заборная часть равна 0,3 диаметра, поэтому полный диаметр начинается не от самой нижней точки Z. ИСПРАВЛЕНО: метчик рассверливал отверстие — он режет резьбу, а диаметр не меняет. ИСПРАВЛЕНО: внутренние канавочный и резьбовой резцы снимали наружный диаметр вместо стенки отверстия. ИСПРАВЛЕНО: после M30 на сцене вместо последнего инструмента появлялся резец из учебной формы, а в кадре «инструмент» стоял прочерк. ИСПРАВЛЕНО: подбор заготовки по программе брал наружный размер в том числе по кадрам сверления и расточки и занижал пруток до диаметра отверстия. ИСПРАВЛЕНО: границы кадра 2D строились в том числе по отводам циклов, из-за чего деталь уезжала и мельчала. ИСПРАВЛЕНО: опечатка в стилях — шесть кнопок транспорта верстались по сетке из четырёх и переносились на две строки. Появилась <b>подсветка G-кода цветами CIMCO Edit</b>: цвет каждого адреса взят из его файла Iso.mac, поэтому G, M, X, Z, F, S и T читаются с первого взгляда, комментарии выделены, активный кадр подсвечен строкой, а кадры с ошибками — красным фоном. Слева появились номера кадров. Схему можно переключить на тёмную теми же цветами. Переработан интерфейс: сверху панель режимов — вид <b>2D разрез</b> или <b>2.5D объём</b> подписанными кнопками, стойка Haas/Fanuc и схема цветов кода; слои и масштаб убраны под раскрывающийся заголовок; заготовка вынесена в отдельный раздел с автоподбором по программе, а учебная модель без NC свёрнута, чтобы не мешать. Под сценой появилась строка «заготовка → деталь» с фактическими размерами, а у вершины инструмента — выноска с диаметром и Z. В разрезе снятый металл показан отдельным тоном, поэтому видно, сколько ушло в стружку.'],
 ['0.996','Токарные циклы целиком и инструмент в реальных размерах','Раскрываются все основные токарные циклы, а не часть. Добавлены <b>G72</b> — черновой поперечный слоями от торца, <b>G73</b> — повтор контура для поковок, <b>G94</b> — цикл подрезки торца и <b>G92</b> — простой цикл резьбы. Приняты и написания системы кодов B: G77, G78 и G79 читаются как G90, G92 и G94. Все они поддерживают модальный повтор — кадр с одним X повторяет цикл, как на стойке. ИСПРАВЛЕНО: кадры контура между P и Q у циклов G72 и G73 исполнялись второй раз как обычные ходы, из-за чего инструмент уезжал не туда. ИСПРАВЛЕНО: подрезка торца снимала тонкий срез вместо слоя до свободного торца — между проходами оставался несуществующий металл, и отвод резца показывался как столкновение. ИСПРАВЛЕНО: у G76 на Haas адрес K — высота профиля резьбы, а приложение считало его числом повторов и выдавало ложное замечание. Сторона снятия у G71, G72 и G73 теперь определяется геометрией контура, а не типом инструмента; если они расходятся, приложение об этом предупредит. Каталог инструмента переведён на реальные каталожные размеры: сечение и длина державки, длина режущей кромки, минимальный диаметр отверстия для расточных оправок, предельная глубина реза для канавочных и отрезных, угол при вершине для свёрел. Силуэт каждого инструмента рисуется по этим размерам в масштабе сцены, поэтому проходной, расточной, канавочный и отрезной различаются с первого взгляда, и видно, влезает ли оправка в отверстие. Добавлена проверка глубины канавки: пластина шириной 3 мм не режет на 25 мм. В карточке станции появилось пояснение, что это за инструмент и где его применяют.'],
 ['0.995','Крупная сцена, перетаскивание и полный экран','Окно эмулятора CNC стало заметно выше: на телефоне вместо узкой полосы почти квадратная сцена. Деталь теперь можно <b>тянуть пальцем</b> прямо по сцене, масштабировать <b>щипком</b> или колесом мыши — причём зум привязан к точке под пальцем, поэтому нужное место не убегает. Двойное нажатие возвращает вид к исходному. Добавлен <b>полный экран</b>: кнопка ⛶ рядом с масштабом растягивает сцену на весь экран, скрывает нижнее меню и показывает поверх компактную панель — начало, кадр назад, пуск, кадр вперёд, FIT и выход. Выйти можно кнопкой ✕ или клавишей Esc. На главном экране «Работа» карточка эмулятора поднята на первое место; у тех, кто уже настроил раскладку под себя, она добавится сверху один раз и остальные карточки сохранятся. Напоминание: раскладку главной можно менять кнопкой «Настроить» или долгим нажатием на карточку — заменить, удалить, добавить из каталога или вернуть заводскую.'],
 ['0.994','Плоский эмулятор CNC, каталог инструмента и выбор стойки','Эмулятор CNC переведён на плоский разрез: осевая линия, заготовка и снятый металл в сечении, зона зажима штриховкой, сетка с подписями Z и диаметров, метка нуля детали, цветные G0/G1/G2/G3 и точки кадров. Прежний объёмный вид остался — переключатель 2D в панели. Каталог инструмента расширен до 28 позиций и разбит по группам: наружные и расточные резцы со сменной пластиной, канавочные и отрезные, резьбовые, шесть напайных резцов по типам ГОСТ и осевой инструмент — свёрла HSS, твердосплавное, со сменными пластинами, центровочное, метчик, развёртка. Каждый инструмент теперь рисуется своим силуэтом: форма пластины, угол в плане, ширина канавочной пластины, угол при вершине сверла и габарит державки видны на схеме и участвуют в проверке столкновений. В карточке каждой станции T появился предпросмотр выбранного инструмента. Добавлен переключатель диалекта стойки: Haas читает глубины циклов в миллиметрах, Fanuc — в микронах, и приложение предупреждает о кодах, которых на выбранной стойке нет (G187, G154, M97 против G54.1, G50.1/G51.1, M29), а также о путанице адресов L и K. В панель эмулятора вынесены переключатели раскрытия циклов и сетки. Локальный пример перенесён в папку samples, из проекта убраны дубликат сайта и временные файлы.'],
 ['0.993','Единый эмулятор CNC и настраиваемая работа','Любой токарный G-код из генератора, истории, анализатора, расчёта или учебного примера можно передать в общий эмулятор CNC одним нажатием. Переданный код открывается сразу, строит траекторию и создаёт отдельный выбор резца, расточной оправки, канавочного, резьбового или осевого инструмента для каждого T. Меню «Работа» теперь изменяется долгим нажатием: карточку можно заменить, удалить или добавить обратно; есть доступная кнопка настройки и восстановление заводской раскладки. Фото → G-код и эмулятор CNC получили красные плашки экспериментального режима. Навигационные возвраты используют реальную историю экрана. Сверены FIT/масштаб, G0, точки, дуги, резец, синхронный код, начало/конец, шаг, обратный ход, скорость, диаметральный I и раскрытие циклов.'],
 ['0.992','Точный эмулятор CNC по инструментам T','Каждая станция T получает отдельную карточку операции и габаритов. В одной программе последовательно проверяются наружное точение, расточка, канавка, резьба, сверло, центровка и метчик. G90, G71/G70 Type I, G75, G76, G81/G83 и сверлильный G74 раскрываются в реальные рабочие, клевковые и возвратные ходы; неподдерживаемые форматы блокируются вместо ложной линии. Сверло рисуется с конической вершиной, формирует отверстие по диаметру и проверяется по оси, рабочей длине, корпусу, стенке, зоне зажима и патрону. Добавлена 2D-компенсация G41/G42 по радиусу вершины, ширина канавочной пластины и синхронная подсветка активного T. Кнопка Play теперь сама переключается в паузу.'],
 ['0.991','Эмулятор CNC и точная терминология инструмента','Симуляция перестроена вокруг плоского разреза: готовый NC открывается первым, G0 не снимает металл, G1/G2/G3 изменяют профиль только при работающем шпинделе, дуги строятся по R или I/K. Добавлены синхронизация с активным кадром, пошаговое и обратное проигрывание, фильтры траектории, масштаб, автоподбор заготовки и локальный пример Turning.nc. В учебных действиях уточнены твердосплавная пластина и напайной резец. Переключатель токарного/фрезерного режима получил реальные схемы резца, державки и концевой фрезы.'],
 ['0.990','Предмаркетовая версия: единая работа и академия','Нижняя навигация включает Учёбу. Добавлены общий профиль станка, карта револьверной головки, журнал ресурса твердосплавной пластины, маршрут обучения с прогрессом и практикой по разрядам. Мастер Фото → G-код получил редактирование ступеней, ручную привязку найденных фасок, радиусов и сфер, совместный профиль станка, расширенный аудит программы и пошаговое проигрывание траектории.'],
 ['0.985','Объединение, рабочие инструменты и новая навигация','Объединён расширенный учебник и полный справочник G00–G200 с модулем Фото → G-код 0.980. Нижнее меню перестроено вокруг работы у станка, добавлен глобальный поиск по функциям, расчётам, кодам и учебным темам. Появились проверка готового G-кода, контроль первой детали с расчётом коррекции, карточка текущей наладки, быстрый разбор обозначения пластины и помощник по тревогам. Для основных разделов добавлены отдельные индустриальные фоны.'],
 ['0.980','Офлайн OCR, формы переходов и полный набор токарных циклов','Фото и сканы PDF распознаются локально Tesseract с оценкой уверенности. Добавлены фаски C×45°, галтели и скругления R, сферические участки SR/SØ, сверление G83/G74, наружные и внутренние канавки G75/G74, внутренняя резьба G76, профили Haas/Fanuc, каталог пластин, модель патрона и державки, история удачных режимов, QR-карточка и резервная копия.'],
 ['0.970','Тест на оценку и расшифровка инструмента','«Проверь себя» стал настоящим тестом: вопросы с четырьмя вариантами ответа, проверка, оценка по пятибалльной шкале (от 90 % — 5, от 75 % — 4, от 60 % — 3), разбор каждой ошибки с пояснением и список разделов, которые стоит перечитать — сразу ссылками. Вопросы свои для токарного и фрезерного. Новая папка «Расшифровка обозначений»: сменная пластина по ISO 1832 по всем семи позициям, токарная державка по ISO 5608 (PCLNR 2525 M12 разобран по буквам), расточная оправка, канавочные, отрезные и резьбовые пластины; для фрезерного — размеры концевой фрезы D, d, l, L, z, r, угол спирали, хвостовики и конусы шпинделя BT/SK/HSK, торцовые фрезы с СМП. Раздел «Режущий инструмент» дописан: типы резцов по назначению с углами в плане и типы фрез, материалы режущей части от быстрореза до PCD, группы обрабатываемости ISO P/M/K/N/S/H с цветами, покрытия, число зубьев, угол спирали, сменная пластина против напайной. Две новые схемы: углы резца в плане и размеры концевой фрезы. Раздел «Нормирование и экономика» убран.'],
 ['0.965','Учебник от А до Я','Раздел «Учёба» стал полноценным учебником: семь блоков и 29 папок — охрана труда, устройство станка, панель и режимы работы, первый пуск по шагам с последовательностью нажатий, чтение чертежа, мерительный и режущий инструмент, режимы резания, системы координат и нулевые точки, привязка инструмента, структура программы, интерполяция, полярные координаты и фаски, постоянные циклы, подпрограммы и макросы, четыре стойки (Fanuc с системами кодов A/B/C, Haas, Heidenhain TNC, Siemens Sinumerik), разбор брака по признаку, тревоги, нормирование и экономика операции, 40 вопросов для самопроверки. Добавлены одиннадцать схем: оси станка, нулевые точки, анатомия кадра, дуга и I/J, коррекция радиуса, номер вершины резца, уровни цикла сверления, работа G71, попутное и встречное фрезерование, происхождение шероховатости, группы клавиш панели. Справочник G-кодов дополнен до полного ряда G00–G200 — стало 68 карточек, добавлены полярные координаты, резьба G32/G33/G34, замеры G36/G37/G136, простые токарные циклы G90/G92/G94 и их двойники G77/G78/G79, цилиндрическая интерполяция, дополнительные нулевые точки, пятиосевые циклы. ИСПРАВЛЕНО: в разделе разрядов у G187 значения P1 и P3 были описаны наоборот — приложение советовало на чистовую 3D черновой режим (в карточке кода было верно). ИСПРАВЛЕНО: на токарном станке карточка G76 открывала фрезерное описание — растачивание вместо нарезания резьбы.'],
 ['0.960','Фото → G-код Haas','Новый мастер из шести шагов: шаблон детали, фото/PDF/DXF, подтверждение размеров, материал и инструмент, рекомендации режимов, G71/G70 и 2D-симуляция. Экспорт закрыт до подтверждения оператором.'],
 ['0.945','Разбор от сторонней проверки','ИСПРАВЛЕНО: у G187 были перепутаны местами P1 и P3 — приложение советовало на чистовую грубый режим. ИСПРАВЛЕНО: заголовок раздела в шапке никогда не менялся. ИСПРАВЛЕНО: коррекция на радиус в расточке считала нормали не в ту сторону — резец врубался в торец уступа на радиус пластины. ИСПРАВЛЕНО: врезание по спирали уходило глубже заданного из-за округления витков. Добавлены проверки: перепутанные диаметры, вывернутый контур, галтель не помещается в конус, участок короче радиуса пластины. Версия теперь берётся из одного места.'],
 ['0.940','Меню на весь экран','ИСПРАВЛЕНО: при первом открытии в браузере нижнее меню частично уходило под адресную строку и подписи разделов срезались — приходилось прокручивать страницу, чтобы увидеть их. Теперь размер берётся по реально видимой области и подстраивается сам: при появлении адресной строки, повороте телефона и открытии клавиатуры.'],
 ['0.935','Ввод чисел и нижнее меню','ИСПРАВЛЕНО: в браузере подписи разделов под иконками обрезались нижним краем экрана — высота теперь считается по реально видимой области. Поле с числом очищается при нажатии, стирать вручную больше не нужно, и вызывается цифровая клавиатура. Ушли не введя ничего — прежнее значение возвращается.'],
 ['0.930','Правка расчётов и сохранение записей','ИСПРАВЛЕНО: подача на дуге считалась наоборот — на наружном радиусе программа снижала подачу вместо повышения, на внутреннем поднимала. ИСПРАВЛЕНО: в расчёте шероховатости выводилась высота гребешка Rz, подписанная как Ra, — завышение примерно вчетверо. Добавлено сохранение и восстановление записей файлом, копирование любого блока кода по нажатию, уточнения по G04, G53, G54.1 и G76.'],
 ['0.925','Шестой разряд и посадки','Пятый и шестой разряды разделены: у шестого своя программа — точность выше 7-го квалитета, тонкостенные и длинные детали, проверка станка на биение и люфт. Посадок стало 34 вместо 15, добавлены квалитеты 5 и 10, в таблицу IT добавлен столбец IT5.'],
 ['0.920','Правка текста о версиях','ИСПРАВЛЕНО: в пояснении о нумерации стояло, что готовым продуктом будет 0.915. Готовым считается 1.0. Ошибка появилась из-за автозамены номера версии, которая задела обычный текст.'],
 ['0.915','Обучение по разрядам','Название и логотип: приложение стало «Разряд». Новый раздел обучения с делением на 3-й, 4-й и 5–6-й разряды, отдельно для токарного ST-30 и фрезерного VF-20: что знать, что уметь, как привязать инструмент, как внести поправку, чего делать нельзя. Добавлен список изменений по версиям.'],
 ['0.910','Разделение токарь / фрезер','Переключатель типа станка в шапке: коды, циклы и расчёты показываются только свои. Новая вкладка «Учёба»: инструкция по программированию, коррекции и масштабирование, восемь примеров программ, типовые ошибки. Фрезерные расчёты: гребешок, эффективный ⌀, подача на дуге, врезание по спирали. ИСПРАВЛЕНО: в примере G76 конечный диаметр не соответствовал шагу резьбы.'],
 ['0.905','Системные отступы','Меню больше не уезжает под кнопки навигации на телефонах с тремя кнопками. Кнопка «назад» выходит на уровень вверх, на верхнем уровне спрашивает подтверждение выхода.'],
 ['0.900','Коррекция на радиус','ИСПРАВЛЕНО: у переключателя коррекции отсутствовали стили — он был невидим и не нажимался. Проверена работа коррекции на всех 23 контурах.'],
 ['0.895','Эскизы с переменными','На чертежах подписаны D, d, L, R1, R2, углы A и B — теми же буквами, что в полях ввода. Ссылки на связь с разработчиком.'],
 ['0.890','Три вкладки и папки','Разделы собраны в «Коды» и «Расчёты», внутри — папки. Добавлен раздел «Ещё» с описанием и дисклеймером.'],

function arw(x1,y1,x2,y2,c){c=c||'#FF6B00';
  const a=Math.atan2(y2-y1,x2-x1),s=7;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.6"/>`
   +`<polygon points="${x2},${y2} ${(x2-s*Math.cos(a-.42)).toFixed(1)},${(y2-s*Math.sin(a-.42)).toFixed(1)} ${(x2-s*Math.cos(a+.42)).toFixed(1)},${(y2-s*Math.sin(a+.42)).toFixed(1)}" fill="${c}"/>`;}
const SVG=(w,h,inner)=>`<svg class="dia" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
const FIG=(t,svg,cap)=>`<div class="card"><div class="tag">${t}</div>${svg}${cap?`<div class="hint" style="margin-top:-5px">${cap}</div>`:''}</div>`;
const BOX=(x,y,w,h,txt,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#1B1B20" stroke="${c||'#3E3E48'}" stroke-width="1.4"/>`
  +`<text class="d" x="${x+w/2}" y="${y+h/2+3.5}" text-anchor="middle">${txt}</text>`;

    `+EDU.map(([n,d,list])=>`<div class="grp">${esc(n)}</div><div class="grpd">${esc(d)}</div>`

}

   <b>Позиционная</b><span>Инструмент переставляется из точки в точку, а резание идёт только по одной оси: сверление, зенкерование, нарезание резьбы. Траектория между отверстиями роли не играет.</span>
   <b>Контурная</b><span>Резание идёт при одновременном движении по двум и более осям: точение конуса, фрезерование контура, любая дуга. Здесь стойка каждую миллисекунду считает, где должна быть каждая ось, — это и называется интерполяцией.</span>
   </div>
   <div class="note" style="margin-top:10px">Отсюда и разница в требованиях: для позиционной важна точность выхода в точку,
   для контурной — согласованность осей. Изношенный станок сверлит ещё нормально, а конус уже даёт бочку.</div>`)}
 ${CARD('Что такое центр инструмента',`<div class="ct" style="margin-top:7px">
   Программа описывает движение не всего инструмента, а одной его точки — <b>центра инструмента</b>.
   Для сверла это точка пересечения оси с поперечной кромкой, для концевой сферической фрезы — центр полусферы,
   для резца — вершина или центр дуги при вершине.</div>
   <div class="note" style="margin-top:9px">Линия, по которой идёт эта точка, называется <b>траекторией инструмента</b>.
   Если радиус инструмента постоянен, траектория <b>эквидистантна</b> контуру детали — то есть везде отстоит от него на один и тот же радиус.
   Именно эту эквидистанту и считает коррекция G41/G42.</div>`)}`,

panel:T=>`
 <div class="note">Названия клавиш у Haas, Fanuc и Heidenhain разные, а группы — одни и те же.
   Найдите на своей панели эти шесть групп, и любая стойка перестанет быть незнакомой.</div>
 ${FIG('Как устроена любая панель',DIA.panel())}
 ${CARD('Режимы работы: главный переключатель',`<div class="dl">
   <b>Ручной</b><span>Оси гоняются кнопками или маховичком, шпиндель включается вручную. В этом режиме привязывают инструмент и подводят к детали.</span>
   <b>Толчковый (JOG)</b><span>Разновидность ручного: шаг 0,001 / 0,01 / 0,1 / 1 мм на щелчок маховичка. Подходить к детали — только на 0,001.</span>
   <b>Ручной ввод (MDI)</b><span>Набираете один-два кадра прямо на панели и запускаете. Так включают шпиндель, меняют инструмент, проверяют кадр.</span>
   <b>Покадровый (SINGLE BLOCK)</b><span>Программа останавливается после каждого кадра. Обязательный режим для первого прогона.</span>
   <b>Автоматический (MEM)</b><span>Программа идёт от начала до M30 без остановок, кроме M00 и M01.</span>
   <b>Редактирование (EDIT)</b><span>Правка текста программы. В этом режиме станок не движется.</span>
   <b>Графика / тест</b><span>Прогон траектории без движения осей. Ловит грубые ошибки, но не ловит забытую коррекцию.</span>
 </div>`)}
 ${CARD('Три корректора — то, что спасает деталь',`<div class="ct" style="margin-top:7px">
   Каждый из них уменьшает или увеличивает запрограммированное значение, не трогая саму программу.</div>
   <div class="dl">
   <b>Быстрый ход</b><span>5 / 25 / 50 / 100 %. На первом прогоне — 5 %. Именно здесь чаще всего случается врезание.</span>
   <b>Подача</b><span>0–120 % шагами. На первом прогоне 10–20 %, дальше поднимают, слушая станок.</span>
   <b>Обороты</b><span>50–120 %. Правят при дроблении и при появлении звука, которого раньше не было.</span>
   </div>
   <div class="note warn" style="margin-top:9px">Корректоры не работают в кадрах нарезания резьбы: там подача жёстко связана с оборотами.
   Крутить их во время резьбы бесполезно, а на некоторых стойках — опасно.</div>`)}
 ${CARD('Соответствие клавиш на трёх стойках',`<div class="tscroll"><table>
   <thead><tr><th>Что нужно</th><th>Haas</th><th>Fanuc</th><th>Heidenhain</th></tr></thead><tbody>
   <tr><td>Пуск программы</td><td>CYCLE START</td><td>CYCLE START</td><td>NC START</td></tr>
   <tr><td>Стоп подачи</td><td>FEED HOLD</td><td>FEED HOLD</td><td>NC STOP</td></tr>
   <tr><td>Выбор программы</td><td>LIST PROGRAM</td><td>PROG + DIR</td><td>PGM MGT</td></tr>
   <tr><td>Коррекции</td><td>OFFSET</td><td>OFFSET SETTING</td><td>TOOL TABLE</td></tr>
   <tr><td>Координаты</td><td>POSITION</td><td>POS</td><td>индикация положения</td></tr>
   <tr><td>Тревоги</td><td>ALARMS</td><td>MESSAGE</td><td>ERR</td></tr>
   <tr><td>Ручной ввод</td><td>MDI</td><td>MDI</td><td>позиционирование с ручным вводом</td></tr>
   <tr><td>Настройки</td><td>SETTING</td><td>OFFSET SETTING → SETTING</td><td>MOD</td></tr>
   <tr><td>Тест без движения</td><td>GRAPHICS</td><td>MACHINE LOCK + DRY RUN</td><td>тест программы</td></tr>
   </tbody></table></div>
   <div class="hint">На Heidenhain режимы переключаются не одной клавишей, а отдельными кнопками слева от экрана — по одной на каждый режим.</div>`)}
 ${CARD('Что должно быть на экране, когда вы работаете',`<div class="ct" style="margin-top:7px">
   Приучите себя держать открытым тот экран, где одновременно видно: текущий кадр, координаты,
   номер инструмента и величины корректоров. На Haas это <span class="kbd">POSITION</span> с разделённым экраном,
   на Fanuc — <span class="kbd">POS</span> в режиме ALL, на Heidenhain — разделение экрана программа плюс положение.</div>
   <div class="note" style="margin-top:9px">Начинающий смотрит на экран и не видит станок. Опытный смотрит на инструмент,
   а экран проверяет краем глаза. Первые смены сознательно заставляйте себя смотреть на резец.</div>`)}`,

first:T=>`
 <div class="note"><b>Здесь всё по шагам.</b> Порядок написан под ${T?'Haas ST-30':'Haas VF-20'};
   на Fanuc и Heidenhain названия клавиш другие, а последовательность действий та же.
   Пока не помните наизусть — держите этот экран открытым рядом со станком.</div>
 ${CARD('Пуск станка',`<ol class="seq">
   <li>Осмотреть станок: дверь цела, в зоне нет ключа, ветоши и инструмента, поддон не забит стружкой.</li>
   <li>Включить питание на вводном автомате, затем <span class="kbd">POWER ON</span> на панели.</li>
   <li>Провернуть и отпустить <span class="kbd">аварийный грибок</span> — пока он нажат, ничего не поедет.</li>
   <li>Нажать <span class="kbd">POWER UP</span> (на Fanuc — <span class="kbd">ZERO RETURN</span> → <span class="kbd">ALL</span>).
     Оси уйдут в исходное положение. <b>Убедитесь, что путь свободен</b>: станок идёт туда быстро и не смотрит, что мешает.</li>
   <li>Дать станку прогреться. После долгого простоя — программа прогрева шпинделя 10–15 минут: холодный станок «растёт» на сотые.</li>
 </ol>`)}
 ${CARD('Программа и заготовка',`<ol class="seq" start="6" style="counter-reset:q 5">
   <li><span class="kbd">LIST PROGRAM</span> → выбрать нужную → <span class="kbd">SELECT PROGRAM</span>.
     <b>Сверьте номер и имя с заданием</b>, а не «похоже, эта».</li>
   <li>Открыть программу и посмотреть шапку: какие инструменты, какая нулевая точка, какой размер заготовки. Незнакомую программу пролистать целиком.</li>
   <li>Проверить, что в коррекциях стоят те инструменты, которые в программе, и что все нужные строки заполнены.</li>
   <li>${T?'Установить заготовку в кулачки. Проверить вылет, биение индикатором и усилие зажима. Кулачки не должны попадать под первый проход резца.'
        :'Закрепить заготовку в тисках или прижимами. Выставить по угольнику, проверить вылет над губками. Убедиться, что фреза на всех проходах не встретит прижим.'}</li>
   <li>Закрыть дверь. Все дальнейшие шаги — с закрытой дверью.</li>
 </ol>`)}
 ${CARD('Первый прогон — самый ответственный',`<ol class="seq" start="11" style="counter-reset:q 10">
   <li>Режим <span class="kbd">MEM</span>. Включить <span class="kbd">SINGLE BLOCK</span> — покадровый режим.</li>
   <li>Корректоры: быстрый ход <b>5 %</b>, подача <b>10 %</b>, обороты 100 %.</li>
   <li><span class="kbd">CYCLE START</span> — и палец держите на <span class="kbd">FEED HOLD</span>.
     Каждый кадр запускается отдельным нажатием. Смотрите на инструмент.</li>
   <li>Пройти так всю программу. Убедились, что траектория верна и подводы безопасны — снять покадровый режим и поднять корректоры до 100 %.</li>
 </ol>
 <div class="note warn" style="margin-top:10px"><b>Стоп-сигналы, при которых немедленно жмут стоп подачи:</b>
 инструмент идёт не туда, где вы его ждали; появился звук, которого не было; пошёл дым или искры;
 деталь провернулась в зажиме; на экране мигает тревога.</div>`)}
 ${CARD('После первой детали',`<ol class="seq" start="15" style="counter-reset:q 14">
   <li>Остановить шпиндель, отвести инструмент, открыть дверь, снять деталь.</li>
   <li>Замерить все размеры с допуском. Записать фактические значения — не «в голове», а на листке.</li>
   <li>Внести поправку в <b>колонку износа</b> нужного инструмента. Геометрию не трогать.</li>
   <li>Прогнать вторую деталь и убедиться, что размер повторился. Только после этого работать партией.</li>
   <li>Дальше — контрольные замеры: первые детали чаще, потом по регламенту. Отдельно проверяют первую деталь после каждой замены пластины и после перерыва.</li>
 </ol>`)}
 <div class="note">Эти девятнадцать шагов — то, что 3-й разряд должен делать не задумываясь.
   Всё остальное в этом учебнике объясняет, <b>почему</b> они именно такие.</div>`
,

draw:T=>`
 <div class="note">Чертёж читают в одном и том же порядке. Пропустили пункт — потеряли деталь.</div>
 ${CARD('Порядок чтения',`<ol class="seq">
   <li><b>Штамп.</b> Материал, масштаб, общие допуски по ГОСТ 30893 (h14, H14, ±IT14/2 — «свободные размеры»), термообработка, покрытие.</li>
   <li><b>Габарит и заготовка.</b> Влезает ли деталь в станок, хватит ли припуска, чем зажимать.</li>
   <li><b>Базы.</b> Помечены буквами в треугольнике. От базы проставлены ответственные размеры — с неё и надо начинать обработку.</li>
   <li><b>Размеры с допуском.</b> Их выделяют маркером сразу: они пойдут отдельным чистовым проходом.</li>
   <li><b>Шероховатость.</b> Определяет чистовые режимы и число проходов.</li>
   <li><b>Допуски формы и расположения.</b> Биение, соосность, перпендикулярность — они решают, можно ли переставлять деталь.</li>
   <li><b>Резьбы, канавки, фаски.</b> Их часто забывают при составлении плана обработки.</li>
   <li><b>Технические требования текстом.</b> Внизу листа. Именно там прячется «острые кромки притупить» и «допускается…».</li>
 </ol>`)}
 ${CARD('Как читается размер с допуском',`<div class="ct" style="margin-top:7px">
   <b>⌀40h7</b> — это не «сорок». Это поле допуска: 40 — номинал, h — положение поля, 7 — квалитет (точность).
   Для ⌀40h7 допуск 25 мкм и поле идёт в минус: годный размер от 39,975 до 40,000.</div>
   <div class="dl">
   <b>H, h</b><span>Основные отверстие и вал: поле упирается в номинал. H — в плюс, h — в минус.</span>
   <b>Заглавная</b><span>Отверстие (охватывающий размер): H7, G7, JS7.</span>
   <b>Строчная</b><span>Вал (охватываемый): h6, g6, k6, n6, s6.</span>
   <b>Квалитет</b><span>Чем меньше число, тем точнее. IT6–IT7 — ответственные посадки, IT9–IT11 — обычная механика, IT14 — свободные размеры.</span>
   <b>±0,1</b><span>Симметричный допуск: годно от −0,1 до +0,1 от номинала.</span>
   </div>
   <div class="note" style="margin-top:9px">Точные значения по любому полю и диаметру считает вкладка
   <b>Расчёты → Допуски и посадки</b>: она даёт предельные размеры, зазор и натяг.</div>`)}
 ${CARD('Шероховатость: что реально достижимо',`<div class="tscroll"><table>
   <thead><tr><th>Обозначение</th><th>Чем получают${T?' (точение)':' (фрезерование)'}</th><th>Подача</th></tr></thead><tbody>
   <tr><td class="num">Ra 12,5</td><td>черновой проход</td><td class="num">${T?'0,3–0,5 мм/об':'0,2–0,3 мм/зуб'}</td></tr>
   <tr><td class="num">Ra 6,3</td><td>получистовой</td><td class="num">${T?'0,2–0,3 мм/об':'0,1–0,2 мм/зуб'}</td></tr>
   <tr><td class="num">Ra 3,2</td><td>чистовой, острая пластина</td><td class="num">${T?'0,12–0,2 мм/об':'0,05–0,1 мм/зуб'}</td></tr>
   <tr><td class="num">Ra 1,6</td><td>чистовой, радиус 0,8, жёсткая наладка</td><td class="num">${T?'0,08–0,12 мм/об':'0,03–0,06 мм/зуб'}</td></tr>
   <tr><td class="num">Ra 0,8</td><td>тонкое точение, часто уже шлифование</td><td class="num">${T?'0,05–0,08 мм/об':'выхаживающий проход'}</td></tr>
   <tr><td class="num">Ra 0,4 и точнее</td><td>шлифование, хонингование, притирка</td><td>—</td></tr>
   </tbody></table></div>
   <div class="hint">Значения ориентировочные: реальная шероховатость зависит ещё от материала, СОЖ, жёсткости и состояния режущей части пластины или напайного резца.</div>`)}
 ${FIG('Почему подача решает чистоту',DIA.rz(),
   'Гребешки между проходами и есть шероховатость. Уменьшили подачу вдвое — гребешок упал вчетверо. Взяли радиус при вершине больше — тоже упал. Считается во вкладке Расчёты → Режимы резания.')}
 ${CARD('Обозначение резьбы',`<div class="dl">
   <b>M20×1,5</b><span>Метрическая, наружный ⌀ 20 мм, шаг 1,5 мм. Без указания шага — крупный по умолчанию (для М20 это 2,5).</span>
   <b>M20×1,5-6g</b><span>6g — поле допуска резьбы. Строчная — наружная (болт), заглавная 6H — внутренняя (гайка).</span>
   <b>LH</b><span>Левая резьба. Без пометки — правая.</span>
   <b>G1/2</b><span>Трубная цилиндрическая, размер по условному проходу трубы, а не по диаметру резьбы.</span>
   <b>Tr40×6</b><span>Трапецеидальная — ходовые винты.</span>
   </div>
   <div class="note" style="margin-top:9px">Диаметр под наружную резьбу ≈ номинал минус 0,1–0,2 мм;
   ⌀ сверла под внутреннюю ≈ номинал минус шаг. Точные значения — во вкладке <b>Расчёты → Резьба</b>.</div>`)}`,

meas:T=>`
 <div class="note">Измерение — половина работы оператора. Неверный замер выглядит точно так же, как неверная программа,
   только искать причину будете дольше.</div>
 ${CARD('Чем что мерить',`<div class="tscroll"><table>
   <thead><tr><th>Инструмент</th><th>Точность</th><th>Для чего</th></tr></thead><tbody>
   <tr><td>Штангенциркуль</td><td class="num">0,1 / 0,05</td><td>черновые и свободные размеры, глубины, уступы</td></tr>
   <tr><td>Штангенциркуль цифровой</td><td class="num">0,01*</td><td>то же; цена деления 0,01, но реальная погрешность около 0,03</td></tr>
   <tr><td>Микрометр</td><td class="num">0,01</td><td>наружные размеры с допуском, валы, толщины</td></tr>
   <tr><td>Нутромер индикаторный</td><td class="num">0,01</td><td>отверстия: диаметр и его отклонение по длине</td></tr>
   <tr><td>Индикатор ИЧ на стойке</td><td class="num">0,01</td><td>биение, люфт, выверка приспособления, конус</td></tr>
   <tr><td>Калибр-пробка / скоба</td><td>годен / не годен</td><td>серийный контроль: быстро и без спора</td></tr>
   <tr><td>Резьбовой калибр</td><td>годен / не годен</td><td>единственный честный контроль резьбы</td></tr>
   <tr><td>Образцы шероховатости</td><td>сравнение</td><td>оценка Ra на глаз и ноготь</td></tr>
   <tr><td>Щуп измерительный на станке</td><td class="num">0,005</td><td>привязка и контроль прямо в цикле</td></tr>
   </tbody></table></div>
   <div class="hint">* Цена деления и точность — разные вещи. Цифры на экране не делают инструмент точнее.</div>`)}
 ${CARD('Правила, без которых замер врёт',`<div class="dl">
   <b>Температура</b><span>Деталь после резания горячая и «выросла». Сталь ⌀100 при нагреве на 20 °С даёт +0,024 мм. Ответственный размер меряют остывшим.</span>
   <b>Усилие</b><span>Микрометр — только через трещотку, до трёх щелчков. «Дожал посильнее» — это минус две сотки.</span>
   <b>Чистота</b><span>Стружка или заусенец под губкой добавляет столько же, сколько вы ищете. Протереть и деталь, и инструмент.</span>
   <b>Нулевая точка</b><span>Микрометр проверяют по эталону или сведением пяток перед каждой сменой.</span>
   <b>Место замера</b><span>Диаметр меряют в двух-трёх сечениях и в двух направлениях: так ловятся конус и овальность.</span>
   <b>Безопасность</b><span>Замер только при остановленном шпинделе и отведённом инструменте. Всегда.</span>
 </div>`)}
 ${CARD('Как понять деталь по замерам',`<div class="dl">
   <b>Конус по длине</b><span>${T?'Увод от задней бабки, износ направляющих, длинный вылет без центра.':'Непараллельность оси шпинделя столу, увод длинной фрезы.'}</span>

 ${CARD('Эквидистанта и обход углов',`<div class="ct" style="margin-top:7px">

fanuc:T=>`
 <div class="note">Самая распространённая стойка в мире и «родитель» кодового языка, которым говорят почти все остальные.

 ${CARD('Экраны и клавиши',`<div class="dl">
   <b>POS</b><span>Координаты. Режимы ABSOLUTE (от нуля детали), RELATIVE (счётчик оператора), MACHINE (от нуля станка), ALL (всё сразу — этот и держите открытым).</span>

   <b>MESSAGE</b><span>Тревоги и их история. Первое место, куда смотрят, когда станок встал.</span>
   <b>GRAPH</b><span>Графическая прорисовка траектории.</span>
   <b>CUSTOM / HELP</b><span>Экраны изготовителя станка и справка.</span>
   </div>`)}

   <b>SINGLE BLOCK</b><span>Покадровый режим — отдельная клавиша, а не подрежим.</span>
   <b>OPTION STOP</b><span>Включает работу M01.</span>

heid:T=>`
 <div class="note">Heidenhain TNC устроен иначе: вместо букв G здесь диалог. Кадр открывается клавишей движения
   (<b>L</b> — прямая, <b>C</b> — дуга), а стойка сама спрашивает, что подставить. Программу пишут прямо у станка,
   и это её главное преимущество.</div>

│    │         │    │     └ дополнительная функция
│    │         │    └ подача
│    │         └ коррекция на радиус: R0, RL или RR
│    └ координаты конечной точки
└ клавиша открытия кадра (L — линейное перемещение)</pre>
   <div class="dl">
   <b>RL / RR</b><span>Коррекция слева и справа по ходу движения — аналог G41 и G42. R0 — без коррекции.</span>
   <b>FMAX</b><span>Быстрый ход, действует один кадр.</span>
   <b>F0…9998</b><span>Подача мм/мин, модально.</span>
   <b>FZ / FU</b><span>Подача на зуб и на оборот: F = FZ · z · n, F = FU · n.</span>
   <b>M3 / M4 / M5</b><span>Те же вспомогательные функции, что везде.</span>
   </div>`)}
 ${CARD('Начало и конец программы',`<pre class="blk" style="margin-top:9px">0 BEGIN PGM DETAL1 MM
1 BLK FORM 0.1 Z X+0 Y+0 Z-40      заготовка: минимальная точка
2 BLK FORM 0.2 X+100 Y+100 Z+0     заготовка: максимальная точка
3 TOOL CALL 1 Z S732               вызов инструмента и оборотов
4 L Z+100 R0 FMAX M3               безопасная высота, шпиндель
5 L X+20 Y+20 R0 FMAX              подвод к первой точке
…
99 L Z+100 R0 FMAX M30
100 END PGM DETAL1 MM</pre>
   <div class="dl">
   <b>BLK FORM</b><span>Габариты заготовки. Без них не работает графическая симуляция и FK-программирование.</span>
   <b>TOOL CALL</b><span>Номер инструмента, ось шпинделя и обороты в одном кадре.</span>
   <b>Безопасное расстояние</b><span>Расстояние от нуля заготовки до нижней точки инструмента при перемещениях. Второе безопасное расстояние — то же для выхода в стартовую точку.</span>
   </div>`)}
 ${CARD('Клавиши построения траектории',`<div class="dl">
   <b>L</b><span>Прямая.</span>
   <b>CC</b><span>Центр окружности или полюс для полярных координат.</span>
   <b>C</b><span>Дуга вокруг заданного центра CC.</span>
   <b>CR</b><span>Дуга по заданному радиусу.</span>
   <b>CT</b><span>Дуга, касательная к предыдущему элементу, — переход без излома.</span>

   <b>CHF</b><span>Снятие фаски.</span>

   <b>FK</b><span>Свободное программирование контура: контур задаётся так, как проставлен на чертеже, даже если координат точек нет.</span>

   <div class="hint">FK — то, ради чего многие и выбирают Heidenhain: чертёж с углами и касательными вводится напрямую, без пересчёта в координаты.</div>`)}
 ${CARD('Циклы: два вида вызова',`<div class="dl">
   <b>DEF-активные</b><span>Отрабатывают сразу при определении: циклы шаблонов 220 и 221, SL-циклы 14 и 20, цикл 9 (выдержка), циклы преобразования координат.</span>

   </div>

  Q200=2    безопасное расстояние

  Q206=150  подача врезания

 ${CARD('Основные циклы',`<div class="tscroll"><table>
