const quizList=()=>QUIZ.filter(q=>!q.mc||q.mc===(mach==='turn'?'t':'f'));
const FNAME=id=>{const f=FOLDERS_BASE.learn.find(x=>x[0]===id);return f?f[1]:id;};

function quizScore(L){
  const ok=L.filter((q,i)=>quizA[i]===q.c).length, n=L.length;
  const p=Math.round(ok/n*100);
  const m=p>=90?5:p>=75?4:p>=60?3:2;
  const col=m===5?'#8FD07F':m===4?'var(--ember)':m===3?'var(--hot)':'var(--red)';
  const txt={5:'Отлично. Материал усвоен — можно идти к наладчику за практикой.',
             4:'Хорошо. Пробелы есть, но небольшие: пройдите разделы из списка ниже.',
             3:'Удовлетворительно. К станку допускают, но половину тем нужно перечитать.',
             2:'Неудовлетворительно. Вернитесь к учебнику и пройдите тест заново.'}[m];
  const weak=[...new Set(L.filter((q,i)=>quizA[i]!==q.c).map(q=>q.f))];
  return `<div class="card"><div class="glow" style="background:${col}"></div>
    <div class="tag">Результат</div>
    <div style="display:flex;align-items:center;gap:16px;margin-top:10px">
      <div style="font-family:Oswald;font-size:56px;line-height:1;color:${col};min-width:52px;text-align:center">${m}</div>
      <div><div style="font-family:Oswald;font-size:17px">${ok} из ${n} · ${p} %</div>
      <div class="ct" style="font-size:12.5px;margin-top:4px;line-height:1.45">${txt}</div></div>
    </div>
    <div class="hint" style="margin-top:11px">Шкала: 90 % и выше — 5, от 75 % — 4, от 60 % — 3, ниже — 2.</div>
    ${weak.length?`<div class="sec" style="margin:16px 0 8px">Что перечитать</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">${weak.map(id=>
      `<div class="chip" data-folder="${id}" style="cursor:pointer">${esc(FNAME(id))}</div>`).join('')}</div>`
      :`<div class="note" style="margin-top:12px;border-color:#2b4423;background:#12210f">Ни одной ошибки. Разбирать нечего.</div>`}
  </div>`;
}

function quizView(){
  const L=quizList(), n=L.length;
  const left=L.filter((q,i)=>quizA[i]===undefined).length;
  const head=quizDone?quizScore(L)
    :`<div class="note"><b>Тест на оценку: ${n} вопросов.</b> В каждом один верный ответ.
       Отвечайте не подглядывая в учебник — иначе смысла нет. После проверки будет видно,
       где ошиблись, почему, и какие разделы стоит перечитать.</div>`;
  const body=L.map((q,i)=>{
    const sel=quizA[i], right=sel===q.c;
    return `<div class="card"><div class="glow${quizDone&&!right?' d':''}"${quizDone&&right?' style="background:#8FD07F"':''}></div>
      <div class="qnum">Вопрос ${i+1} из ${n} · ${esc(q.t)}</div>
      <div style="font-size:14.5px;line-height:1.45;margin-top:7px">${esc(q.q)}</div>
      ${q.a.map((txt,j)=>{
        let cls='opt';
        if(quizDone){ if(j===q.c) cls+=' ok'; else if(j===sel) cls+=' no'; }
        else if(j===sel) cls+=' sel';
        return `<div class="${cls}" data-q="${i}" data-o="${j}"><i>${'АБВГ'[j]}</i><span>${esc(txt)}</span></div>`;
      }).join('')}
      ${quizDone?`<div class="note ${right?'':'warn'}" style="margin-top:10px">
        <b>${right?'Верно.':(sel===undefined?'Без ответа.':'Неверно.')}</b> ${esc(q.w)}</div>`:''}
    </div>`;}).join('');
  const btn=quizDone
    ?`<button class="btn" id="qzGo" style="margin:6px 0 4px">Пройти заново</button>`
    :`<button class="btn" id="qzGo" style="margin:6px 0 4px">${left?`Проверить · без ответа ${left}`:'Проверить ответы'}</button>`;
  return head+body+btn;
}

function learnContent(f){
  const T=mach==='turn';
  if(EDUC[f]) return `<div class="wrap">`+EDUC[f](T)+CREDIT+`</div>`;
  if(f==='rank'){
    const R=RD[mach];
    if(!rank) return `<div class="wrap">
      <div class="note">Разделено по разрядам: что нужно знать, что уметь и чего делать нельзя. Описано под ${R.st} — станок, на котором вы работаете.</div>
      ${RANKS.map(([k,n,d])=>`<div class="card" data-rank="${k}"><div class="glow"></div>
        <div style="display:flex;align-items:center;gap:13px">
          <div style="font-family:Oswald;font-size:30px;color:var(--orange);line-height:1">${k}</div>
          <div><div style="font-family:Oswald;font-size:17px">${esc(n)}</div>
            <div class="ct" style="font-size:12.5px;margin-top:2px">${esc(d)}</div></div></div></div>`).join('')}
      `+CREDIT+`</div>`;
    const r=R[rank], nm=RANKS.find(x=>x[0]===rank);
    const list=(t,a,cls)=>`<div class="card"><div class="tag">${t}</div>
      <div style="margin-top:9px">${a.map(x=>`<div class="ct" style="display:flex;gap:9px;margin-bottom:8px;line-height:1.5">
        <span style="color:var(--orange)">•</span><span>${x}</span></div>`).join('')}</div></div>`;
    return `<div class="wrap">
      <div class="card"><div class="glow"></div><div class="tag">${esc(nm[1])} · ${esc(R.st)}</div>
        <div class="ct" style="margin-top:8px;line-height:1.55">${esc(r.c)}</div></div>
      ${list('Что нужно знать',r.know)}
      ${list('Что должен уметь',r.can)}
      <div class="card"><div class="tag">Как это делается</div><pre class="blk" style="margin-top:9px">${esc(r.how)}</pre></div>
      <div class="card"><div class="tag">${rank==='3'?'Поправка на размер':rank==='4'?'Отладка':rank==='5'?'Разбор брака':'Проверка станка'}</div>
        <pre class="blk" style="margin-top:9px">${esc(r.fix)}</pre></div>
      <div class="card"><div class="glow d"></div><div class="tag">Чего делать нельзя</div>
        <div style="margin-top:9px">${r.no.map(x=>`<div class="ct" style="display:flex;gap:9px;margin-bottom:8px;line-height:1.5">
          <span style="color:var(--red)">✕</span><span>${esc(x)}</span></div>`).join('')}</div></div>
      `+CREDIT+`</div>`;
  }
  if(f==='instr') return `<div class="wrap">
    <div class="note">Порядок, в котором пишут и запускают программу на ${T?'токарном':'фрезерном'} станке. Коротко, по шагам — то, что должно быть в голове до того, как нажать CYCLE START.</div>
    ${STEP(1,'Разобрать чертёж','Что базовое, где нулевая точка по Z, какие размеры с допуском, какая шероховатость. Размеры с допуском обрабатываются отдельным чистовым проходом, свободные — черновым.')}
    ${STEP(2,'Выбрать базы и закрепление',T
      ?'Что зажимаем в кулачки, нужен ли центр и люнет. Вылет из кулачков больше 3–4 диаметров — уже нужен центр, иначе деталь уведёт конусом.'
      :'Тиски, прижимы или приспособление. Проверьте, что фреза на всех проходах не встретит прижим — это самая частая авария на фрезере.')}
    ${STEP(3,'Составить план обработки',T
      ?'Торцевать → черновой контур G71 → чистовой G70 → канавки → резьба → отрезка. Каждый инструмент отрабатывает всё своё за один заход, лишние смены — потеря времени и точности.'
      :'Торцевать → черновая выборка → сверление → чистовой контур → фаски → резьба. От большего инструмента к меньшему.')}
    ${STEP(4,'Назначить нулевую точку','G54 по торцу детали. ' + (T
      ?'X — всегда ось вращения, её задаёт привязка резца по диаметру; Z — чистовой торец.'
      :'X и Y — угол или центр детали по чертежу; Z — верхняя плоскость либо стол, как принято в цехе.'))}
    ${STEP(5,'Привязать инструмент',T
      ?'Каждый резец привязывается по X (проточить и замерить) и по Z (коснуться торца). Радиус пластины и номер вершины вносят в таблицу — без них G41/G42 работать не будет.'
      :'Длина каждого инструмента вносится в таблицу как H, радиус фрезы — как D. Номер H всегда совпадает с номером инструмента, иначе поедет по Z.')}
    ${STEP(6,'Написать программу','Безопасный стартовый кадр, затем инструмент за инструментом. Каждый блок начинается с вызова инструмента и коррекции, заканчивается отводом в безопасную точку.')}
    ${STEP(7,'Проверить на воздухе','Нулевую по Z поднять на 50 мм, прогнать Single Block с корректорами на минимуме. Смотреть не на экран, а на инструмент. Только после этого — на металл.')}
    ${STEP(8,'Первая деталь','Черновой проход, замер, поправка через износ, чистовой проход. Не правьте геометрию инструмента — только износ, иначе потеряете привязку.')}
    ${CARD('Безопасный стартовый кадр', `<pre class="blk" style="margin-top:9px">`+(T
      ?`%\nO0001 (VAL 40X120)\nG21 G40 G99 G97\nG28 U0. W0.\nT0101 (RESEC CHERNOVOY)\nG50 S2500\nG96 S180 M03\nG00 X42. Z2. M08\n...\nG00 X200. Z200. M09\nM01`
      :`%\nO0001 (KRYSHKA)\nG00 G17 G21 G40 G49 G80 G90 G94\nT1 M06\nG00 G90 G54 X0. Y0. S1200 M03\nG43 H01 Z50. M08\n...\nG00 G53 Z0. M09\nM01`)+`</pre>`)}
  </div>`;

  if(f==='corr') return `<div class="wrap">
    <div class="note">Тема, на которой чаще всего теряют размер и ломают инструмент. Разбираем по порядку: что такое коррекция, где она лежит и как её менять.</div>
    ${FIG('Слева или справа — по ходу движения',DIA.comp(),
      'Сторону определяет не деталь, а направление, в котором идёт инструмент. Мысленно встаньте на инструмент, посмотрите вперёд по ходу: контур слева — G41, справа — G42.')}
    ${T?`
    ${CARD('Коррекция инструмента: T0101',`<div class="ct" style="margin-top:7px">Первые две цифры — номер револьверной позиции, вторые — номер строки в таблице коррекций. Обычно их делают одинаковыми, но это не обязательно: T0102 возьмёт тот же резец с другой коррекцией — так делают чистовой и черновой проход одним инструментом.</div>
      <pre class="blk" style="margin-top:9px">T0101   (резец 1, коррекция 1)\nT0100   (снять коррекцию перед сменой)</pre>`)}
    ${CARD('Геометрия и износ',`<div class="ct" style="margin-top:7px">В таблице две колонки. Геометрия — где инструмент стоит относительно нуля, вносится один раз при привязке. Износ — поправка на замер детали, в неё и вносят все правки.</div>
      <div class="note warn" style="margin-top:9px">В типовой конфигурации Haas с X по диаметру деталь ⌀40,08 вместо ⌀40,00 требует поправки износа X на 0,08 мм в сторону уменьшения диаметра. Знак и поле поправки обязательно подтвердите по ориентации резца, профилю станка и пробному перемещению.</div>`)}
    ${CARD('Радиус при вершине: G41 / G42',`<div class="ct" style="margin-top:7px">Пока точите цилиндр и торец, радиус пластины не мешает. Как только пошёл конус или дуга — размер уходит. Либо включаем коррекцию, либо считаем смещённый контур во вкладке «Расчёты».</div>
      <pre class="blk" style="margin-top:9px">G00 X20. Z2.\nG42 G01 Z0. F0.2      (включили на подходе)\nX30. Z-20.            (конус — здесь она и работает)\nG40 G00 X100. Z100.   (сняли на отводе)</pre>
      <div class="hint">Направление G41/G42 зависит от направления прохода, стороны контура, ориентации револьверной головки и номера вершины пластины. Подсказка профиля станка — стартовая: сверьте её с руководством, таблицей коррекций и графикой стойки. Радиус R и номер вершины T должны соответствовать фактической установке.</div>`)}
    ${CARD('Масштабирование на токарном',`<div class="ct" style="margin-top:7px">Отдельного масштаба нет: то, что на фрезере делают через G51, на токарном делают припуском U и W в цикле G71. U — припуск по диаметру, W — по торцу.</div>
      <pre class="blk" style="margin-top:9px">G71 U2. R0.5\nG71 P10 Q20 U0.4 W0.1 F0.3\n(U0.4 = по 0,2 мм на сторону под чистовую)</pre>`)}
    `:`
    ${CARD('Коррекция длины: G43 H',`<div class="ct" style="margin-top:7px">Каждый инструмент имеет свою длину. G43 H01 говорит стойке: «работай с длиной из строки 1». Номер H держите равным номеру инструмента — тогда не перепутаете.</div>
      <pre class="blk" style="margin-top:9px">T1 M06\nG00 G90 G54 X0. Y0. S1200 M03\nG43 H01 Z50. M08   (подвод с коррекцией)\n...\nG49 G00 Z200.      (снять перед сменой)</pre>
      <div class="note warn" style="margin-top:9px">Забытый G43 — фреза едет в деталь на всю длину вылета. Проверяйте, что в кадре подвода по Z стоит G43 и правильный H.</div>`)}
    ${CARD('Коррекция радиуса: G41 / G42 D',`<div class="ct" style="margin-top:7px">Программа пишется по контуру детали, а фреза идёт на радиус в сторону. G41 — коррекция слева по ходу движения (попутное фрезерование наружного контура), G42 — справа.</div>
      <pre class="blk" style="margin-top:9px">G00 X-15. Y-15.        (точка подхода вне контура)\nG41 D01 G01 X0. Y-10. F400   (ввод — на прямой)\nY50.\nX60.\n...\nG40 G01 X-15. Y-15.    (вывод — тоже на прямой)</pre>
      <div class="hint">Ввод и вывод только на линейном перемещении длиной не меньше радиуса фрезы. Внутренний угол радиусом меньше радиуса фрезы стойка выполнить не сможет — выдаст тревогу либо зарежет.</div>`)}
    ${CARD('Зачем менять D, а не программу',`<div class="ct" style="margin-top:7px">Замерили контур — он на 0,1 мм больше. Не трогая программу, уменьшаете D на 0,05 (радиус!) — и контур сходится. Так же оставляют припуск: пишете D больше фактического радиуса на величину припуска и снимаете его вторым проходом той же программой.</div>
      <div class="note" style="margin-top:9px">Фреза ⌀12, D = 6,0. Нужен припуск 0,3 на сторону — ставим D = 6,3, гоняем черновой. Потом D = 6,0 — и тот же кадр отрабатывает начисто.</div>`)}
    ${CARD('Масштабирование: G51 / G50',`<div class="ct" style="margin-top:7px">Увеличивает или уменьшает всю геометрию относительно заданного центра. P — коэффициент: 2000 = ×2,0; 500 = ×0,5. Полезно для литейных усадок и для отработки на пробной заготовке.</div>
      <pre class="blk" style="margin-top:9px">G51 X0. Y0. Z0. P2000   (всё вдвое больше)\nM98 P1000               (тот же контур подпрограммой)\nG50                     (отмена)</pre>
      <div class="note warn" style="margin-top:9px">Дуги масштабируются вместе с радиусом. Если по осям задать разные коэффициенты, окружность превратится в эллипс, а стойка выдаст тревогу — на дугах разномасштабность не работает.</div>`)}
    ${CARD('Зеркало и поворот',`<div class="ct" style="margin-top:7px">Зеркало: Haas — G101 X0. (отмена G100), Fanuc — G51.1 X0. (отмена G50.1). При зеркале меняется сторона коррекции радиуса: попутное фрезерование становится встречным, G41 работает как G42.</div>
      <pre class="blk" style="margin-top:9px">(правая половина)\nM98 P1000\n(левая половина зеркалом)\nG101 X0.      (Fanuc: G51.1 X0.)\nM98 P1000\nG100          (Fanuc: G50.1)</pre>
      <div class="hint">Поворот системы координат G68 X__ Y__ R__ (угол), отмена G69 — одинаково на обеих стойках. Удобно для отверстий по окружности и наклонных пазов.</div>`)}
    `}
  </div>`;

  if(f==='prog') return `<div class="wrap">
    <div class="note">Программы с разбором. Цифры согласованы: можно подставить свои размеры и пересчитать в «Расчётах».</div>
    ${T?PROG_T.map(x=>progCard(x)).join(''):PROG_F.map(x=>progCard(x)).join('')}
  </div>`;

  return `<div class="wrap">
    ${(T?ERR_T:ERR_F).map(e=>`<div class="card"><div class="glow d"></div>
      <div style="font-family:Oswald;font-size:16px">${esc(e[0])}</div>
      <div class="ct" style="margin-top:6px">${e[1]}</div></div>`).join('')}
  </div>`;
}
function progCard(x){
  return `<div class="card"><div class="glow"></div><div class="tag">${esc(x.tag)}</div>
    <div style="font-family:Oswald;font-size:17px;margin-top:6px">${esc(x.n)}</div>
    <div class="ct" style="margin-top:5px">${esc(x.d)}</div>
    <pre class="blk" style="margin-top:10px">${esc(x.code)}</pre>
    ${x.note?`<div class="note" style="margin-top:9px">${x.note}</div>`:''}</div>`;
}

function itIdx(D){ if(D<=0) return -1; for(let i=0;i<ITR.length;i++) if(D<=ITR[i]) return i; return -1; }
function fieldOf(sym,D){
  const i=itIdx(D); if(i<0) return null;
  const m=sym.match(/^([A-Za-z]+)(\d+)$/); if(!m) return null;
  const L=m[1], q=+m[2], it=IT[q]?IT[q][i]:null; if(it==null) return null;
  if(L==='H') return {es:it,ei:0,it};
  if(L==='JS'||L==='Js') return {es:it/2,ei:-it/2,it};
  if(L==='js') return {es:it/2,ei:-it/2,it};
  if(DEV_M[L]) { const es=-DEV_M[L][i]; return {es,ei:es-it,it}; }
  if(DEV_P[L]) { const ei=DEV_P[L][i]; return {ei,es:ei+it,it}; }
  if(DEV_RS[L]) { let j=-1; for(let n=0;n<RSR.length;n++) if(D<=RSR[n]){j=n;break;}
    if(j<0) return null; const ei=DEV_RS[L][j]; return {ei,es:ei+it,it}; }
  return null;
}

  const out=$('#ftOut'); if(!out) return;
  const [hs,ss]=f.split('/');
  const H=fieldOf(hs,D), S=fieldOf(ss,D);
  if(!H||!S){ out.innerHTML='<div class="note warn">Диаметр вне диапазона таблицы (до 500 мм) или сочетание не поддерживается.</div>'; return; }
  const Hmax=D+H.es/1000, Hmin=D+H.ei/1000, Smax=D+S.es/1000, Smin=D+S.ei/1000;
  const zmax=(H.es-S.ei), zmin=(H.ei-S.es);
  const typ = zmin>=0?'с зазором' : (zmax<=0?'с натягом':'переходная');
  const tgtS=(Smax+Smin)/2, tgtH=(Hmax+Hmin)/2;
  out.innerHTML=`
   <div class="res" style="margin-top:4px">
     <div><div class="f">Отверстие ${esc(hs)}</div><div class="v">${mm(H.ei)} … ${mm(H.es)}</div></div>
     <div><div class="f">Вал ${esc(ss)}</div><div class="v">${mm(S.ei)} … ${mm(S.es)}</div></div>
     <div><div class="f">⌀ отверстия</div><div class="v hot">${nf(Hmin,3)} … ${nf(Hmax,3)}</div></div>
     <div><div class="f">⌀ вала</div><div class="v hot">${nf(Smin,3)} … ${nf(Smax,3)}</div></div>
     <div><div class="f">Допуск отв. / вала</div><div class="v">${H.it} / ${S.it} мкм</div></div>
     <div><div class="f">Тип посадки</div><div class="v">${typ}</div></div>
     <div><div class="f">${zmin>=0?'Зазор мин … макс':'Натяг макс … зазор макс'}</div>
       <div class="v">${nf(zmin/1000,3)} … ${nf(zmax/1000,3)}</div></div>
     <div><div class="f">Настройка станка</div><div class="v hot">вал ${nf(tgtS,3)}</div></div>
   </div>
   <div class="note" style="margin-top:4px"><b>Куда целиться:</b> ставьте размер вала на ${nf(tgtS,3)}, отверстия на ${nf(tgtH,3)} — середина поля. Тогда износ пластины съедает половину допуска, а не весь.</div>`;
}

/* ============ контуры: конусы, радиусы, фаски ============ */
const rd=d=>d*Math.PI/180, dg=r=>r*180/Math.PI;
const nf=(x,n)=>(!isFinite(x)?'—':(Math.round(x*Math.pow(10,n))/Math.pow(10,n)).toFixed(n));
let geoCase=null, geoVals={}, geoLast=null;

const GC=[
{id:'k1',n:'Конус D → d',t:'Один конус между двумя диаметрами',
 f:[['D','D — больший ⌀',50],['d','d — меньший ⌀',30],['L','L — длина конуса',40]],
 c(v){const P=[{n:'P1',x:v.d,z:0},{n:'P2',x:v.D,z:-v.L}];
  const A=dg(Math.atan((v.D-v.d)/(2*v.L)));
  return {pts:P,segs:[{a:0,b:1,lbl:'A'}],info:[['Угол уклона A',nf(A,3)+' °'],['Угол при вершине',nf(2*A,3)+' °'],
   ['Конусность',nf((v.D-v.d)/v.L,4)],['Отношение','1 : '+nf(v.L/((v.D-v.d)||1),2)]]};}},

{id:'k2',n:'Конус A + R у торца',t:'Конус переходит в радиус, касательный к торцу',
 f:[['D','D — ⌀ цилиндра',60],['A','A — угол конуса, °',20],['L','L — от начала конуса до торца',30],['R','R — радиус у торца',8]],
 c(v){const a=rd(v.A), t=(v.L-v.R*(1-Math.sin(a)))/Math.cos(a);
  const P3x=v.D, P3z=-v.L, P2z=-v.L+t*Math.cos(a), P2r=v.D/2-t*Math.sin(a);
  const Cz=-v.R, Cr=P2r-v.R*Math.cos(a);
  const P=[{n:'P1',x:2*Cr,z:0},{n:'P2',x:2*P2r,z:P2z},{n:'P3',x:P3x,z:P3z}];
  return {pts:P,segs:[{a:0,b:1,c:{z:Cz,xr:Cr},r:v.R,conv:1,lbl:'R'},{a:1,b:2,lbl:'A'}],
   info:[['Длина конуса по Z',nf(t*Math.cos(a),3)],['Съём по ⌀ на конусе',nf(2*t*Math.sin(a),3)],
    ['Центр дуги Z',nf(Cz,3)],['Центр дуги X',nf(2*Cr,3)]],
   bad:(t<0||Cr<0)?'Радиус не помещается: уменьшите R или увеличьте L.':null};}},

{id:'k3',n:'Два конуса A и B',t:'Ломаный контур из двух углов',
 f:[['D','D — больший ⌀',60],['d','d — меньший ⌀',30],['L','L — общая длина',40],['A','A — угол от вертикали, °',60],['B','B — угол от оси Z, °',10]],
 c(v){const ta=Math.tan(rd(90-v.A)), tb=Math.tan(rd(v.B));
  const t1=((v.D-v.d)/2-v.L*tb)/(ta-tb), t2=v.L-t1;
  const P=[{n:'P1',x:v.d,z:0},{n:'P2',x:v.d+2*t2*tb,z:-t2},{n:'P3',x:v.D,z:-v.L}];
  return {pts:P,segs:[{a:0,b:1,lbl:'B'},{a:1,b:2,lbl:'A'}],
   info:[['Длина участка A',nf(t1,3)],['Длина участка B',nf(t2,3)],
    ['⌀ в точке стыка',nf(v.d+2*t2*tb,3)],['Съём по ⌀ всего',nf(v.D-v.d,3)]],
   bad:(t1<0||t2<0)?'Углы не сходятся с заданными диаметрами и длиной.':null};}},

{id:'k4',n:'Конус A + галтель R + конус B',t:'Два конуса, сопряжённые радиусом',
 f:[['D','D — больший ⌀',60],['d','d — меньший ⌀',30],['L','L — общая длина',40],['A','A — угол от вертикали, °',60],['B','B — угол от оси Z, °',10],['R','R — радиус сопряжения',5]],
 c(v){const a=rd(90-v.A), bb=rd(v.B), ta=Math.tan(a), tb=Math.tan(bb);
  const t1=((v.D-v.d)/2-v.L*tb)/(ta-tb), t2=v.L-t1;
  const Vz=-t2, Vr=v.d/2+t2*tb, T=v.R*Math.tan((a-bb)/2);
  const P3z=Vz-T*Math.cos(a), P3r=Vr+T*Math.sin(a);
  const P2z=Vz+T*Math.cos(bb), P2r=Vr-T*Math.sin(bb);
  const Cz=P3z+v.R*Math.sin(a), Cr=P3r+v.R*Math.cos(a);
  const P=[{n:'P1',x:v.d,z:0},{n:'P2',x:2*P2r,z:P2z},{n:'P3',x:2*P3r,z:P3z},{n:'P4',x:v.D,z:-v.L}];
  return {pts:P,segs:[{a:0,b:1,lbl:'B'},{a:1,b:2,c:{z:Cz,xr:Cr},r:v.R,conv:0,lbl:'R'},{a:2,b:3,lbl:'A'}],
   info:[['Излом контура Z',nf(Vz,3)],['Излом контура X',nf(2*Vr,3)],
    ['Касательная T',nf(T,3)],['Угол поворота',nf(90-v.A-v.B,2)+' °']],
   bad:((90-v.A)<=v.B)?'Угол A (от вертикали) даёт наклон меньше B — контур не сходится.'
     :(t1<0||t2<0)?'Углы не сходятся с диаметрами и длиной.'
     :(T>t1/Math.cos(a)||T>t2/Math.cos(bb))?'Галтель R'+nf(v.R,2)+' не помещается: касательная '+nf(T,2)+' мм длиннее участка конуса. Уменьшите R.'
     :null};}},

{id:'k5',n:'Конус A + R + цилиндр d',t:'Конус плавно выходит на цилиндр',
 f:[['D','D — больший ⌀',60],['d','d — ⌀ цилиндра',30],['L','L — общая длина',45],['A','A — угол от вертикали, °',60],['R','R — радиус перехода',5]],
 c(v){const a=rd(90-v.A), t1=((v.D-v.d)/2)/Math.tan(a), t2=v.L-t1;
  const Vz=-t2, Vr=v.d/2, T=v.R*Math.tan(a/2);
  const P3z=Vz-T*Math.cos(a), P3r=Vr+T*Math.sin(a);
  const P2z=Vz+T, P2r=Vr;
  const Cz=P3z+v.R*Math.sin(a), Cr=P3r+v.R*Math.cos(a);
  const P=[{n:'P1',x:v.d,z:0},{n:'P2',x:2*P2r,z:P2z},{n:'P3',x:2*P3r,z:P3z},{n:'P4',x:v.D,z:-v.L}];
  return {pts:P,segs:[{a:0,b:1},{a:1,b:2,c:{z:Cz,xr:Cr},r:v.R,conv:0,lbl:'R'},{a:2,b:3,lbl:'A'}],
   info:[['Длина конуса по Z',nf(t1,3)],['Длина цилиндра',nf(t2-T,3)],
    ['Касательная T',nf(T,3)],['Центр дуги Z / X',nf(Cz,2)+' / '+nf(2*Cr,2)]],
   bad:(t2<T)?'Цилиндр короче радиуса перехода: увеличьте L или уменьшите R.'
     :(T>t1/Math.cos(a))?`Радиус R${nf(v.R,2)} не помещается: касательная ${nf(T,2)} мм длиннее конуса. Уменьшите R.`
     :null};}},

{id:'k6',n:'Уступ + галтель R + цилиндр',t:'Ступень с галтелью в углу',
 f:[['D','D — ⌀ буртика',60],['d','d — ⌀ шейки',30],['L','L — от торца до уступа',40],['R','R — галтель',4]],
 c(v){const P=[{n:'P1',x:v.d,z:0},{n:'P2',x:v.d,z:-(v.L-v.R)},{n:'P3',x:v.d+2*v.R,z:-v.L},{n:'P4',x:v.D,z:-v.L}];
  return {pts:P,segs:[{a:0,b:1},{a:1,b:2,c:{z:-v.L+v.R,xr:v.d/2+v.R},r:v.R,conv:0,lbl:'R'},{a:2,b:3}],
   info:[['Начало дуги Z',nf(-(v.L-v.R),3)],['Конец дуги X',nf(v.d+2*v.R,3)],
    ['Центр дуги Z / X',nf(-v.L+v.R,2)+' / '+nf(v.d+2*v.R,2)],['Высота уступа',nf((v.D-v.d)/2,3)]],
   bad:(v.d+2*v.R>v.D)?'Галтель больше высоты уступа.':null};}},

{id:'k7',n:'Скругление кромки R',t:'Радиус на переходе цилиндр — торец',
 f:[['D','D — ⌀ цилиндра',50],['R','R — радиус кромки',5],['L','L — длина цилиндра',30]],

{id:'k8',n:'Сфера R на шейке d',t:'Шар на конце вала',
 f:[['R','R — радиус сферы',20],['d','d — ⌀ шейки',20]],

{id:'k9',n:'Фаска C под углом',t:'Фаска на торце, любой угол',

{id:'k10',n:'Уступ + конус A',t:'Ступень, затем конус к торцу',

 c(v){const x2=v.d+2*v.L*Math.tan(rd(v.A));

{id:'k11',n:'Конус A + цилиндр d',t:'Конус переходит в цилиндр без радиуса',

 c(v){const t=((v.D-v.d)/2)/Math.tan(rd(90-v.A));

{id:'k13',n:'Уступ + галтель R + конус A',t:'Ступень с галтелью, затем конус',
 f:[['D','D — ⌀ буртика',60],['d','d — ⌀ у торца',30],['R','R — галтель',5],['A','A — угол от оси Z, °',20],['L','L — от уступа до торца',25]],
 c(v){const a=rd(v.A), Zc=-v.L+v.R, Xc=v.d/2+(v.R+Math.sin(a)*(v.L-v.R))/Math.cos(a);

   info:[['⌀ конца галтели',nf(2*Xc,3)],['Центр дуги Z / X',nf(Zc,2)+' / '+nf(2*Xc,2)],
    ['⌀ начала конуса',nf(2*(Xc-v.R*Math.cos(a)),3)],['Высота уступа',nf((v.D-2*Xc)/2,3)]],

{id:'k16',n:'R2 + конус A + R1 у торца',t:'Конус с радиусами сверху и снизу',
 f:[['D','D — ⌀ цилиндра',60],['A','A — угол от оси Z, °',25],['L','L — от излома до торца',30],['R1','R1 — радиус у торца',6],['R2','R2 — радиус вверху',5]],
 c(v){const a=rd(v.A), t1=(v.L-v.R1*(1-Math.sin(a)))/Math.cos(a);

  const C1={z:-v.R1,xr:P2r-v.R1*Math.cos(a)};

  const C2={z:-v.L-T2,xr:v.D/2-v.R2};
  const P=[{n:'P1',x:2*C1.xr,z:0},{n:'P2',x:2*P2r,z:P2z},{n:'P3',x:2*P3r,z:P3z},{n:'P4',x:v.D,z:-v.L-T2}];
  return {pts:P,segs:[{a:0,b:1,c:C1,r:v.R1,conv:1,lbl:'R1'},{a:1,b:2,lbl:'A'},{a:2,b:3,c:C2,r:v.R2,conv:1,lbl:'R2'}],

{id:'k17',n:'R + конус A к ⌀ d',t:'Радиус на изломе, конус до малого ⌀',
 f:[['D','D — ⌀ цилиндра',60],['d','d — ⌀ у торца',30],['R','R — радиус на изломе',5],['A','A — угол от оси Z, °',30]],
 c(v){const a=rd(v.A), Xc=v.D/2-v.R;

{id:'k18',n:'Вогнутый радиус ⌀D → ⌀d',t:'Один радиус между двумя диаметрами',

{id:'k19',n:'Полный радиус на торце',t:'Скруглённый конец вала',

 c(v){const h=Math.sqrt(Math.max(v.R*v.R-(v.D/2)*(v.D/2),0));

{id:'k20',n:'Шар R1 + галтель R2 на шейке',t:'Сферическая головка с переходом',

 c(v){const s1=v.R1+v.R2, s2=v.D/2+v.R2, k=s1*s1-s2*s2;

{id:'t3',n:'Резьбовая программа',t:'Метрическая резьба: проходы и кадры G76',

const GALL=GC.concat(GI).concat(GT);


/* общие проверки: перепутанные диаметры и вывернутый контур */
function geoSane(v,r){
  if(v && v.D!==undefined && v.d!==undefined && +v.D<=+v.d)
    return 'Больший ⌀ должен быть больше меньшего — похоже, поля перепутаны.';
  if(r && r.pts) for(let i=1;i<r.pts.length;i++)
    if(r.pts[i].z > r.pts[i-1].z + 1e-9)
      return 'Контур выворачивается: точки идут обратно по Z. Проверьте размеры.';
  return null;
}
function gv(id){ const c=GALL.find(x=>x.id===id); const o=geoVals[id]||(geoVals[id]={});
  c.f.forEach(([k,l,d])=>{ if(o[k]===undefined) o[k]=d; }); return o; }

/* --- отрисовка профиля по рассчитанным точкам --- */
function arcSamples(seg,A,B){
  const a0=Math.atan2(A.xr-seg.c.xr,A.z-seg.c.z), a1=Math.atan2(B.xr-seg.c.xr,B.z-seg.c.z);
  let d=a1-a0; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
  const out=[]; for(let i=1;i<=16;i++){const a=a0+d*i/16;
    out.push({z:seg.c.z+seg.r*Math.cos(a),xr:seg.c.xr+seg.r*Math.sin(a)});}
  return {pts:out,ccw:d>0};
}
function geoDraw(r,W,H,small,inner,c,v){
  const P=r.pts.map(p=>({z:p.z,xr:p.x/2,n:p.n}));
  let zs=[],xs=[];
  P.forEach(p=>{zs.push(p.z);xs.push(p.xr);});
  r.segs.forEach(s=>{if(s.c){zs.push(s.c.z-s.r,s.c.z+s.r);xs.push(Math.max(0,s.c.xr-s.r),s.c.xr+s.r);}});
  const zmin=Math.min(...zs), zmax=Math.max(...zs,0), xmax=Math.max(...xs,1)*(inner?1.25:1);
  const padL=small?10:46, padR=small?10:46, bot=H-(small?12:26), topM=small?10:24;
  const k=Math.min((W-padL-padR)/Math.max(zmax-zmin,0.001),(bot-topM)/xmax);
  const X=z=>padL+(z-zmin)*k, Y=x=>bot-x*k;
  let d=`M ${X(P[0].z)} ${Y(P[0].xr)}`, labels='', dims='';
  r.segs.forEach(s=>{const A=P[s.a],B=P[s.b];
    if(s.c) arcSamples(s,A,B).pts.forEach(q=>{d+=` L ${X(q.z)} ${Y(q.xr)}`;});
    else d+=` L ${X(B.z)} ${Y(B.xr)}`;});
  const last=P[P.length-1], ext=small?8:14, top=small?4:6;
  d+=inner
    ? ` L ${X(last.z)-ext} ${Y(last.xr)} L ${X(last.z)-ext} ${top} L ${X(P[0].z)} ${top} Z`
    : ` L ${X(last.z)-ext} ${Y(last.xr)} L ${X(last.z)-ext} ${bot} L ${X(P[0].z)} ${bot} Z`;

  if(!small){
    const fmt=x=>Number.isInteger(+nf(x,1))?String(Math.round(x)):nf(x,1);
    const has=n=>!!(c&&c.f&&c.f.some(f=>f[0]===n));
    const val=n=>(v&&v[n]!=null)?v[n]:null;
    const used=[];
    const put=(x,y,t,cls)=>{ let px=x,py=y;
      for(const [dx,dy] of [[0,0],[0,12],[0,-12],[-24,0],[24,0],[0,22],[-24,-12],[24,12]]){
        px=x+dx; py=y+dy;
        if(!used.some(u=>Math.abs(u.x-px)<26&&Math.abs(u.y-py)<10)) break; }
      used.push({x:px,y:py});
      return `<text ${cls||''} x="${px}" y="${py}">${t}</text>`; };
    P.forEach(p=>{ const cx=X(p.z), cy=Y(p.xr);
      labels+=`<circle cx="${cx}" cy="${cy}" r="3" fill="#FF6B00"/>`+put(cx+6,cy-7,p.n); });

    const cap=(x,y,h)=>h?`<line class="dim" x1="${x}" y1="${y-4}" x2="${x}" y2="${y+4}"/>`
                        :`<line class="dim" x1="${x-4}" y1="${y}" x2="${x+4}" y2="${y}"/>`;
    // D — наибольший ⌀, вынесен слева от детали
    const iMax=P.reduce((a,p,i)=>p.xr>P[a].xr?i:a,0);
    if(has('D')){ const xD=X(zmin)-14;
      dims+=`<line class="dim" x1="${xD}" y1="${Y(0)}" x2="${xD}" y2="${Y(P[iMax].xr)}"/>${cap(xD,Y(0))}${cap(xD,Y(P[iMax].xr))}
        <line class="dim" x1="${xD}" y1="${Y(P[iMax].xr)}" x2="${X(P[iMax].z)}" y2="${Y(P[iMax].xr)}" stroke-dasharray="2 3"/>
        <text class="dm" x="4" y="${(Y(0)+Y(P[iMax].xr))/2+4}">D ${fmt(val('D'))}</text>`; }
    if(has('d')&&P[0].xr>0.01){ const xd=X(0)+13;
      dims+=`<line class="dim" x1="${xd}" y1="${Y(0)}" x2="${xd}" y2="${Y(P[0].xr)}"/>${cap(xd,Y(0))}${cap(xd,Y(P[0].xr))}
        <text class="dm" x="${xd+5}" y="${(Y(0)+Y(P[0].xr))/2+4}">d ${fmt(val('d'))}</text>`; }
    if(has('L')){ const yL=bot-8;
      dims+=`<line class="dim" x1="${X(zmin)}" y1="${yL}" x2="${X(0)}" y2="${yL}"/>${cap(X(zmin),yL,1)}${cap(X(0),yL,1)}
        <text class="dm" x="${(X(zmin)+X(0))/2-14}" y="${yL-4}">L ${fmt(val('L'))}</text>`; }
    // R и углы
    r.segs.forEach(s=>{const A=P[s.a],B=P[s.b];
      if(s.c){ const m=arcSamples(s,A,B).pts[7]||B;
        const ux=(m.z-s.c.z)/s.r, uy=(m.xr-s.c.xr)/s.r;
        dims+=`<line class="dim" x1="${X(s.c.z)}" y1="${Y(s.c.xr)}" x2="${X(m.z)}" y2="${Y(m.xr)}" stroke-dasharray="3 3"/>`
          +put(X(m.z)+ux*16-7, Y(m.xr)-uy*16+4, (s.lbl||'R')+' '+fmt(s.r), 'class="dm"');
      } else { const dz=B.z-A.z, dx=B.xr-A.xr;
        if(s.lbl==='C'){
          dims+=`<line class="dim" x1="${X(A.z)}" y1="${Y(A.xr)+13}" x2="${X(B.z)}" y2="${Y(A.xr)+13}"/>
            ${cap(X(A.z),Y(A.xr)+13,1)}${cap(X(B.z),Y(A.xr)+13,1)}`
            +put((X(A.z)+X(B.z))/2-8, Y(A.xr)+27, 'C '+fmt(Math.abs(B.z-A.z)), 'class="dm"'); }
        if(Math.abs(dz)>0.01&&Math.abs(dx)>0.01){
          const ang=Math.abs(dg(Math.atan2(dx,dz))), a2=ang>90?180-ang:ang;
          const nm=(s.lbl&&s.lbl!=='C')?s.lbl:'A';
          const arcR=17, mz=(A.z+B.z)/2, mx=(A.xr+B.xr)/2;
          dims+=`<path class="dim" d="M ${X(mz)+arcR} ${Y(mx)} A ${arcR} ${arcR} 0 0 0 ${X(mz)+arcR*Math.cos(rd(a2))} ${Y(mx)+arcR*Math.sin(rd(a2))}" fill="none"/>`
            +put(X(mz)+arcR+4,Y(mx)+9,nm+' '+fmt(a2)+'°','class="dm"'); }
      }});
  }
  return `<svg class="dia" viewBox="0 0 ${W} ${H}">
    <line class="ax" x1="6" y1="${bot}" x2="${W-6}" y2="${bot}"/>
    <path class="part" d="${d}"/>${dims}${labels}
    ${small?'':`<text class="d" x="${W-34}" y="${bot-4}">Z+</text>`}
    ${small||!inner?'':`<text class="d" x="10" y="14">металл</text>`}</svg>`;
}


/* --- компенсация радиуса при вершине: смещение контура для программирования без G41/G42 --- */
let geoNose={on:false,r:0.4,inner:false};
function segNorm(S,P,s,pt,sx){
  sx=sx||1;
  /* прямая: для расточки нормаль разворачивается целиком, а не зеркалится по одной оси */
  if(!s.c){const A=P[s.a],B=P[s.b],uz=B.z-A.z,ux=B.xr-A.xr,L=Math.hypot(uz,ux);
    return [sx*ux/L,-sx*uz/L];}
  /* дуга: сторону уже задаёт conv, разворачивать нельзя */
  const dz=pt.z-s.c.z, dx=pt.xr-s.c.xr, L=Math.hypot(dz,dx)||1;
  return s.conv?[dz/L,dx/L]:[-dz/L,-dx/L];
}
function xLL(a,b,near){
  const det=a.uz*(-b.ux)-a.ux*(-b.uz);
  if(Math.abs(det)<1e-9) return near;
  const rz=b.pz-a.pz, rx=b.px-a.px;
  const t=(rz*(-b.ux)-rx*(-b.uz))/det;
  return {z:a.pz+t*a.uz, xr:a.px+t*a.ux};
}
function xLA(l,c,near){
  const fz=l.pz-c.cz, fx=l.px-c.cx;
  const B=2*(fz*l.uz+fx*l.ux), C=fz*fz+fx*fx-c.R*c.R, D=B*B-4*C;
  if(D<-1e-6) return near;                 /* допуск на касательный стык */
  const Dc=Math.max(D,0);
  const s1=(-B+Math.sqrt(Dc))/2, s2=(-B-Math.sqrt(Dc))/2;
  const p1={z:l.pz+s1*l.uz,xr:l.px+s1*l.ux}, p2={z:l.pz+s2*l.uz,xr:l.px+s2*l.ux};
  return Math.hypot(p1.z-near.z,p1.xr-near.xr)<Math.hypot(p2.z-near.z,p2.xr-near.xr)?p1:p2;
}
function geoComp(res,r){
  if(!(r>0)||!res.pts) return null;
  const sx=geoNose.inner?-1:1;
  const P=res.pts.map(p=>({z:p.z,xr:p.x/2})), S=res.segs;
  for(let i=0;i<S.length;i++){ const s=S[i];
    if(!s.c){ const A=P[s.a],B=P[s.b], len=Math.hypot(B.z-A.z,B.xr-A.xr);
      if(len>1e-6 && len<r) return {bad:'Участок длиной '+nf(len,2)+' мм короче радиуса пластины r'+nf(r,2)+' — этим резцом такой уступ не проработать.'}; } }
  for(const s of S) if(s.c&&!s.conv&&s.r<=r) return {bad:`Радиус при вершине r${nf(r,2)} не меньше вогнутого радиуса R${nf(s.r,2)} — такой контур этим резцом не выйдет.`};
  const cur=S.map(s=>{ if(s.c) return {t:'arc',cz:s.c.z-r,cx:s.c.xr-r*sx,R:(s.conv?s.r+r:s.r-r)};
    const A=P[s.a],B=P[s.b],uz=B.z-A.z,ux=B.xr-A.xr,L=Math.hypot(uz,ux),nz=sx*ux/L,nx=-sx*uz/L;
    return {t:'line',pz:A.z+r*nz-r,px:A.xr+r*nx-r*sx,uz:uz/L,ux:ux/L};});
  const first={t:'line',pz:P[0].z,px:P[0].xr-r*sx,uz:0,ux:1};
  const lp=P[P.length-1], last={t:'line',pz:lp.z-r,px:lp.xr,uz:-1,ux:0};
  const out=[];
  for(let i=0;i<P.length;i++){
    const ip=S.findIndex(s=>s.b===i), inx=S.findIndex(s=>s.a===i);
    const cp=ip>=0?cur[ip]:first, cn=inx>=0?cur[inx]:last;
    const np=ip>=0?segNorm(S,P,S[ip],P[i],sx):[1,0], nn=inx>=0?segNorm(S,P,S[inx],P[i],sx):[0,sx];
    const near={z:P[i].z+r*nn[0]-r, xr:P[i].xr+r*nn[1]-r*sx};
    let q=near;
    if(Math.hypot(np[0]-nn[0],np[1]-nn[1])>1e-6){
      if(cp.t==='line'&&cn.t==='line') q=xLL(cp,cn,near);
      else if(cp.t==='line') q=xLA(cp,cn,near);
      else if(cn.t==='line') q=xLA(cn,cp,near);
    }
    out.push({n:res.pts[i].n,x:2*q.xr,z:q.z});
  }
  return {pts:out,segR:S.map(s=>s.c?(s.conv?s.r+r:s.r-r):null)};
}

function geoCalc(){
  const c=GALL.find(x=>x.id===geoCase); if(!c) return;
  const v=gv(geoCase);
  document.querySelectorAll('#geoForm input,#geoForm select').forEach(e=>{v[e.dataset.k]=+e.value;});
  geoNose.inner=!!c.inner;
  let r; try{ r=c.c(v); }catch(e){ r={info:[],bad:'Проверьте размеры.'}; }
  if(r&&!r.bad){ const sane=geoSane(v,r); if(sane) r={...r,bad:sane}; }
  $('#geoBad').innerHTML=r.bad?`<div class="note warn" style="margin-bottom:11px"><b>${esc(r.bad)}</b></div>`:'';
  $('#geoPic').innerHTML=r.pts?geoDraw(r,300,150,false,c.inner,c,v):'';
  let K=null;
  if(geoNose.on&&r.pts){ K=geoComp(r,geoNose.r);
    if(K&&K.bad){ $('#geoBad').innerHTML=`<div class="note warn" style="margin-bottom:11px"><b>${esc(K.bad)}</b></div>`; K=null; } }
  const tb=$('#geoTab');
  if(r.pts){ tb.innerHTML=`<thead><tr><th>Точка</th><th>X (⌀)</th><th>Z</th>${K?'<th>X с комп.</th><th>Z с комп.</th>':''}</tr></thead><tbody>`+
    r.pts.map((p,i)=>`<tr><td style="font-family:Oswald;font-size:14px;color:var(--ember)">${p.n}</td>
      <td class="num">${nf(p.x,3)}</td><td class="num">${nf(p.z,3)}</td>
      ${K?`<td class="num" style="color:#5FA8FF">${nf(K.pts[i].x,3)}</td><td class="num" style="color:#5FA8FF">${nf(K.pts[i].z,3)}</td>`:''}</tr>`).join('')+`</tbody>`; }
  else tb.innerHTML='';
  $('#gres').innerHTML=(r.info||[]).map(x=>`<div><div class="f">${esc(x[0])}</div><div class="v">${esc(x[1])}</div></div>`).join('');
  let code=r.code;
  if(r.pts){
    const P=r.pts, Q=K?K.pts:P;
    code=`(${c.n.toUpperCase()}${K?' · С КОМПЕНСАЦИЕЙ r'+nf(geoNose.r,2):''})\n`
      +(K?`(координаты уже смещены — G41/G42 не включать)\n`:`(профиль детали — работать с G41/G42)\n`)
      +`G00 X${nf(Q[0].x,3)} Z2.\nG01 Z${nf(Q[0].z,3)} F0.15\n`;
    r.segs.forEach((s,i)=>{const A={z:P[s.a].z,xr:P[s.a].x/2}, B={z:P[s.b].z,xr:P[s.b].x/2};
      if(s.c){const sm=arcSamples(s,A,B), rr=K?K.segR[i]:s.r;
        code+=`${sm.ccw?'G03':'G02'} X${nf(Q[s.b].x,3)} Z${nf(Q[s.b].z,3)} R${nf(rr,3)}\n`;}
      else code+=`G01 X${nf(Q[s.b].x,3)} Z${nf(Q[s.b].z,3)}\n`;});
    code+=`(далее по контуру)`;
    if(K) code+=`\n\n(${geoNose.inner?'расточной резец':'правый наружный резец'}, точение к патрону)`;
  }
  $('#gcode').textContent=code||'';
  geoLast={t:c.n,v:c.f.map(([k,l])=>l.split(' —')[0]+' '+nf(v[k],2)).join(' · '),c:code||''};
  geoHist();
}

    const ae=2*Math.sqrt(Math.max(2*R*rz-rz*rz,0));
    $('#mOut1').innerHTML=nf(ae,3)+'<small>мм шаг строчки</small>';};
    ['mD','mRz'].forEach(i=>$('#'+i).oninput=c); c(); }
  const eD=$('#eD');
  if(eD){ const c=()=>{const D=+eD.value||1,ap=+$('#eA').value||0;
    /* Формула хорды 2·√(ap·(D−ap)) верна только пока фреза врезана не глубже своего
       радиуса. За серединой шара она начинает убывать и при ap = D даёт ноль, тогда
       как в резе уже работает полный диаметр. Ошибка всегда занижала эффективный ⌀,
       то есть всегда завышала обороты: D=10, ap=9.5 давало 4.36 мм и обороты в
       2.3 раза выше нужных. Глубже радиуса диаметр в резе равен номинальному. */
    if(!(D>0)||!(ap>0)){ $('#mOut2').innerHTML='—<small style="font-size:13px">задайте ⌀ фрезы и глубину</small>'; return; }
    if(ap>D){ $('#mOut2').innerHTML='—<small style="font-size:13px">глубина больше ⌀ фрезы: сферой такой уступ не снять</small>'; return; }
    const de=ap>=D/2?D:2*Math.sqrt(ap*(D-ap));
    $('#mOut2').innerHTML=nf(de,2)+'<small>мм эффективный ⌀ ('+nf(de/D*100,0)+' % от номинала)'+(ap>=D/2?' · глубже радиуса работает полный ⌀':'')+'</small>';};
    ['eD','eA'].forEach(i=>$('#'+i).oninput=c); c(); }
  const aD=$('#aD');
  if(aD){ const c=()=>{const D=+aD.value||1,R=+$('#aR').value||1,F=+$('#aF').value||0,t=$('#aT').value;
    if(t==='in'&&R<=D/2){ $('#mOut3').innerHTML='—<small style="font-size:13px">радиус контура меньше радиуса фрезы: угол не выйдет</small>'; return; }
    const k=t==='out'?(R+D/2)/R:(R-D/2)/R;
    const Fk=F*k;
    $('#mOut3').innerHTML=nf(Fk,0)+'<small>мм/мин задать в кадре ('+(k>1?'+':'')+nf((k-1)*100,0)+' %)</small>';};
    ['aD','aR','aF','aT'].forEach(i=>{$('#'+i).oninput=c;$('#'+i).onchange=c;}); c(); }
  const sD=$('#sD');
  if(sD){ const c=()=>{const D=+sD.value||1,h=+$('#sH').value||0.1,T=+$('#sT').value||1,F=+$('#sF').value||1;
    const N=Math.max(1,Math.ceil(T/h)), hEff=T/N;            // витков целое, глубина ровно T
    const ang=Math.atan2(hEff,Math.PI*D)*180/Math.PI;
    const len=N*Math.sqrt(Math.pow(Math.PI*D,2)+hEff*hEff), tmin=len/F;
    $('#mOut4').innerHTML=nf(ang,2)+'<small>° угол врезания · '+N+' витков по '+nf(hEff,3)+' мм · '+nf(tmin*60,0)+' с</small>';
    $('#mCode').textContent='(VREZANIE PO SPIRALI '+nf(D,1)+' MM NA '+nf(T,2)+')\nG17 G90\nG00 X'+nf(D/2,3)+' Y0.\nG01 Z0. F'+nf(F,0)+
      '\nG91 G03 I-'+nf(D/2,3)+' Z-'+nf(hEff,3)+' F'+nf(F,0)+' L'+N+'   (Fanuc: K'+N+')\nG90';};
    ['sD','sH','sT','sF'].forEach(i=>$('#'+i).oninput=c); c(); }
  const kD=$('#kD');
  if(kD){const c=()=>{const D=+kD.value||1,V=+$('#kV').value||0,Z=+$('#kZ').value||1,F=+$('#kF').value||0;
    const n=1000*V/(Math.PI*D); $('#kOutN').innerHTML=Math.round(n)+'<small>об/мин</small>';
    $('#kOutF').innerHTML=Math.round(n*Z*F)+'<small>мм/мин</small>';};
    ['kD','kV','kZ','kF'].forEach(i=>$('#'+i).oninput=c); c();}
  const vD=$('#vD');
  if(vD){const c=()=>{const D=+vD.value||0,n=+$('#vN').value||0;
    $('#vOut').innerHTML=(Math.PI*D*n/1000).toFixed(0)+'<small>м/мин</small>';};
    ['vD','vN'].forEach(i=>$('#'+i).oninput=c); c();}
  const rF=$('#rF');
  if(rF){const c=()=>{const f=+rF.value||0,r=+$('#rR').value||0.1;
    const rz=f*f/(8*r)*1000;
    $('#rOut').innerHTML=nf(rz,1)+'<small>мкм гребешок Rz · Ra ≈ '+nf(rz/4,2)+'</small>';};
    ['rF','rR'].forEach(i=>$('#'+i).oninput=c); c();}
}

/* --- числовые поля: очищаются при нажатии, цифровая клавиатура --- */
function numFix(){
  document.querySelectorAll('input[type=number]').forEach(el=>{
    if(el.dataset.nf) return; el.dataset.nf='1';
    el.setAttribute('inputmode','decimal');
    el.addEventListener('focus',()=>{ el.dataset.prev=el.value; el.value='';
      setTimeout(()=>{ try{ el.select(); }catch(e){} },0); });
    el.addEventListener('blur',()=>{ if(el.value.trim()===''){
      el.value=el.dataset.prev||''; el.dispatchEvent(new Event('input',{bubbles:true})); } });
  });
}

/* высота экрана: берём реально видимую область, а не «теоретическую» */
var _baseH=0, _fitT=null;
function fitH(){
  try{
    var d=document.querySelector('.device');
    if(!d) return;
    if(window.innerWidth>760){ d.style.height=''; return; }
    var vv=window.visualViewport;
    var h=vv?vv.height:window.innerHeight;
    if(!h) return;
    if(h>_baseH) _baseH=h;
    if(_baseH && h < _baseH*0.72) return;   /* вылезла клавиатура — не трогаем */
    d.style.height=Math.round(h)+'px';
  }catch(e){}
}
function fitSoon(){ clearTimeout(_fitT); _fitT=setTimeout(fitH,60); }
window.addEventListener('resize',fitSoon);
window.addEventListener('orientationchange',function(){setTimeout(function(){_baseH=0;fitH();},250);});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',fitSoon);
  window.visualViewport.addEventListener('scroll',fitSoon);
}
window.addEventListener('scroll',fitSoon,{passive:true});
document.addEventListener('DOMContentLoaded',fitH);
window.addEventListener('load',function(){fitH();setTimeout(fitH,300);setTimeout(fitH,900);});
fitH();
